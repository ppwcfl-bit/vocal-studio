// ===================== Sound classifier =====================
// Splits the live frame stream into stretches of activity and labels each one:
// 'speech' | 'singing' | 'humming' | 'guitar' | 'noise'. Pure functions; no DOM.

function vcRuns(frames) {
  // consecutive voiced frames (gap ≤ 40 ms)
  const runs = [];
  let cur = null;
  for (const f of frames) {
    if (!f.voiced) { if (cur && f.t - cur[cur.length - 1].t > 0.04) { runs.push(cur); cur = null; } continue; }
    if (cur && f.t - cur[cur.length - 1].t > 0.04) { runs.push(cur); cur = null; }
    (cur = cur || []).push(f);
  }
  if (cur) runs.push(cur);
  return runs;
}

// Frame-to-frame pitch jitter in cents, after removing the slow trend (vibrato, glides).
function vcJitter(run) {
  // analysis windows overlap ~4×, so sample every 4th frame (≈ independent windows)
  const m = run.filter((_, i) => i % 4 === 0).map((f) => f.midi * 100);
  if (m.length < 5) return null;
  const res = [];
  for (let i = 1; i < m.length - 1; i++) res.push(m[i] - (m[i - 1] + m[i + 1]) / 2);
  const mu = res.reduce((a, b) => a + b, 0) / res.length;
  return Math.sqrt(res.reduce((a, b) => a + (b - mu) ** 2, 0) / res.length);
}

function vcFeatures(frames, sr) {
  sr = sr || 48000;
  const act = frames.filter((f) => f.rms > 0.004);
  if (!act.length) return null;
  const dur = act[act.length - 1].t - act[0].t + 0.011;
  const voiced = frames.filter((f) => f.voiced);
  const voicedRatio = voiced.length / Math.max(1, act.length);
  const runs = vcRuns(frames).filter((r) => r.length >= 3);
  const runLens = runs.map((r) => r[r.length - 1].t - r[0].t + 0.011).sort((a, b) => a - b);
  const medRun = runLens.length ? runLens[runLens.length >> 1] : 0;
  // held = stretches of ≥ 200 ms where pitch stays within ±50 cents of its running median
  let held = 0;
  for (const r of runs) {
    let st = 0;
    for (let i = 1; i <= r.length; i++) {
      const seg = r.slice(st, i), med = seg.map((f) => f.midi).sort((a, b) => a - b)[seg.length >> 1];
      if (i === r.length || Math.abs(r[i].midi - med) > 0.5) {
        const d = r[i - 1].t - r[st].t;
        if (d >= 0.2) held += d;
        st = i;
      }
    }
  }
  const voicedDur = runLens.reduce((a, b) => a + b, 0);
  const heldRatio = voicedDur ? held / voicedDur : 0;
  // glide speed (semitones / s) inside voiced runs
  const sl = [];
  for (const r of runs) for (let i = 1; i < r.length; i++) sl.push(Math.abs(r[i].midi - r[i - 1].midi) / Math.max(0.005, r[i].t - r[i - 1].t));
  sl.sort((a, b) => a - b);
  const glide = sl.length ? sl[sl.length >> 1] : 0;
  // brightness: transient energy relative to what a pure tone at this pitch would give (≈1 for a sine)
  const br = voiced.filter((f) => f.f > 0 && f.rms > 0).map((f) => f.hf / (f.rms * f.rms * Math.pow((2 * Math.PI * f.f) / sr, 2)));
  br.sort((a, b) => a - b);
  const brightness = br.length ? br[br.length >> 1] : 0;
  const jit = runs.map(vcJitter).filter((x) => x != null).sort((a, b) => a - b);
  const jitter = jit.length ? jit[jit.length >> 1] : null;
  const onsets = gtrOnsetsFromFrames(frames);
  // decaying runs: start right after a pick attack and lose ≥ 60% of their level by the end (plucked strings)
  let decaying = 0;
  for (const r of runs) {
    if (r.length < 12) continue;
    const near = onsets.some((o) => r[0].t - o > -0.03 && r[0].t - o < 0.12);
    const a = Math.max(...r.slice(0, 6).map((f) => f.rms)), b = r.slice(-5).reduce((s, f) => s + f.rms, 0) / 5;
    if (near && b < a * 0.4) decaying++;
  }
  const longRuns = runs.filter((r) => r.length >= 12).length;
  return { dur, voicedRatio, heldRatio, medRun, runsPerSec: runs.length / dur, glide, brightness, jitter, onsetRate: onsets.length / dur, decayFrac: longRuns ? decaying / longRuns : 0, runs: runs.length };
}

function vcClassify(frames, sr) {
  const F = vcFeatures(frames, sr);
  if (!F || F.dur < 0.25) return { kind: 'noise', F };
  const guitarish = (F.onsetRate >= 0.7 && (F.decayFrac >= 0.5 || (F.jitter != null && F.jitter < 1.2))) || (F.decayFrac >= 0.6 && F.onsetRate >= 0.4);
  if (guitarish && F.heldRatio > 0.3 && F.jitter != null && F.jitter >= 1.5 && F.decayFrac < 0.5) {
    // a voice over strums: report singing; the accompaniment filter separates them later
  } else if (guitarish) return { kind: 'guitar', F };
  if (F.voicedRatio < 0.25) return { kind: 'noise', F };
  const speechLike = F.medRun < 0.38 && F.runsPerSec >= 1.4 && F.heldRatio < 0.45;
  if (speechLike) return { kind: 'speech', F };
  if (F.heldRatio >= 0.3 || F.medRun >= 0.6) return { kind: F.brightness > 0 && F.brightness < 6 ? 'humming' : 'singing', F };
  return { kind: F.glide > 6 ? 'speech' : 'singing', F };
}

// Streaming segmenter: feed frames, get a callback with each finished stretch of sound.
class VcSegmenter {
  constructor(onSegment, opts) {
    opts = opts || {};
    this.onSegment = onSegment; this.hang = opts.hang || 0.5; this.cur = null; this.lastActive = -9; this.floor = 0.003; this.gateUntil = -1; this.maxLen = opts.maxLen || 12;
  }
  gate(until) { this.gateUntil = Math.max(this.gateUntil, until); if (this.cur) this.cur = null; }
  push(f) {
    if (f.t < this.gateUntil) return;
    const thr = Math.max(0.0045, this.floor * 3);
    const active = f.rms > thr;
    if (!active) this.floor = f.rms < this.floor ? this.floor * 0.95 + f.rms * 0.05 : this.floor * 0.998 + f.rms * 0.002;
    if (active) {
      if (!this.cur) { this.cur = []; this.onStart && this.onStart(f.t); }
      this.lastActive = f.t;
    }
    if (this.cur) {
      this.cur.push(f);
      const tooLong = this.cur.length && f.t - this.cur[0].t > this.maxLen;
      if (f.t - this.lastActive > this.hang || tooLong) {
        const seg = this.cur; this.cur = null;
        const trimmed = seg.filter((x) => x.t <= this.lastActive + 0.02);
        if (trimmed.length > 8) this.onSegment(trimmed, vcClassify(trimmed, this.sr));
      }
    }
  }
}

// Accompaniment filter: drop voiced frames that belong to plucked strings (attack-locked, decaying, near-zero jitter).
function vcVoiceOnly(frames) {
  const onsets = gtrOnsetsFromFrames(frames);
  const drop = new Set();
  for (const r of vcRuns(frames)) {
    const j = vcJitter(r);
    const near = onsets.some((o) => r[0].t - o > -0.03 && r[0].t - o < 0.12);
    const a = Math.max(...r.slice(0, Math.min(6, r.length)).map((f) => f.rms)), b = r.slice(-5).reduce((s, f) => s + f.rms, 0) / Math.min(5, r.length);
    const stringLike = (j != null && j < 1.2 && near) || (near && b < a * 0.4 && (j == null || j < 2.5));
    if (stringLike) r.forEach((f) => drop.add(f));
  }
  // the first 80 ms after each attack is pick noise, never voice
  return frames.map((f) => (drop.has(f) || onsets.some((o) => f.t - o >= 0 && f.t - o < 0.08) ? { ...f, voiced: false, midi: null } : f));
}

// ===================== Coach voice I/O =====================
// Speaking: the device's speech synthesizer (Web Speech API).
// Hearing words: the device's speech recognizer (where the browser has one). Singing never goes
// through speech recognition: it is analysed from the raw audio by the pitch pipeline.

const Say = {
  speaking: false, voice: null, listeners: new Set(), _ka: 0,
  available() { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; },
  pickVoice() {
    if (!this.available()) return null;
    const vs = speechSynthesis.getVoices().filter((v) => /^en(-|_|$)/i.test(v.lang));
    const want = Store.data.profile.coachVoice;
    const score = (v) => (v.name === want ? 100 : 0) + (/premium|enhanced|neural|natural/i.test(v.name) ? 20 : 0) + (/samantha|ava|allison|zoe|evan|nathan|aaron|google us english|jenny|aria|guy/i.test(v.name) ? 8 : 0) + (/en-US/i.test(v.lang) ? 3 : 0) + (v.localService ? 1 : 0);
    vs.sort((a, b) => score(b) - score(a));
    this.voice = vs[0] || null;
    return this.voice;
  },
  onState(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  _set(v) { this.speaking = v; this.listeners.forEach((f) => f(v)); },
  // Speak text; resolves when finished (or after a safety timeout, since some browsers drop the end event).
  speak(text, opts) {
    opts = opts || {};
    const clean = speakable(text);
    if (!this.available() || Store.data.profile.coachMuted) return sleep(Math.min(6000, 900 + clean.length * 45));
    return new Promise(async (resolve) => {
      // iPhone drops an utterance started right after cancel(), and can be left "paused": settle first
      try { if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); await sleep(150); } if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(clean);
      if (!this.voice) this.pickVoice();
      if (this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || 'en-US';
      u.rate = Store.data.profile.coachRate || 1.0; u.pitch = 1; u.volume = 1;
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(to); clearInterval(this._ka); this._set(false); resolve(); };
      u.onend = finish; u.onerror = (ev) => { this.lastError = ev && ev.error; finish(); }; u.onstart = () => { this.lastError = null; };
      u.onboundary = () => { try { if (typeof avatarKick === 'function') avatarKick(); } catch (e) {} };
      const to = setTimeout(finish, 2500 + clean.length * 95);
      this._set(true);
      speechSynthesis.speak(u);
      // Chrome stops long utterances after ~15 s unless nudged
      clearInterval(this._ka);
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isChrome = /Chrome\//.test(navigator.userAgent) && !/Edg\//.test(navigator.userAgent) && !iOS;
      if (isChrome) this._ka = setInterval(() => { if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); speechSynthesis.resume(); } }, 10000);
      // if nothing starts within 2.5 s the device refused to speak: say so instead of failing silently
      this._started = false; u.addEventListener('start', () => { this._started = true; });
      setTimeout(() => { if (!this._started && !done) { this.lastError = this.lastError || 'no-start'; } }, 2500);
      if (opts.signal) opts.signal.onabort = () => { try { speechSynthesis.cancel(); } catch (e) {} finish(); };
    });
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} this._set(false); },
};
if ('speechSynthesis' in window) { try { speechSynthesis.onvoiceschanged = () => Say.pickVoice(); } catch (e) {} }

// Turn coaching text into something a speech engine reads naturally.
function speakable(t) {
  return String(t)
    .replace(/(\d+)\s*¢/g, (m, n) => n + (n === '1' ? ' cent' : ' cents'))
    .replace(/±/g, 'plus or minus ')
    .replace(/([A-G])♯(\d)/g, '$1 sharp $2').replace(/([A-G])♭(\d)/g, '$1 flat $2')
    .replace(/([A-G])♯/g, '$1 sharp').replace(/([A-G])♭/g, '$1 flat')
    .replace(/\b([A-G])(\d)\b/g, '$1 $2')
    .replace(/(\d+)\s*ms\b/g, '$1 milliseconds').replace(/(\d+)\s*dB\b/g, '$1 decibels').replace(/(\d+)\s*Hz\b/g, '$1 hertz')
    .replace(/[“”]/g, '"').replace(/—/g, ', ').replace(/\s+/g, ' ').trim();
}

const Hear = {
  rec: null, on: false, listeners: new Set(), err: null, lastText: '',
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  onText(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  // Continuous recognition with auto-restart. Must be first called from a tap.
  start() {
    if (!this.supported() || this.on) return this.supported();
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new R();
    rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue;
        const text = e.results[i][0].transcript.trim();
        if (text) { this.lastText = text; this.listeners.forEach((f) => f(text, performance.now())); }

    rec.onerror = (e) => { this.err = e.error; if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { this.on = false; this.listeners.forEach((f) => f(null, 0, e.error)); } };

    this.rec = rec; this.on = true; this.err = null;
    try { rec.start(); } catch (e) { this.on = false; return false; }
    return true;
  },
  stop() { this.on = false; if (this.rec) { try { this.rec.abort(); } catch (e) {} } this.rec = null; },
};

// What the person said → what to do. Order matters: health first.
function coachIntent(text) {
  const t = ' ' + String(text || '').toLowerCase().replace(/[^\w\s']/g, ' ') + ' ';
  const has = (re) => re.test(t);
  if (has(/\b(hurts?|hurting|pain|painful|sore|scratchy|scratch|hoarse|raspy|burn|burning|ache|aching|strain(ed|ing)?|tight throat|lost my voice)\b/)) return { intent: 'pain' };
  if (has(/\b(end|stop|finish|quit|that's enough|done for today)\b/) && !has(/\b(don't|dont) stop\b/)) return { intent: 'end' };
  if (has(/\b(pause|hold on|wait|give me a (sec|second|minute|moment)|one (sec|second|moment))\b/)) return { intent: 'pause' };
  if (has(/\b(resume|continue|carry on|i'm ready|im ready|ready|let's go|lets go|keep going)\b/)) return { intent: 'resume' };
  if (has(/\b(play|sing|demo|show)\b.*\b(again|that|it|me)\b|\blet me hear\b|\bhear (it|that) again\b|\bone more time\b.*\b(play|hear)\b/)) return { intent: 'demo' };
  if (has(/\b(skip|next( one| exercise)?|move on|something else|different exercise)\b/)) return { intent: 'next' };
  if (has(/\b(too high|lower|bring it down|go down)\b/)) return { intent: 'lower' };
  if (has(/\b(too low|higher|bring it up|go up)\b/)) return { intent: 'higher' };
  if (has(/\b(slower|slow (it )?down|too fast)\b/)) return { intent: 'slower' };
  if (has(/\b(try (it )?again|again|one more|let me try|redo|repeat)\b/)) return { intent: 'retry' };
  if (has(/\b(how did i do|how was (that|it)|my score|did i (do|get it))\b/)) return { intent: 'how' };
  if (has(/\b(don'?t (get|understand)|confus|what do you mean|i'?m lost|huh|not sure what)\b/)) return { intent: 'confused' };
  if (has(/\b(frustrat|i can'?t do (this|it)|this is (too )?hard|give up|ugh)\b/)) return { intent: 'frustrated' };
  if (has(/\b(work on|practi[cs]e|focus on|help (me )?with|get better at)\b/) && focusFromText(t)) return { intent: 'focus' };
  if (has(/\b(playing|play|with) (the |my )?guitar\b/)) return { intent: has(/\b(not|stopped|without)\b/) ? 'guitar-off' : 'guitar-on' };
  if (has(/\b(tired|not great|bit rough|so so|meh|sleepy)\b/)) return { intent: 'feel-tired' };
  if (has(/\b(good|great|fine|ok|okay|alright|all right|well|awesome|fantastic|not bad)\b/) && t.split(' ').length < 12) return { intent: 'feel-good' };
  if (has(/\b(yes|yeah|yep|sure)\b/) && t.split(' ').length < 6) return { intent: 'yes' };
  if (has(/\b(no|nope|nah)\b/) && t.split(' ').length < 6) return { intent: 'no' };
  return { intent: 'talk' };
}

    else if (act === 'match') { App.lesson = null; go('exercise', { id: 'match' }); }
    else if (act === 'range') go('range');
  });
  if (!p.onboarded) onboarding();
};

}

VIEWS.live = (el) => {
  const p = Store.data.profile;
  const r = rangeOf();
  let target = null, mode = 'free';
  const TOL = 25;
  el.innerHTML = `
    <div class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">Live Coach</span><h2>Sing and see every note</h2></div>
      <div class="row" style="gap:8px"><span class="level"><i id="lv"></i></span><span class="chip" id="mic-chip">Mic off</span></div></div>
    <div id="mic-msg"></div>
    <section class="panel stack">

          <div class="meter" aria-hidden="true"><div class="zone"></div><div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div><div class="needle" id="nd"></div></div>

        </div>

    <div class="row between">
      <div class="seg" id="mode"><button data-m="free" aria-pressed="true">Free singing</button><button data-m="target" aria-pressed="false">Target note</button></div>
      <div class="row" id="tgt" hidden style="gap:6px">
        <button class="btn small" data-t="-1" aria-label="Lower target">${icon('down')}</button>
        <span class="mono" id="tgt-name" style="font-size:18px;font-weight:600;min-width:3ch;text-align:center"></span>
        <button class="btn small" data-t="1" aria-label="Higher target">${icon('up')}</button>
        <button class="btn small" id="play-t">${icon('play')}Play</button>
        <button class="btn small primary" id="singback">${icon('ear')}Sing it back</button>
      </div>
    </div>
    <div class="graph-wrap"><canvas id="cv-graph" aria-label="Live pitch graph"></canvas></div>
    <div class="graph-legend"><span><i style="background:var(--ok)"></i>Within ±${TOL}¢</span><span><i style="background:var(--flat)"></i>Flat</span><span><i style="background:var(--sharp)"></i>Sharp</span><span class="faint">Tap a key to hear it${mode === 'free' ? '' : ''}</span></div>
    <div class="kb-wrap" id="kb"></div>
    <div class="kpis"><div class="kpi"><span class="v" id="k-acc">–</span><span class="l">Pitch accuracy</span></div><div class="kpi"><span class="v" id="k-stab">–</span><span class="l">Stability (±¢)</span></div><div class="kpi"><span class="v" id="k-time">0s</span><span class="l">Held notes</span></div></div>
    <div id="sb-result"></div>
    <button class="btn primary big sing-btn" id="go">${icon('mic')}Start Singing</button>
    <div id="summary"></div>`;

  const graph = new PitchGraph($('#cv-graph', el));
  graph.set({ lo: r.low - 3, hi: r.high + 3, tol: TOL, live: true });
  const kb = new Keyboard($('#kb', el), { low: r.low - 2, high: r.high + 2, onTap: async (m) => { await Engine.ensure(); muteUntil = Engine.ctx.currentTime + 0.95; Engine.note(m, Engine.ctx.currentTime + 0.02, 0.8); if (mode === 'target') setTarget(m); } });
  kb.markRange(r.low, r.high);

  let frames = [], running = false, t0 = 0, raf = 0, unsub = null, lastV = null, lastVt = 0, muteUntil = 0, kpiTimer = 0, recStart = 0, recTimer = 0;
  const nb = $('#nb', el), cv = $('#cv', el), st = $('#st', el), nd = $('#nd', el), hz = $('#hz', el);

  function setTarget(m) {
    target = m == null ? null : clamp(m, 36, 88);
    $('#tgt-name', el).textContent = target == null ? '' : nm(target);
    kb.setTarget(target);
    graph.set({ line: target });
  }
  $('#mode', el).addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    mode = b.dataset.m;
    $$('#mode button', el).forEach((x) => x.setAttribute('aria-pressed', x === b));
    $('#tgt', el).hidden = mode !== 'target';
    setTarget(mode === 'target' ? (target != null ? target : r.mid) : null);
  });
  $('#tgt', el).addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) setTarget(target + +b.dataset.t); });
  $('#play-t', el).addEventListener('click', async () => { await Engine.ensure(); muteUntil = Engine.ctx.currentTime + 1.5; Engine.note(target, Engine.ctx.currentTime + 0.02, 1.3); });

  function onFrame(f) {
    if (f.t < muteUntil) return;
    frames.push({ t: f.t - t0, midi: f.midi, voiced: f.voiced, c: f.c, rms: f.rms });
    if (f.voiced) { lastV = f; lastVt = f.t; }
  }
  function paint() {
    const now = Engine.ctx.currentTime;
    $('#lv', el).style.width = Math.round(Engine.level * 100) + '%';
    const fresh = lastV && now - lastVt < 0.35;
    if (fresh) {
      const m = lastV.midi;
      let ref = target != null ? target : Math.round(m);
      let d = (m - ref) * 100;
      if (target != null && Math.abs(d) > 600) { ref += Math.round(d / 1200) * 12; d = (m - ref) * 100; }
      const cls = devClass(d, TOL);
      nb.textContent = nm(Math.round(m)); nb.className = 'note-big ' + cls;
      cv.textContent = (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(Math.round(d)) + '¢';
      st.textContent = Math.abs(d) <= TOL ? 'On pitch' : d > 0 ? 'Sharp' : 'Flat';
      st.className = 'chip ' + cls;
      hz.textContent = lastV.f ? lastV.f.toFixed(1) + ' Hz' : '';
      nd.style.left = clamp(50 + d, 1, 99) + '%'; nd.className = 'needle ' + cls;
      kb.setActive(Math.round(m), cls);
    } else {
      nb.className = 'note-big idle'; st.textContent = running ? 'Listening' : 'Waiting'; st.className = 'chip'; nd.className = 'needle'; nd.style.left = '50%';
      kb.setActive(null);
    }
    const tn = now - t0;
    const recent = frames.length > 900 ? frames.slice(-900) : frames;
    graph.set({ frames: recent, t0: tn - 7, t1: tn + 0.3, shift: 0 });
    if (running) raf = requestAnimationFrame(paint);
  }
  function kpis() {
    const tn = Engine.ctx.currentTime - t0;
    const s = freeSummary(frames.filter((f) => f.t > tn - 30), target, TOL);
    $('#k-acc', el).textContent = s.accuracy == null ? '–' : s.accuracy + '%';
    $('#k-stab', el).textContent = s.stability == null ? '–' : Math.round(s.stability);
    const all = freeSummary(frames, target, TOL);
    $('#k-time', el).textContent = Math.round(all.singingSec) + 's';
  }

  async function start() {
    await Engine.ensure();
    if (!(await micOrNotice($('#mic-msg', el)))) return;
    $('#mic-msg', el).innerHTML = '';
    frames = []; running = true; t0 = Engine.ctx.currentTime; lastV = null;
    unsub = Engine.onFrame((f) => { if (f.t >= t0) onFrame(f); });
    Engine.startRecording(); recStart = Engine.ctx.currentTime;
    recTimer = setTimeout(() => { if (Engine.recording) { App.liveRec = Engine.stopRecording(); } }, 180000);
    $('#go', el).innerHTML = 'Stop'; $('#go', el).classList.add('live'); $('#go', el).classList.remove('primary');
    $('#mic-chip', el).textContent = 'Listening'; $('#mic-chip', el).className = 'chip ok';
    $('#summary', el).innerHTML = '';
    kpiTimer = setInterval(kpis, 600);
    raf = requestAnimationFrame(paint);
  }
  function stop(save = true) {
    if (!running) return;
    running = false; cancelAnimationFrame(raf); clearInterval(kpiTimer); clearTimeout(recTimer);
    if (unsub) unsub();
    const rec = Engine.recording ? Engine.stopRecording() : App.liveRec; App.liveRec = null;
    Engine.stopMic();
    $('#go', el).innerHTML = icon('mic') + 'Start Singing'; $('#go', el).classList.remove('live'); $('#go', el).classList.add('primary');
    $('#mic-chip', el).textContent = 'Mic off'; $('#mic-chip', el).className = 'chip';
    if (save) liveSummary(rec);
  }
  $('#go', el).addEventListener('click', () => (running ? stop() : start()));
  onCleanup(() => stop(false));

  function liveSummary(rec) {
    const s = freeSummary(frames, target, TOL);
    const box = $('#summary', el);
    if (s.singingSec < 2) { box.innerHTML = `<div class="notice">I didn’t hear enough held notes to give feedback. Sing sustained notes (not speech) for a few seconds.</div>`; return; }
    const notes = s.segs.map((g) => {
      const ref = target != null ? target : g.nearest;
      let es = g.pts.map((p) => (p.midi - ref) * 100);
      if (target != null) es = es.map((e) => e - Math.round(e / 1200) * 1200);
      const dur = g.end - g.start;
      const n = { midi: ref, start: g.start, dur, median: median(es), inTol: es.filter((e) => Math.abs(e) <= TOL).length / es.length, std: std(es), meanAbs: mean(es.map(Math.abs)), hnr: mean(g.pts.map((p) => hnrOf(p.c))), missed: false, octave: 0, lyric: '', voicedRatio: 1 };
      if (dur >= 1.1) n.sustain = sustainFeatures(g.pts.map((p, i) => ({ t: p.t, e: es[i], rms: p.rms, c: p.c })), null);
      n.score = Math.round(100 * (0.6 * n.inTol + 0.4 * clamp(1 - n.meanAbs / 75, 0, 1)));
      return n;
    });
    const res = { notes, intervals: [], breaks: [], summary: summarize(notes, [], TOL) };
    res.summary.scoop = null;
    const tips = coachTips(res, null);
    const total = frames.length ? frames[frames.length - 1].t : 0;
    Store.addSession({ type: 'live', title: target != null ? 'Live: target ' + nm(target) : 'Live singing', summary: res.summary, notes: notes.map(slimNote), seconds: Math.round(total) });
    box.innerHTML = `<section class="panel stack">
      <div class="row" style="gap:16px">${scoreRing(res.summary.score)}<div class="stack" style="gap:4px"><span class="eyebrow">Session summary</span>
      <h3>${notes.length} held notes · ${s.accuracy}% within ±${TOL}¢</h3>
      <p class="muted">${s.heldShare < 0.5 ? 'A lot of what I heard was gliding or speech-like pitch; only held notes are scored.' : 'Scored on held notes only; slides and speech are ignored.'}</p></div></div>
      <div class="tips">${tips.map(tipHtml).join('') || '<p class="muted">Nothing stood out. Try the guided exercises for targeted feedback.</p>'}</div>
      <div class="row"><button class="btn small" id="rp">${icon('play')}Replay</button><span class="muted" style="font-size:13px">Replay shows exactly where you drifted.</span></div>
      <div class="graph-wrap"><canvas id="sum-graph"></canvas></div>
      <div id="ai"></div></section>`;
    const g2 = new PitchGraph($('#sum-graph', box));
    g2.fitTo(notes.map((n) => n.midi));
    g2.set({ frames, t0: 0, t1: Math.max(4, total), tol: TOL, line: target });
    $('#rp', box).addEventListener('click', (e) => {
      if (!rec) return toast('No recording available.');
      toggleReplay({ samples: rec.samples, sr: rec.sr, offset: rec.t0 - t0 }, g2, 0, total, e.currentTarget);
    });
    aiPanel($('#ai', box), () => ({ title: 'Free singing (live mode)' + (target != null ? ', target ' + nm(target) : ''), description: 'The student sang freely; held notes were detected automatically and compared with the nearest semitone' + (target != null ? ' or the chosen target note' : '') + '.', notes: compactResult(res), summary: res.summary, tol: TOL }));
  }

  // Sing-it-back: play target, then listen and score.
  $('#singback', el).addEventListener('click', async () => {
    const box = $('#sb-result', el);
    await Engine.ensure();
    const wasRunning = running;
    if (!wasRunning) { if (!(await micOrNotice($('#mic-msg', el)))) return; }
    const sig = { aborted: false }; App.abort = sig;
    const btn = $('#singback', el); btn.disabled = true;
    try {
      const targets = [{ midi: target, start: 0.3, dur: 2.2 }];
      muteUntil = Engine.ctx.currentTime + 2.0;
      const out = await performPhrase({ targets, demoTargets: [{ midi: target, start: 0, dur: 1.4 }], demo: true, call: true, sig, bpm: 60, status: (t) => { box.innerHTML = `<div class="status-line">${esc(t)}</div>`; } });
      const res = scorePhrase(out.frames, targets, { tol: TOL, rec: out.rec });
      const n = res.notes[0];
      const s2 = res.summary;
      Store.addSession({ type: 'match', title: 'Sing it back ' + nm(target), summary: s2, notes: res.notes.map(slimNote), seconds: 4 });
      box.innerHTML = n.missed ? `<div class="notice">I didn’t catch a held note. Sing right after the reference ends, for about two seconds.</div>`
        : `<div class="panel row" style="gap:14px">${scoreRing(n.score)}<div class="stack" style="gap:4px"><b>${nm(target)}: ${Math.abs(n.median) <= TOL ? 'on pitch' : Math.round(Math.abs(n.median)) + '¢ ' + (n.median < 0 ? 'flat' : 'sharp')}${n.octave ? ' (an octave ' + (n.octave < 0 ? 'lower' : 'higher') + ')' : ''}</b>
          <span class="muted">${Math.round(n.inTol * 100)}% of the note within ±${TOL}¢ · ${n.onset != null && n.onset - n.median < -35 ? 'you slid up into it' : 'clean start'}</span></div></div>`;
      if (!wasRunning) Engine.stopMic();
    } catch (e) { if (!(e instanceof Aborted)) toast(e.message); }
    btn.disabled = false;
  });
};

function slimNote(n) { return { midi: n.midi, median: n.median == null ? null : Math.round(n.median), inTol: n.inTol == null ? null : +n.inTol.toFixed(2), missed: !!n.missed, dur: +(n.dur || 0).toFixed(2), score: n.score }; }
function tipHtml(t) { return `<div class="tip ${t.kind}"><span class="h">${esc(t.h)}</span><span class="b">${esc(t.b)}</span></div>`; }

VIEWS.exercise = (el, params) => {

  const allTargets = () => cfg.phrases.map((ph) => timePhrase(ph, cfg.bpm));
  function intro() {
    phase = 'intro'; setSteps('learn');
    const midis = cfg.phrases.flat().map((n) => n.midi);
    body.innerHTML = `
      <section class="panel stack"><span class="eyebrow">What we’re practising</span><p>${esc(ex.what)}</p>
        <span class="eyebrow" style="margin-top:6px">How to do it</span><p class="muted">${esc(ex.how)}</p>

        <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" id="guide" ${guide ? 'checked' : ''} ${p.headphones ? '' : 'disabled'} style="width:20px;height:20px;accent-color:var(--accent)">Guide melody while I sing${p.headphones ? '' : ' <span class="faint">(needs headphones, set in Profile)</span>'}</label>

    const g = new PitchGraph($('#g', body));
    const t1 = allTargets()[0];
    g.fitTo(t1.map((t) => t.midi)); g.set({ targets: t1, frames: [], t0: -0.3, t1: t1[t1.length - 1].start + t1[t1.length - 1].dur + 0.4, tol: cfg.tol });

    $('#guide', body).addEventListener('change', (e) => { guide = e.target.checked; });

      // playhead over the first phrase
      const tick = () => { const t = Engine.ctx.currentTime - start; if (t < t1[t1.length - 1].start + t1[t1.length - 1].dur && phase === 'intro') { g.set({ playhead: t }); requestAnimationFrame(tick); } else g.set({ playhead: null }); };

      <div class="row between"><div class="status-line" id="status">Get ready</div><span class="mono muted" id="ph"></span></div>

        <div class="stack" style="gap:2px"><span class="cents-val" id="cv"></span><span class="muted" style="font-size:13px" id="hint">${esc(ex.how.split('. ')[0])}.</span></div></div>
      <div class="graph-wrap tall"><canvas id="g"></canvas></div>
      <div class="graph-legend"><span><i style="background:var(--accent)"></i>Target ±${cfg.tol}¢</span><span><i style="background:var(--ok)"></i>On pitch</span><span><i style="background:var(--flat)"></i>Flat</span><span><i style="background:var(--sharp)"></i>Sharp</span></div>
      <button class="btn" data-act="stop">${icon('stop')}Stop</button>`;
    const g = new PitchGraph($('#g', body));
    const status = (t, k) => { $('#status', body).innerHTML = k === 'count' ? `<span class="countdown">${esc(t)}</span>` : esc(t); setSteps(k === 'demo' ? 'demo' : 'sing'); };
    $('[data-act="stop"]', body).addEventListener('click', () => { sig.aborted = true; Engine.stopAll(); Engine.stopMic(); intro(); });
    const phrases = allTargets();
    let raf = 0;
    try {
      for (let i = 0; i < phrases.length; i++) {
        if (sig.aborted) return;
        const demoT = phrases[i];
        const lead = cfg.mode === 'call' ? 0.35 : 0;
        const tg = demoT.map((t) => ({ ...t, start: t.start + lead, dur: cfg.mode === 'call' ? t.dur + 0.3 : t.dur }));
        const last = tg[tg.length - 1];
        const span = last.start + last.dur;
        $('#ph', body).textContent = `Phrase ${i + 1} of ${phrases.length}`;
        g.fitTo(tg.map((t) => t.midi));
        const fr = [];
        let mode = 'demo', clock0 = 0;
        g.set({ targets: demoT, frames: [], t0: -0.3, t1: span + 0.5, tol: cfg.tol, playhead: null });
        const loop = () => {
          const now = Engine.ctx.currentTime - clock0;
          g.set({ playhead: now, frames: fr });
          const lv = fr.length ? fr[fr.length - 1] : null;
          const nb = $('#nb', body), cv = $('#cv', body);
          if (mode === 'sing' && lv && lv.voiced) {
            const cur = tg.find((t) => now >= t.start && now < t.start + t.dur) || tg.reduce((a, b) => (Math.abs(b.start - now) < Math.abs(a.start - now) ? b : a));
            let d = (lv.midi - cur.midi) * 100; if (Math.abs(d) > 600) d -= Math.round(d / 1200) * 1200;
            const cls = devClass(d, cfg.tol);
            nb.textContent = nm(Math.round(lv.midi)); nb.className = 'note-big ' + cls;
            cv.textContent = `${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(Math.round(d))}¢ ${Math.abs(d) <= cfg.tol ? 'on pitch' : d > 0 ? 'sharp' : 'flat'}`;
          } else if (mode === 'sing') { nb.className = 'note-big idle'; }
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        const out = await performPhrase({
          targets: tg, demoTargets: demoT, glide: cfg.glide, demo: true, call: cfg.mode === 'call', bpm: cfg.bpm, countIn: 2, guide: guide && p.headphones, metronome: p.metronome && cfg.mode !== 'call', sig, status,
          onDemo: (ds) => { clock0 = ds; mode = 'demo'; },
          onStart: (T0) => { clock0 = T0; mode = 'sing'; g.set({ targets: tg }); },
          onFrame: (f) => fr.push(f),
        });
        cancelAnimationFrame(raf);
        const res = scorePhrase(out.frames, tg, { tol: cfg.tol, latency: cfg.mode === 'call' ? 0 : Engine.latency(), legato: cfg.legato, rec: out.rec });
        res.frames = out.frames; res.rec = out.rec; res.targets = tg; res.total = span;
        res.gaps = cfg.breathPhrase ? breathGaps(out.frames, span) : 0;
        results.push(res);
        status(`Phrase ${i + 1}: ${res.summary.score}`, 'sing');
        await sleep(cfg.mode === 'call' ? 350 : 650);
      }
      Engine.stopMic();
      finish();
    } catch (e) {
      cancelAnimationFrame(raf);
      if (!(e instanceof Aborted)) { console.error(e); toast('Something went wrong: ' + e.message); intro(); }
    }
  }

  function finish() {
    phase = 'result'; setSteps('result');
    const notes = results.flatMap((r) => r.notes), breaks = results.flatMap((r) => r.breaks), intervals = results.flatMap((r) => r.intervals);
    const res = { notes, breaks, intervals, summary: summarize(notes, breaks, cfg.tol) };
    const extra = { vowelPhrase: cfg.vowelPhrase, breathGaps: results.reduce((a, r) => a + r.gaps, 0) };
    const tips = coachTips(res, cfg, extra);
    const sc = res.summary.score;
    const prevLevel = level;
    let lvMsg = '';

    else if (sc < 50 && level > 1 && res.summary.missed < res.summary.total / 2) { level--; lvMsg = `Eased to level ${level} so you can build accuracy first.`; }
    Store.setLevel(ex.id, level);
    const secs = Math.round(results.reduce((a, r) => a + r.total, 0) * 2);
    Store.addSession({ type: 'exercise', exId: ex.id, title: ex.title, level: prevLevel, summary: res.summary, notes: notes.map(slimNote), seconds: secs });
    if (EX_TO_VSKILL[ex.id]) {

        if (tr && (tr.event === 'secure' || tr.event === 'mastered')) { lvMsg = (lvMsg ? lvMsg + ' ' : '') + (tr.event === 'mastered' ? 'Skill mastered!' : 'Skill secure: passed on two different days.'); if (typeof uiCelebrate === 'function') uiCelebrate(tr.event, ex.title); }

              ${s.stability != null ? `<span class="chip">Steadiness ±${Math.round(s.stability)}¢</span>` : ''}
              ${s.breaks ? `<span class="chip sharp">${s.breaks} break${s.breaks > 1 ? 's' : ''}</span>` : ''}
            </div>${lvMsg ? `<span class="muted" style="font-size:13px">${esc(lvMsg)}</span>` : ''}</div></div>
        <div class="tips">${tips.map(tipHtml).join('')}</div>
      </section>
      <section class="stack">
        <div class="row between"><div class="seg" id="phs">${results.map((r, i) => `<button data-i="${i}" aria-pressed="${i === 0}">Phrase ${i + 1} · ${r.summary.score}</button>`).join('')}</div>
          <button class="btn small" id="rp">${icon('play')}Replay</button></div>
        <div class="graph-wrap tall"><canvas id="g"></canvas></div>
        <div class="table-wrap"><table class="notes-table" id="nt"></table></div>
      </section>
      <div id="ai"></div>
      ${ex.id === 'range-ext' ? `<button class="btn danger" data-act="strained">That felt strained</button>` : ''}
      <div class="row">
        <button class="btn" data-act="again">${icon('redo')}Repeat</button>
        <button class="btn" data-act="up">${icon('up')}Half step up</button>
        <button class="btn" data-act="down">${icon('down')}Half step down</button>
        ${L ? `<button class="btn primary" data-act="next" style="flex:1">${nextId ? 'Next: ' + esc(EX[nextId].title) : 'Finish lesson'}</button>` : ''}
      </div>`;
    const g = new PitchGraph($('#g', body));
    let cur = 0;
    const showPhrase = (i) => {
      cur = i;
      const r = results[i];

      const tg = r.targets.map((t) => ({ ...t, res: (r.notes.find((n) => n.start === t.start) || {}).score }));
      g.set({ targets: tg, frames: r.frames, t0: -0.3, t1: r.total + 0.5, tol: cfg.tol, playhead: null, shift: cfg.mode === 'call' ? 0 : Engine.latency() });
      $('#nt', body).innerHTML = `<tr><th>Note</th><th>${cfg.phrases[0].some((n) => n.lyric && n.lyric.length > 1) ? 'Sound' : ''}</th><th>Result</th><th>In tune</th><th>Score</th></tr>` + r.notes.map((n) => `<tr><td class="mono">${nm(n.midi)}</td><td class="muted">${esc(n.lyric || '')}</td>
        <td><span class="chip ${n.missed ? '' : devClass(n.median, cfg.tol)}">${n.missed ? 'not heard' : (Math.abs(n.median) <= cfg.tol ? 'on pitch ' : '') + (n.median > 0 ? '+' : n.median < 0 ? '−' : '') + Math.abs(Math.round(n.median)) + '¢'}</span></td>
        <td class="mono">${n.missed ? '–' : Math.round(n.inTol * 100) + '%'}</td><td class="mono">${n.score}</td></tr>`).join('');
      $$('#phs button', body).forEach((b) => b.setAttribute('aria-pressed', +b.dataset.i === i));
    };
    showPhrase(0);
    $('#phs', body).addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) showPhrase(+b.dataset.i); });
    $('#rp', body).addEventListener('click', (e) => { const r = results[cur]; if (!r.rec) return toast('No recording for this phrase.'); toggleReplay(r.rec, g, -0.2, r.total + 0.4, e.currentTarget); });
    aiPanel($('#ai', body), () => ({ title: ex.title + ` (level ${prevLevel})`, description: ex.what, notes: compactResult(res), summary: s, breaks: breaks.length ? breaks.map((b) => ({ from: nm(b.from), to: nm(b.to), kind: b.kind })) : null, tol: cfg.tol }));
    body.onclick = (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'again') { cfg = ex.build(level, shift); setLvl(); run(); }

      else if (a === 'next') {
        if (nextId) { L.idx++; go('exercise', { id: nextId }); }
        else lessonDone();
      } else if (a === 'strained') {
        const pr = Store.data.profile;
        level = Math.max(1, level - 1); Store.setLevel(ex.id, level);
        pr.extHigh = Math.min(pr.extHigh != null ? pr.extHigh : 99, rangeOf().high + Math.max(0, level - 1));
        Store.save();
        sheet(`<h2>Good call</h2><p class="muted">I’ve moved this exercise back down and capped how high it goes. Sip some water and take a short break. Range grows from easy, relaxed singing. If discomfort lasts more than a day or two, or you lose your voice, check in with a doctor or voice specialist.</p><button class="btn primary" data-x>OK</button>`, (sh, close) => { $('[data-x]', sh).addEventListener('click', () => { close(); go('practice'); }); });
      }
    };
  }

  function lessonDone() {
    const L2 = App.lesson; App.lesson = null;
    const avg = Math.round(mean(L2.scores));
    sheet(`<span class="eyebrow">Lesson complete</span><h2>${avg >= 80 ? 'Strong session.' : avg >= 60 ? 'Solid work.' : 'Good effort — the reps count.'}</h2>
      <p class="muted">${L2.scores.length} exercises · average score <b class="mono" style="color:var(--text)">${avg}</b>. Your next lesson is built from today’s results.</p>
      <div class="row"><button class="btn primary" data-p>See progress</button><button class="btn" data-h>Home</button></div>`, (sh, close) => {

      $('[data-h]', sh).addEventListener('click', () => { close(); go('home'); });

  }
  intro();
};

// ===================== Range test =====================
VIEWS.range = (el) => {
  const sig = { aborted: false }; App.abort = sig;
  el.innerHTML = `
    <button class="btn ghost small" data-back style="align-self:flex-start;padding-left:4px">${icon('back')}Back</button>
    <div class="stack" style="gap:2px"><span class="eyebrow">Vocal range test</span><h2>Find where your voice is comfortable</h2></div>
    <div id="rt"></div>`;
  $('[data-back]', el).addEventListener('click', () => { sig.aborted = true; Engine.stopMic(); go('practice'); });
  const box = $('#rt', el);
  box.innerHTML = `<section class="panel stack">
      <p>I’ll play a note, you sing it back on a relaxed “ah”. We’ll go down a half step at a time, then up. After each note, tell me how it felt.</p>
      <div class="notice warn"><div><b>Comfort first.</b> Only sing notes that feel easy or mildly effortful. Stop the moment anything feels tight, scratchy or painful. A range test is not a contest; forcing notes can hurt your voice.</div></div>
      <p class="muted" style="font-size:13.5px">Takes about three minutes. A quiet room helps.</p>
      <button class="btn primary big" data-begin>${icon('mic')}Begin</button><div id="mic-msg"></div></section>`;
  $('[data-begin]', box).addEventListener('click', begin);

  let graph = null;
  function stage(title, sub) {
    box.innerHTML = `<section class="panel stack"><div class="row between"><span class="eyebrow">${esc(sub || '')}</span><span class="mono muted" id="sung"></span></div>
      <div class="note-big" id="tn" style="color:var(--accent)">${esc(title)}</div><div class="status-line" id="rs"></div>
      <div class="graph-wrap"><canvas id="g"></canvas></div><div id="choices" class="row"></div></section>`;
    graph = new PitchGraph($('#g', box));
  }
  const choose = (opts) => new Promise((res) => {
    const c = $('#choices', box);
    c.innerHTML = opts.map(([k, label, cls]) => `<button class="btn ${cls || ''}" data-c="${k}">${esc(label)}</button>`).join('');
    const t = setInterval(() => { if (sig.aborted) { clearInterval(t); res('abort'); } }, 200);
    c.onclick = (e) => { const b = e.target.closest('[data-c]'); if (b) { clearInterval(t); c.innerHTML = ''; res(b.dataset.c); } };
  });

  async function listenFor(m, secs, play) {
    const tg = [{ midi: m == null ? 60 : m, start: 0, dur: secs }];
    const fr = [];
    graph.set({ targets: m == null ? [] : tg, frames: fr, t0: -0.2, t1: secs + 0.3, lo: (m || 52) - 6, hi: (m || 60) + 6, tol: 50 });
    let raf;
    let T0 = Infinity;
    const loop = () => { graph.set({ frames: fr, playhead: Engine.ctx.currentTime - T0 }); const lv = fr[fr.length - 1]; if (lv && lv.voiced) $('#sung', box).textContent = 'You: ' + nm(Math.round(lv.midi)); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    try {
      return await performPhrase({ targets: tg, demoTargets: play ? [{ midi: m, start: 0, dur: 1.2 }] : null, demo: !!play, call: true, sig, status: (t) => { $('#rs', box).textContent = t === 'Listen' ? 'Listen…' : 'Now sing “ah”'; }, onStart: (t) => { T0 = t; }, onFrame: (f) => fr.push(f) });
    } finally { cancelAnimationFrame(raf); }
  }
  // longest run (s) of sung frames within ±60¢ of m
  function heldOn(frames, m) {
    let best = 0, run = 0, last = null;
    for (const f of frames) {
      if (!(f.voiced && Math.abs(f.midi - m) <= 0.6)) continue;
      if (last != null && f.t - last < 0.12) run += f.t - last; else run = 0;
      last = f.t; best = Math.max(best, run);
    }
    return best;
  }

  async function begin() {
    await Engine.ensure();
    if (!(await micOrNotice($('#mic-msg', box)))) return;
    try {
      // 1. comfortable starting note
      let start = null;
      for (let tries = 0; tries < 3 && start == null; tries++) {
        stage('Sing', 'Step 1 · your comfortable note');
        $('#rs', box).textContent = 'Sing a relaxed “ah” at an easy, speaking-like pitch and hold it…';
        await sleep(900);
        const out = await listenFor(null, 3, false);
        const segs = segmentNotes(out.frames, 0.4);
        if (segs.length) { const lg = segs.sort((a, b) => b.end - b.start - (a.end - a.start))[0]; start = clamp(lg.nearest, 40, 76); }
        else { $('#rs', box).textContent = 'I didn’t catch a held note. Let’s try again.'; await sleep(1400); }
      }
      if (start == null) { finishTest(null); return; }
      const out = { start, cLow: start, cHigh: start, eLow: null, eHigh: null };
      for (const dir of [-1, 1]) {
        let m = start, effort = 0, fails = 0;
        while (true) {
          m += dir;
          if (m < 36 || m > 86) break;
          stage(nm(m), dir < 0 ? 'Going down · half step at a time' : 'Going up · half step at a time');
          const o = await listenFor(m, 2.4, true);
          const held = heldOn(o.frames, m);
          if (held >= 0.6) {
            fails = 0;
            $('#rs', box).textContent = `Got it: ${nm(m)}. How did that feel?`;
            const c = await choose([['easy', 'Easy'], ['effort', 'Some effort'], ['stop', 'Uncomfortable — stop', 'danger']]);
            if (c === 'abort') return;
            if (c === 'easy') { if (dir < 0) out.cLow = m; else out.cHigh = m; }
            else if (c === 'effort') { if (dir < 0) out.eLow = m; else out.eHigh = m; effort++; if (effort >= 2) break; }
            else break;
          } else {
            const sungNote = (() => { const v = o.frames.filter((f) => f.voiced); return v.length > 10 ? Math.round(median(v.map((f) => f.midi))) : null; })();
            $('#rs', box).textContent = sungNote != null ? `I heard ${nm(sungNote)} rather than ${nm(m)}.` : `I didn’t hear ${nm(m)} held.`;
            const c = await choose(fails === 0 ? [['retry', 'Try again'], ['limit', 'That’s my limit']] : [['limit', 'Continue']]);
            if (c === 'abort') return;
            if (c === 'retry') { fails++; m -= dir; continue; }
            break;
          }
        }
        if (dir < 0) { stage('↑', 'Now the top'); $('#rs', box).textContent = 'Nice. Take a breath — now we’ll go up from your starting note.'; await sleep(1800); }
      }
      Engine.stopMic();
      finishTest(out);
    } catch (e) { if (!(e instanceof Aborted)) { console.error(e); toast(e.message); } }
  }

  function finishTest(o) {
    Engine.stopMic();
    if (!o) { box.innerHTML = `<div class="notice">I couldn’t hear a steady note. Check the microphone (Live Coach shows the input level) and try again in a quieter spot.</div>`; return; }
    const p = Store.data.profile;
    // need a usable span for exercises; widen gently around a narrow result
    let lo = o.cLow, hi = o.cHigh;
    p.rangeLow = lo; p.rangeHigh = hi; p.extLow = o.eLow; p.extHigh = o.eHigh; p.rangeTested = true;
    if (hi - lo < 7) { const c = Math.round((lo + hi) / 2); p.rangeLow = c - 4; p.rangeHigh = c + 4; }
    Store.data.ranges.push({ ts: Date.now(), low: lo, high: hi, extLow: o.eLow, extHigh: o.eHigh });
    Store.addSession({ type: 'range', title: 'Range test', summary: null, notes: [], seconds: 180 });
    Store.save();
    const span = hi - lo, eLo = o.eLow != null ? o.eLow : lo, eHi = o.eHigh != null ? o.eHigh : hi;
    const TYPES = [['bass', 40, 64], ['baritone', 43, 67], ['tenor', 48, 72], ['alto', 53, 77], ['mezzo-soprano', 57, 81], ['soprano', 60, 84]];
    const fit = TYPES.map(([n, a, b]) => [n, Math.max(0, Math.min(hi, b) - Math.max(lo, a)) - Math.abs((lo + hi) / 2 - (a + b) / 2) * 0.3]).sort((a, b) => b[1] - a[1]);
    const W = 600, x = (m) => ((m - 36) / (86 - 36)) * 100;
    box.innerHTML = `<section class="panel stack">
      <span class="eyebrow">Your range today</span>
      <h2>Comfortable ${nm(lo)}–${nm(hi)} <span class="muted" style="font-size:1rem;font-weight:500">· ${span} semitones</span></h2>
      ${o.eLow != null || o.eHigh != null ? `<p>Extended (with effort): ${nm(eLo)}–${nm(eHi)}</p>` : ''}
      <div class="range-strip"><div class="ext" style="left:${x(eLo)}%;width:${x(eHi + 1) - x(eLo)}%"></div><div class="cmf" style="left:${x(lo)}%;width:${x(hi + 1) - x(lo)}%"></div></div>
      <div class="range-labels"><span>C2</span><span>C3</span><span>C4</span><span>C5</span><span>C6</span></div>
      <p class="muted">Your comfortable range overlaps most with typical <b style="color:var(--text)">${fit[0][0]}</b> and <b style="color:var(--text)">${fit[1][0]}</b> ranges. Treat this as a rough pointer: voice type also depends on tone colour, where your voice shifts registers and where it feels best, and range grows with training. A teacher hearing you in person is the reliable way to classify a voice.</p>
      <p class="muted">Exercises are now pitched inside ${nm(p.rangeLow)}–${nm(p.rangeHigh)}.</p>
      <div class="row"><button class="btn primary" data-l>Start a lesson</button><button class="btn" data-p>Back to Practice</button></div></section>`;
    $('[data-l]', box).addEventListener('click', () => { const lp = lessonPlan(); App.lesson = { plan: lp.plan, idx: 0, scores: [] }; go('exercise', { id: lp.plan[0] }); });
    $('[data-p]', box).addEventListener('click', () => go('practice'));
  }
};

// ===================== Guitar program =====================

const GPC = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
// Your convention: the THICKEST string is string 1, the thinnest is string 6 (standard books number the other way).
const STRING_NOTE = ['low E', 'A', 'D', 'G', 'B', 'high E'];
const STRING_NAMES = STRING_NOTE.map((n, i) => `string ${i + 1} (${n})`);

function G_() {
  const d = Store.data;

  g.done = g.done || {}; g.chords = g.chords || {}; g.changes = g.changes || {}; g.strum = g.strum || []; g.tuning = g.tuning || 'standard';

}
const gTuning = () => GTR_TUNINGS[G_().tuning].notes;
const gTempoFactor = (lvl) => [0.8, 0.9, 1, 1.12, 1.25][clamp(lvl, 1, 5) - 1];

// ---------- synth (plucked-string demos) ----------
const _pluckCache = new Map();
function gPluck(midi) {
  const sr = Engine.ctx.sampleRate, k = midi + ':' + sr + ':' + Store.a4();
  if (!_pluckCache.has(k)) _pluckCache.set(k, gtrPluck(sr, pcMidiToFreq(midi, Store.a4()), 2.4, { vel: 0.55 }));

function chordSVG(c, states, big) {

  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(c.name)} chord diagram" style="max-width:100%">`;
  for (let s = 0; s < 6; s++) g += `<line x1="${L + s * sp}" y1="${T}" x2="${L + s * sp}" y2="${T + rows * fh}" stroke="var(--muted)" stroke-width="${1 + (5 - s) * 0.25}"/>`;

  }

    else if (f === 0) g += `<circle cx="${x}" cy="${T - 12}" r="${big ? 5 : 4}" fill="none" stroke="${stc || 'var(--muted)'}" stroke-width="${stc ? 2.5 : 1.5}"/>`;

// tab: [{s, fret, start, beats}] (start/beats in beats). results[i]: 'ok'|'late'|'wrong'|'miss'

  for (let s = 0; s < 6; s++) g += `<line x1="18" x2="${W - 4}" y1="${y(s)}" y2="${y(s)}" stroke="var(--line)"/><text x="4" y="${y(s) + 4}" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${'EADGBe'[s]}</text>`;

// Count in, optional click, record. Returns frames relative to T0 (beat 1 of bar 1).
async function gRun(o) {
  const ctx = Engine.ctx, spb = 60 / o.bpm, bar = o.bar || 4;
  const cs = ctx.currentTime + 0.25;
  for (let i = 0; i < o.countIn; i++) Engine.click(cs + i * spb, i % bar === 0);
  const T0 = cs + o.countIn * spb;
  if (o.clicks) for (let k = 0; k < o.beats; k++) Engine.click(T0 + k * spb, k % bar === 0);
  if (o.accompany) o.accompany(T0);
  const frames = [];
  const unsub = Engine.onFrame((f) => {
    if (f.t < T0 - 0.6) return;
    const r = { t: f.t - T0, te: f.te - T0, midi: f.midi, voiced: f.voiced, hf: f.hf, rms: f.rms, c: f.c };
    frames.push(r); o.onFrame && o.onFrame(r);
  });
  Engine.startRecording();
  o.onStart && o.onStart(T0);
  let rec;
  try {
    while (ctx.currentTime < T0) {
      if (o.sig && o.sig.aborted) throw new Aborted();
      o.status && o.status('count', Math.ceil((T0 - ctx.currentTime) / spb));
      await sleep(30);
    }
    o.status && o.status('go');
    await waitCtx(T0 + o.beats * spb + Engine.latency() + 0.4, o.sig);
  } finally { unsub(); rec = Engine.stopRecording(); }
  return { frames, T0, rec: rec ? { samples: rec.samples, sr: rec.sr, offset: rec.t0 - T0 } : null };
}

}
function gSpecAt(rec, t, N) {
  if (!rec) return null;

const clicksLeak = () => !Store.data.profile.headphones;

// Waits for one clearly plucked note. Resolves {midi} or null on timeout.
function gListenNote(sig, timeout, ignoreUntil) {
  return new Promise((resolve) => {
    const det = new GtrOnsets(), fr = [];
    let onset = null, settled = false, steadyStart = null;
    const t0 = Engine.ctx.currentTime;
    const finish = (v) => { if (settled) return; settled = true; unsub(); clearInterval(iv); resolve(v); };
    const unsub = Engine.onFrame((f) => {
      if (ignoreUntil && f.t < ignoreUntil) return;
      fr.push(f);
      const o = det.push(f.te, f.hf);
      if (o != null && onset == null) onset = o;
      if (f.voiced) { if (steadyStart == null) steadyStart = f.t; } else steadyStart = null;
      const ready = (onset != null && f.t > onset + 0.35) || (steadyStart != null && f.t - steadyStart > 0.45);
      if (ready) {
        const from = onset != null ? onset + 0.04 : steadyStart;
        const v = fr.filter((x) => x.voiced && x.t >= from && x.t <= from + 0.32).map((x) => x.midi).sort((a, b) => a - b);
        if (v.length >= 5) finish({ midi: v[v.length >> 1] });
        else { onset = null; steadyStart = null; }
      }
    });
    const iv = setInterval(() => { if ((sig && sig.aborted) || Engine.ctx.currentTime - t0 > timeout) finish(null); }, 100);
  });
}

    if (!(await micOrNotice($('#lmsg', box)))) return;
    on = true; $('#lis', box).innerHTML = icon('stop') + 'Stop';
    unsub = Engine.onFrame((f) => { lastRms = f.rms; });
    const an = Engine.analyser(), buf = new Float32Array(an.frequencyBinCount);
    iv = setInterval(() => {
      if (lastRms < 0.006) { $('#lc', box).className = 'note-big idle'; return; }
      an.getFloatFrequencyData(buf);
      const det = gtrDetectChord(gtrSpectrumFromDb(buf, Engine.ctx.sampleRate, an.fftSize), Store.a4());
      if (!det) return;
      const name = det.best.name;
      same = name === prev ? same + 1 : 0; prev = name;
      if (same >= 1) {
        $('#lc', box).textContent = name; $('#lc', box).className = 'note-big ok';
        $('#lalt', box).textContent = 'Also close: ' + det.ranked.slice(1, 3).map((r) => r.name).join(', ');
        $('#lconf', box).textContent = 'match ' + Math.round(det.best.score * 100) + '%';
      }
    }, 140);
    onCleanup(() => { clearInterval(iv); unsub && unsub(); });
  });
}

function gridHTML(grid) {

function gRhythmSec(box) {
  const p = Store.data.profile;
  box.innerHTML = `<section class="panel stack"><div class="row between"><h3>Timing calibration</h3><span class="chip ${p.latency != null ? 'ok' : ''}">${p.latency != null ? Math.round(p.latency * 1000) + ' ms' : 'Not calibrated'}</span></div>
      <p class="muted" style="font-size:13.5px">Phones add a delay between the click you hear and the sound reaching the mic. Strum muted strings (or clap) on 8 clicks and I’ll measure it, so “early” and “late” are accurate.</p>
      <button class="btn small" id="cal" style="align-self:flex-start">Calibrate</button><div id="calr"></div></section>
    <h3>Strumming patterns</h3>
    <div class="ex-list">${GTR_PATTERNS.map((pt) => `<button class="ex" data-p="${pt.id}"><span class="t">${esc(pt.name)}</span>${gridHTML(pt.grid)}<span class="d">${esc(pt.text)}</span></button>`).join('')}</div>`;
  box.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (!b) return; const pt = GTR_PATTERNS.find((x) => x.id === b.dataset.p); go('glesson', { adhoc: { kind: 'strum', pattern: pt.id, chord: 'Em', title: pt.name, text: pt.text, id: 'strum-' + pt.id }, back: ['guitar', 'Rhythm', { sec: 'rhythm' }] }); });
  $('#cal', box).addEventListener('click', async () => {
    const r = $('#calr', box);
    await Engine.ensure();
    if (!(await micOrNotice(r))) return;
    const sig = { aborted: false }; App.abort = sig;
    r.innerHTML = '<div class="status-line">Listen to 4 clicks, then strum on the next 8</div>';
    try {
      const out = await gRun({ bpm: 80, beats: 8, countIn: 4, clicks: true, sig, status: (k, n) => { r.innerHTML = `<div class="status-line">${k === 'count' ? `<span class="countdown">${n}</span>` : 'Strum on every click'}</div>`; } });
      Engine.stopMic();
      const ons = gOnsets(out.frames, false).filter((t) => t > -0.2 && t < 8 * 0.75 + 0.3);
      // each onset is compared with the nearest click (raw, without latency compensation)
      const offs = ons.map((t) => { const k = Math.round(t / 0.75); return t - k * 0.75; }).filter((d) => d > -0.15 && d < 0.35);
      if (offs.length < 5) { r.innerHTML = '<div class="notice">I only caught ' + offs.length + ' strums. Strum a little louder, close to the phone, and try again.</div>'; return; }

      p.latency = clamp(med, 0, 0.35); Store.save();
      r.innerHTML = `<div class="notice"><div><b>Calibrated: ${Math.round(p.latency * 1000)} ms.</b> Based on ${offs.length} strums (spread ±${Math.round(spread * 1000)} ms). Timing feedback now subtracts this delay.</div></div>`;
    } catch (e) { if (!(e instanceof Aborted)) toast(e.message); }
  });
}

function gFinish(L, key, score, info, box, params) {
  const g = G_();
  const lvl = Store.level(key);
  let msg = '';
  if (score >= 85 && lvl < 5) { Store.setLevel(key, lvl + 1); msg = `Level up: ${lvl} → ${lvl + 1}. Next time is a little faster or harder.`; }
  else if (score < 50 && lvl > 1) { Store.setLevel(key, lvl - 1); msg = `Eased back to level ${lvl - 1} so you can build accuracy first.`; }
  g.done[L.id] = Math.max(g.done[L.id] || 0, score);
  // Mastery tracking (same engine as singing): pass = 85+, secure after passes on two separate days, then spaced reviews.
  let teachMsg = '';
  if (!L.drill) {
    const r = Teach.record(key, score >= 85, { score });
    if (r && (r.event === 'secure' || r.event === 'mastered')) { teachMsg = r.event === 'mastered' ? 'Mastered: this one stays in your long-term review.' : 'Secure: you passed this on two different days. I’ll bring it back for review.'; try { if (typeof uiCelebrate === 'function') uiCelebrate(r.event, L.title); } catch (e) {} }
    else if (r && r.event === 'review-failed') teachMsg = 'This one slipped since last time, so it’s back in regular practice.';
  }
  g.hist = g.hist || {};
  const hist = (g.hist[L.id] = (g.hist[L.id] || []).concat([{ score, issues: (info.issues || []).map((i) => i.key) }]).slice(-4));
  const recent = hist.slice(-3), counts = {};
  recent.forEach((h) => [...new Set(h.issues)].forEach((k) => { counts[k] = (counts[k] || 0) + 1; }));
  const repeated = Object.keys(counts).find((k) => counts[k] >= 2);
  let drill = null;
  if (!L.drill) {
    if (repeated && repeated.startsWith('late-into:')) { const c = repeated.split(':')[1], other = L.pair.find((x) => x !== c); drill = { label: `Practise just the change into ${c}`, why: `The change into ${c} has been the slow one twice in a row.`, adhoc: { id: L.id + '-drill', title: `Drill: ${other} → ${c}`, kind: 'change', pair: [other, c], mode: 'ladder', drill: true, text: 'Just this move. Watch the anchor finger, then let the ladder find your clean tempo.' } }; }
    else if (repeated && repeated.startsWith('wrong-string:')) { const s2 = +repeated.split(':')[1]; drill = { label: `Practise just ${STRING_NAMES[s2]}`, why: `The same string was missed twice in a row.`, adhoc: { id: L.id + '-drill', title: 'Drill: one string at a time', kind: 'chord-strings', chord: GTR_PICKS.find((x) => x.id === L.pick).chord, drill: true, text: 'Pick each string of the chord on its own so the finger learns where its string is.' } }; }
    else if (L.kind === 'chord' && recent.length >= 2 && recent.slice(-2).every((h) => h.score < 70)) drill = { label: 'Check the chord one string at a time', why: 'The full chord hasn’t rung clean twice in a row.', adhoc: { id: L.id + '-drill', title: `Drill: ${L.chord} string by string`, kind: 'chord-strings', chord: L.chord, drill: true, text: 'Find which string is muted, fix it, then strum the whole chord again.' } };
  }
  if (teachMsg) msg = msg ? msg + ' ' + teachMsg : teachMsg;
  Store.addSession({ inst: 'guitar', type: 'g-' + L.kind, title: 'Guitar: ' + L.title, g: { score, lesson: L.id, ...(info.save || {}) }, seconds: info.seconds || 60 });
  const idx = GTR_LESSONS.findIndex((x) => x.id === L.id);
  const next = params.id && idx >= 0 && idx < GTR_LESSONS.length - 1 ? GTR_LESSONS[idx + 1] : null;
  const wrap = document.createElement('div');
  wrap.className = 'stack'; wrap.style.gap = '14px';
  wrap.innerHTML = `<section class="panel stack"><div class="row" style="gap:16px">${scoreRing(score)}<div class="stack" style="gap:4px"><span class="eyebrow">Result</span><h3>${esc(info.headline)}</h3>${msg ? `<span class="muted" style="font-size:13px">${esc(msg)}</span>` : ''}</div></div>
    <div class="tips">${info.tips.map(tipHtml).join('') || '<p class="muted">Clean work.</p>'}</div></section>
    ${info.detail || ''}<div id="gai"></div>
    ${drill ? `<section class="panel row" style="gap:12px;align-items:center;border-color:var(--accent)"><div class="stack" style="flex:1;gap:2px"><b>${esc(drill.label)}</b><span class="muted" style="font-size:13px">${esc(drill.why)}</span></div><button class="btn primary" data-drill>Practise just this</button></section>` : ''}
    <div class="row"><button class="btn" data-again>${icon('redo')}Try again</button>${next ? `<button class="btn primary" data-next style="flex:1">Next: ${esc(next.title)}</button>` : ''}</div>`;
  box.appendChild(wrap);
  if (info.after) info.after(wrap);
  $('[data-again]', wrap).addEventListener('click', () => go('glesson', params));
  if (drill) $('[data-drill]', wrap).addEventListener('click', () => go('glesson', { adhoc: drill.adhoc, back: ['glesson', L.title, params] }));
  if (next) $('[data-next]', wrap).addEventListener('click', () => go('glesson', { id: next.id }));
  aiPanel($('#gai', wrap), () => ({ lesson: L.title, kind: L.kind, score, measurements: info.ai || {}, tips: info.tips.map((t) => t.h) }), gAiPrompt);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function runStrings(box, L, key, finish) {
  box.innerHTML = `<section class="panel stack"><div class="status-line" id="q">Ready?</div><div class="kb-wrap" id="fb">${fretboardSVG([], { frets: 5 })}</div><div class="row" id="score"></div><button class="btn primary" id="go">${icon('mic')}Start</button><div class="gmsg"></div></section>`;
  $('#go', box).addEventListener('click', async () => {
    await Engine.ensure();
    if (!(await gMic(box))) return;
    $('#go', box).hidden = true;
    const sig = { aborted: false }; App.abort = sig;
    const tun = gTuning(), rounds = 8, res = [];
    let prev = -1;
    for (let r = 0; r < rounds && !sig.aborted; r++) {
      let s; do { s = Math.floor(Math.random() * 6); } while (s === prev); prev = s;
      $('#q', box).innerHTML = `Pick the <b style="color:var(--accent)">${STRING_NAMES[s]}</b> string (open)`;
      $('#fb', box).innerHTML = fretboardSVG([], { frets: 5 });
      const got = await gListenNote(sig, 12);
      if (!got) { res.push({ s, ok: false, miss: true }); $('#q', box).textContent = 'I didn’t hear a note. Next one…'; await sleep(900); continue; }
      let near = 0; tun.forEach((m, i) => { if (Math.abs(got.midi - m) < Math.abs(got.midi - tun[near])) near = i; });
      const off = Math.round((got.midi - tun[near]) * 100), ok = near === s && Math.abs(off) < 70;
      res.push({ s, ok, got: near, off });
      $('#fb', box).innerHTML = fretboardSVG([{ s, f: 0, label: GPC[tun[s] % 12], cls: ok ? 'ok' : 'target' }, ...(ok ? [] : [{ s: near, f: 0, label: GPC[tun[near] % 12], cls: 'bad' }])], { frets: 5 });
      $('#q', box).innerHTML = ok ? `Yes — ${STRING_NAMES[s]}${Math.abs(off) > 20 ? ` <span class="muted" style="font-size:14px">(${Math.abs(off)}¢ ${off < 0 ? 'flat' : 'sharp'}; tune it soon)</span>` : ''}` : Math.abs(got.midi - tun[near]) > 1.5 ? `That was ${pcName(got.midi)} — play the string open, without fretting` : `That was the ${STRING_NAMES[near]}`;
      $('#score', box).innerHTML = res.map((x) => `<span class="chip ${x.ok ? 'ok' : 'sharp'}">${x.ok ? '✓' : '✗'}</span>`).join('');
      await sleep(1300);
    }
    Engine.stopMic();
    if (sig.aborted) return;
    const n = res.filter((x) => x.ok).length, score = Math.round((100 * n) / rounds);
    const mixed = {};
    res.filter((x) => !x.ok && !x.miss).forEach((x) => { const k = STRING_NAMES[x.s] + ' / ' + STRING_NAMES[x.got]; mixed[k] = (mixed[k] || 0) + 1; });
    const tips = Object.entries(mixed).map(([k]) => ({ kind: '', h: `Mixed up ${k}`, b: 'Say the names out loud thick to thin: “Eddie Ate Dynamite, Good Bye Eddie”. The thickest string is closest to your face.' }));
    finish(score, { headline: `${n} of ${rounds} strings right`, tips, ai: { rounds: res }, seconds: 90 });
  });
}

// ---------- riffs & scales ----------
function riffTargets(riff) {
  let t = 0;
  return riff.tab.map(([s, fret, beats]) => { const o = { s, fret, start: t, beats, midi: GTR_STD[s] + fret }; t += beats; return o; });
}
function scoreNotes(frames, onsets, targets, spb, lat) {
  const ev = gtrNoteEvents(frames, onsets).map((e) => ({ ...e, t: e.t - lat }));
  const used = new Set(), res = [];
  for (const tg of targets) {
    const at = tg.start * spb, win = Math.max(0.12, Math.min(0.35, tg.beats * spb * 0.45));
    let best = -1, bd = 9;
    ev.forEach((e, i) => { if (!used.has(i) && Math.abs(e.t - at) < win && Math.abs(e.t - at) < bd) { bd = Math.abs(e.t - at); best = i; } });
    if (best < 0) {
      // legato fallback: right pitch sounding in the window without a detectable pick attack
      const v = frames.filter((f) => f.voiced && f.t - lat >= at && f.t - lat < at + tg.beats * spb * 0.8).map((f) => f.midi).sort((a, b) => a - b);
      const m = v.length >= 6 ? v[v.length >> 1] : null;
      res.push(m != null && Math.round(m) === tg.midi ? { st: 'late', midi: m, off: null } : { st: 'miss' });
      continue;
    }
    used.add(best);
    const e = ev[best], off = e.t - at;
    if (e.midi == null) { res.push({ st: 'wrong', midi: null, off }); continue; }
    const r = Math.round(e.midi);
    res.push({ st: r === tg.midi ? (Math.abs(off) <= 0.07 ? 'ok' : 'late') : 'wrong', midi: e.midi, octave: r !== tg.midi && (r - tg.midi) % 12 === 0, off });
  }
  return { res, extra: ev.filter((e, i) => !used.has(i) && e.t > -0.2 && e.t < (targets[targets.length - 1].start + targets[targets.length - 1].beats) * spb).length };
}
function timingTips(offs, label) {
  const tips = [];
  if (offs.length < 3) return tips;
  const m = mean(offs), s = std(offs);
  if (m > 0.04) tips.push({ kind: 'flat', h: `You’re ${Math.round(m * 1000)} ms behind the beat`, b: `Your ${label} land after the click. Count out loud and start the motion slightly earlier, so the sound lands on the click instead of reacting to it.` });
  else if (m < -0.04) tips.push({ kind: 'sharp', h: `You’re rushing by ${Math.round(-m * 1000)} ms`, b: `Your ${label} come before the click. Relax and let the click arrive first in your head; tapping your foot helps lock in.` });
  if (s > 0.045) tips.push({ kind: '', h: `Timing varies by about ±${Math.round(s * 1000)} ms`, b: 'Keep the motion even and continuous. Slow the tempo down until every note sits on the click, then speed up.' });
  return tips;
}

// ---------- strumming ----------
function strumTimeline(grid, bars, onsets, e8) {
  const W = 8 * 40 + 20, rowH = 34, H = bars * rowH + 8;
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Your strums against the pattern">`;
  for (let b = 0; b < bars; b++) {
    const y = 4 + b * rowH;
    for (let i = 0; i < 8; i++) {
      const x = 10 + i * 40;
      g += `<rect x="${x + 2}" y="${y}" width="36" height="${rowH - 8}" rx="6" fill="${grid[i] === '-' ? 'var(--panel-2)' : 'var(--accent-soft)'}"/>`;
      if (grid[i] !== '-') g += `<text x="${x + 20}" y="${y + 17}" text-anchor="middle" font-size="12" fill="var(--accent)" font-weight="700">${grid[i] === 'D' ? '↓' : '↑'}</text>`;
    }
    for (const o of onsets) {
      const pos = o.t / e8 - b * 8;
      if (pos < -0.5 || pos >= 7.5) continue;
      const x = 10 + (pos + 0.5) * 40;
      g += `<line x1="${x}" x2="${x}" y1="${y - 1}" y2="${y + rowH - 7}" stroke="${o.cls === 'ok' ? 'var(--ok)' : o.cls === 'extra' ? 'var(--sharp)' : 'var(--flat)'}" stroke-width="3" stroke-linecap="round"/>`;
    }
  }
  return g + '</svg>';
}

}

      <p class="muted" style="font-size:14px">${mode === 'ladder' ? 'Start slow and clean. Each clean round (80% of chord changes on time) raises the tempo by 8 bpm, up to your target.' : mode === 'timed' ? `${bpm} bpm. Four down-strums per bar, switch chord every bar, for 8 bars.` : 'No click. Strum once, switch, strum once, switch… as fast as you can while keeping each chord clean. 60 seconds.'}</p>
      <div id="ladder"></div><div class="row" style="gap:14px;align-items:center${mode === 'ladder' ? ';display:none' : ''}"><div class="note-big" id="big" style="font-size:60px;min-width:3ch">${A}</div><div class="stack"><span class="muted" id="nxt"></span><span class="mono" id="cnt" style="font-size:22px"></span></div></div>
      <div class="status-line gstat"></div><div id="bars"></div>
      <button class="btn primary big" id="go">${icon('mic')}Start</button><div class="gmsg"></div>`;
    $('#md', box).addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b) { mode = b.dataset.m; render(); } });
    transitionPanel($('#trp', box), A, B);
    $('#go', box).addEventListener('click', mode === 'ladder' ? ladder : mode === 'timed' ? timed : minute);
  };
  async function ladder() { await Engine.ensure(); if (!(await gMic(box))) return; $('#go', box).disabled = true; $('#md', box).hidden = true; await changeLadder(box, L, key, finish); }
  async function timed() {
    await Engine.ensure();
    if (!(await gMic(box))) return;
    $('#go', box).disabled = true;
    const sig = { aborted: false }; App.abort = sig;
    const spb = 60 / bpm, bars = 8;
    let raf = 0, T0 = 0;
    const tick = () => { const b = Math.floor((Engine.ctx.currentTime - T0) / (4 * spb)); if (b >= 0 && b < bars) { $('#big', box).textContent = b % 2 ? B : A; $('#nxt', box).textContent = 'next: ' + (b % 2 ? A : B); $('#cnt', box).textContent = 'bar ' + (b + 1) + ' / ' + bars; } raf = requestAnimationFrame(tick); };
    try {
      const out = await gRun({ bpm, beats: bars * 4, countIn: 4, clicks: true, sig, onStart: (t) => { T0 = t; raf = requestAnimationFrame(tick); }, status: (k, n) => { statusEl(box).innerHTML = k === 'count' ? `<span class="countdown">${n}</span>` : 'Strum on every click'; } });
      cancelAnimationFrame(raf); Engine.stopMic();
      const lat = Engine.latency(), ons = gOnsets(out.frames, clicksLeak()).map((t) => t - lat);
      const expected = []; for (let k = 0; k < bars * 4; k++) expected.push({ t: k * spb, bar: Math.floor(k / 4), beat: k % 4 });
      const { hits } = scoreStrums(ons, expected, spb / 2);
      hits.forEach((h) => { if (h.on == null) { h.ok = false; return; } const want = h.bar % 2 ? B : A; h.ok = gtrMatches(gtrDetectChord(gSpecAt(out.rec, h.on + lat + 0.03, 8192), Store.a4()), want); });
      const firstBeats = hits.filter((h) => h.beat === 0 && h.bar > 0);
      const fbOk = firstBeats.filter((h) => h.ok).length / firstBeats.length, allOk = hits.filter((h) => h.ok).length / hits.length;
      const timingOk = hits.filter((h) => h.on != null && Math.abs(h.off) < 0.08).length / hits.length;
      const score = Math.round(100 * (0.45 * allOk + 0.35 * fbOk + 0.2 * timingOk));
      const tips = [];
      const slowInto = { [A]: 0, [B]: 0 };
      firstBeats.filter((h) => !h.ok).forEach((h) => { slowInto[h.bar % 2 ? B : A]++; });
      Object.entries(slowInto).forEach(([n, k]) => { if (k >= 2) tips.push({ kind: 'flat', h: `Changes into ${n} are late`, b: `On ${k} bars the first strum of ${n} didn’t sound like ${n} yet. Practise the switch slowly without strumming: lift all fingers at once, hover the shape, land together. Look for a finger that can stay down or slide.` }); });
      const mid = hits.filter((h) => h.beat > 0 && h.on != null && !h.ok);
      if (mid.length >= 3) tips.push({ kind: 'sharp', h: 'Chords lose clarity mid-bar', b: 'Keep steady pressure through the bar. Check each chord alone in Chords for muted strings.' });
      if (timingOk < 0.75) tips.push({ kind: '', h: 'Strums drift from the click', b: 'Keep strumming on the beat even if the chord isn’t ready yet. Strum open strings rather than stopping.' });
      if (!tips.length && score >= 85) tips.push({ kind: 'good', h: 'Smooth changes', b: 'Tempo goes up next time.' });
      const grid = `<section class="panel stack"><span class="eyebrow">Bar by bar</span><div class="bars">${Array.from({ length: bars }, (_, b) => `<div><span class="mono faint">${b % 2 ? B : A}</span>${hits.filter((h) => h.bar === b).map((h) => `<i class="${h.ok ? 'ok' : h.on == null ? 'miss' : 'bad'}"></i>`).join('')}</div>`).join('')}</div>
        <div class="graph-legend"><span><i style="background:var(--ok)"></i>Right chord</span><span><i style="background:var(--sharp)"></i>Wrong or unclear</span><span><i style="background:var(--line)"></i>No strum</span></div></section>`;
      statusEl(box).textContent = '';
      finish(score, { headline: `${Math.round(allOk * 100)}% clean strums · ${Math.round(fbOk * 100)}% of changes made in time`, tips, detail: grid, seconds: Math.round(bars * 4 * spb + 5), ai: { pair: L.pair, bpm, cleanStrumPct: Math.round(allOk * 100), changesInTimePct: Math.round(fbOk * 100), onBeatPct: Math.round(timingOk * 100) } });
    } catch (e) { cancelAnimationFrame(raf); if (!(e instanceof Aborted)) { console.error(e); toast(e.message); } }
  }
  async function minute() {
    await Engine.ensure();
    if (!(await gMic(box))) return;
    $('#go', box).disabled = true;
    const sig = { aborted: false }; App.abort = sig;
    const an = Engine.analyser(), buf = new Float32Array(an.frequencyBinCount), det = new GtrOnsets();
    let lastLabel = null, changes = 0, strums = 0, unclear = 0, lastOn = -9, t0 = Engine.ctx.currentTime + 3;
    for (let i = 0; i < 3; i++) Engine.click(Engine.ctx.currentTime + i, false);
    statusEl(box).textContent = 'Starting in 3…';
    await waitCtx(t0, sig).catch(() => {});
    if (sig.aborted) return;
    Engine.click(Engine.ctx.currentTime, true);
    statusEl(box).textContent = 'Go!';
    await new Promise((resolve) => {
      const unsub = Engine.onFrame((f) => {
        if (f.t < t0) return;
        const o = det.push(f.te, f.hf);
        if (o != null && o - lastOn > 0.25) {
          lastOn = o;
          setTimeout(() => {
            an.getFloatFrequencyData(buf);
            const d = gtrDetectChord(gtrSpectrumFromDb(buf, Engine.ctx.sampleRate, an.fftSize), Store.a4());
            strums++;
            const sa = gtrScoreFor(d, A), sb = gtrScoreFor(d, B);
            let lab = null;
            if (gtrMatches(d, A) && sa >= sb) lab = A; else if (gtrMatches(d, B)) lab = B; else unclear++;
            if (lab && lastLabel && lab !== lastLabel) changes++;
            if (lab) { lastLabel = lab; $('#big', box).textContent = lab === A ? B : A; $('#nxt', box).textContent = 'switch to'; }
            $('#cnt', box).textContent = changes + ' changes';
          }, 260);
        }
      });
      const iv = setInterval(() => { const left = 60 - (Engine.ctx.currentTime - t0); statusEl(box).textContent = Math.max(0, Math.ceil(left)) + ' s'; if (left <= 0 || sig.aborted) { unsub(); clearInterval(iv); Engine.click(Engine.ctx.currentTime, true); resolve(); } }, 200);
    });
    Engine.stopMic();
    if (sig.aborted) return;
    const k = A + '-' + B, g = G_();
    const hist = (g.changes[k] = g.changes[k] || []);
    const prevBest = hist.length ? Math.max(...hist.map((x) => x.cpm)) : null;
    hist.push({ ts: Date.now(), cpm: changes });
    const score = clamp(Math.round((changes / 60) * 100), 0, 100);
    const tips = [];
    if (prevBest != null) tips.push({ kind: changes > prevBest ? 'good' : '', h: changes > prevBest ? `New best (previous ${prevBest})` : `Your best is ${prevBest}`, b: 'Do this daily; the number climbs quickly in the first two weeks.' });
    if (strums && unclear / strums > 0.3) tips.push({ kind: 'flat', h: `${unclear} of ${strums} strums weren’t clearly either chord`, b: 'Speed only counts when the chord rings. Slow down a little so each shape lands complete.' });
    tips.push({ kind: '', h: 'What to aim for', b: 'Many teachers suggest building toward about 60 clean changes a minute for common open-chord pairs. Under 30 is normal at the start.' });
    finish(score, { headline: `${changes} clean changes in one minute`, tips, seconds: 65, save: { cpm: changes, pair: L.pair }, ai: { pair: L.pair, changesPerMinute: changes, strums, unclearStrums: unclear, previousBest: prevBest } });
  }
  render();
}

    try {

      cancelAnimationFrame(raf); Engine.stopMic();
