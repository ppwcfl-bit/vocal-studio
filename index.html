// ---------- find the note / ear training ----------
function runQuiz(box, L, key, finish, ear) {
  box.innerHTML = `<section class="panel stack"><div class="status-line" id="q">Ready?</div><div class="kb-wrap" id="fb">${fretboardSVG([])}</div><div class="row" id="score"></div>
    <div class="row"><button class="btn primary" id="go">${icon('mic')}Start</button>${ear ? `<button class="btn" id="rep" hidden>${icon('play')}Play it again</button>` : ''}</div><div class="gmsg"></div></section>`;
  const lvl = Store.level(key);
  $('#go', box).addEventListener('click', async () => {
    await Engine.ensure();
    if (!(await gMic(box))) return;
    $('#go', box).hidden = true;
    const sig = { aborted: false }; App.abort = sig;
    const rounds = 8, res = [], tun = gTuning();
    let target = null;
    if (ear) $('#rep', box).addEventListener('click', () => { if (target != null) { gPlayNote(target, Engine.ctx.currentTime + 0.02, 1.4); ignore = Engine.ctx.currentTime + 1.6; } });
    let ignore = 0;
    for (let r = 0; r < rounds && !sig.aborted; r++) {
      let s, f;
      if (ear) { s = Math.floor(Math.random() * (lvl >= 3 ? 6 : 4)); f = Math.floor(Math.random() * (lvl >= 2 ? 6 : 4)); }
      else { s = Math.random() < 0.5 ? 0 : 1; do { f = Math.floor(Math.random() * (lvl >= 3 ? 13 : 12)); } while (lvl < 3 && GPC[(tun[s] + f) % 12].includes('♯')); }
      target = tun[s] + f;
      $('#fb', box).innerHTML = fretboardSVG([]);
      if (ear) { $('#rep', box).hidden = false; $('#q', box).textContent = 'Listen…'; gPlayNote(target, Engine.ctx.currentTime + 0.05, 1.4); ignore = Engine.ctx.currentTime + 1.6; await sleep(1500); $('#q', box).textContent = 'Now find it and play it'; }
      else $('#q', box).innerHTML = `Play <b style="color:var(--accent)">${GPC[target % 12]}</b> on the <b>${STRING_NAMES[s]}</b> string`;
      const got = await gListenNote(sig, 20, ignore);
      if (sig.aborted) break;
      const correctMarks = ear ? positionsOf(target, 12).map((p) => ({ ...p, label: GPC[target % 12].replace('♯', '#'), cls: 'ok' })) : [{ s, f, label: GPC[target % 12].replace('♯', '#'), cls: 'ok' }];
      if (!got) { res.push({ ok: false, miss: true, target }); $('#q', box).textContent = 'Time’s up. Here it is:'; $('#fb', box).innerHTML = fretboardSVG(correctMarks); await sleep(2000); continue; }
      const m = Math.round(got.midi), ok = m === target, pcOk = !ok && (m - target) % 12 === 0;
      res.push({ ok, pcOk, target, got: m });
      $('#fb', box).innerHTML = fretboardSVG(correctMarks);
      $('#q', box).innerHTML = ok ? 'Yes! ' + pcName(target) : pcOk ? `Right note, different octave (${pcName(m)}). ${ear ? 'The note I played was ' + pcName(target) : 'On ' + STRING_NAMES[s] + ' it’s fret ' + f} — shown in green.` : `That was ${pcName(m)} (${Math.abs(m - target)} fret${Math.abs(m - target) > 1 ? 's' : ''} ${m > target ? 'too high' : 'too low'}). Shown in green.`;
      $('#score', box).innerHTML = res.map((x) => `<span class="chip ${x.ok ? 'ok' : x.pcOk ? 'accent' : 'sharp'}">${x.ok ? '✓' : x.pcOk ? '~' : '✗'}</span>`).join('');
      await sleep(ok ? 1200 : 2400);
    }
    Engine.stopMic();
    if (sig.aborted) return;
    const n = res.filter((x) => x.ok).length, half = res.filter((x) => x.pcOk).length;
    const score = Math.round((100 * (n + half * 0.5)) / rounds);
    const tips = [];
    const wrongs = res.filter((x) => !x.ok && x.got != null && !x.pcOk);
    if (wrongs.length >= 2) {
      const dirs = wrongs.map((x) => x.got - x.target);
      const avg = mean(dirs);
      if (ear && Math.abs(avg) >= 1) tips.push({ kind: avg < 0 ? 'flat' : 'sharp', h: `You tend to guess ${avg < 0 ? 'low' : 'high'}`, b: 'Hum the note first, then slide a finger up the string until it matches your hum.' });
      else tips.push({ kind: '', h: `${wrongs.length} misses`, b: ear ? 'Start on the right string: a note that sounds low is on the thick strings. Then move one fret at a time.' : 'Landmarks help: frets 5, 7 and 12 on the low E are A, B and E; on the A string they’re D, E and A. Count from the nearest one.' });
    }
    if (half) tips.push({ kind: '', h: `${half} right note${half > 1 ? 's' : ''}, wrong octave`, b: ear ? 'You heard the note name correctly — listen for how high or low it is too.' : 'Stay on the string I name; the same note repeats 12 frets higher.' });
    if (score >= 85 && !tips.length) tips.push({ kind: 'good', h: 'Sharp ears', b: 'Next time the notes spread over more strings and frets.' });
    finish(score, { headline: `${n} of ${rounds} exact${half ? `, ${half} in the wrong octave` : ''}`, tips, seconds: 120, ai: { rounds: res.map((x) => ({ target: pcName(x.target), played: x.got != null ? pcName(x.got) : null })) } });
  });
}
const runFind = (box, L, key, finish) => runQuiz(box, L, key, finish, false);
const runEar = (box, L, key, finish) => runQuiz(box, L, key, finish, true);

// ===================== Guitar: transitions, fingerpicking, legato, playable theory =====================

// ---------- chord transition analysis ----------
// For each finger 1–4: where it is in chord A and in chord B, and what it does in between.
function fingerPos(c, finger) {
  const ss = c.frets.map((f, s) => (c.fingers[s] === finger && f > 0 ? s : null)).filter((s) => s != null);
  if (!ss.length) return null;
  return { s: ss[0], f: c.frets[ss[0]], barre: ss.length > 1 ? ss : null };
}
function transitionInfo(a, b) {
  const A = CHORD[a], B = CHORD[b], out = [];
  for (let fi = 1; fi <= 4; fi++) {
    const p = fingerPos(A, fi), q = fingerPos(B, fi);
    if (!p && !q) continue;
    let kind;
    if (p && q && p.s === q.s && p.f === q.f) kind = 'anchor';
    else if (p && q && p.s === q.s) kind = 'guide';

  { n: 3, name: 'Together: one strum per chord', short: 'One strum', voice: true, guitar: 'changes', tempo: 0.8, text: 'Strum once when the chord changes and let it ring while you sing. This is where hands and voice first work together.' },
  { n: 4, name: 'Together: strum every beat', short: 'Every beat', voice: true, guitar: 'beats', tempo: 0.8, text: 'Down-strum on every beat while you sing. Keep the strumming arm moving even when the voice is busy.' },
  { n: 5, name: 'Together at full tempo', short: 'Full tempo', voice: true, guitar: 'beats', tempo: 1, text: 'The same, at the song’s real tempo.' },
  { n: 6, name: 'Whole song, no guides', short: 'Perform', voice: true, guitar: 'beats', tempo: 1, whole: true, text: 'Every section in a row, full tempo, no guide melody. Perform it.' },

function spAnalyse(el, d, st, x, T, out, plan) {
  const lat = Engine.latency();
  let gScore = null, vScore = null, gInfo = null, vInfo = null;
  const tips = [];
  if (x.guitar) {
    const ons = gOnsets(out.frames, clicksLeak()).map((t) => t - lat);
    const win = x.guitar === 'changes' ? T.spb * 0.6 : T.spb / 2;
    const { hits } = scoreStrums(ons, T.strums, win);
    hits.forEach((h) => { if (h.on == null) { h.ok = false; return; } if (!h.change) { h.ok = true; return; } h.ok = gtrMatches(gtrDetectChord(gSpecAt(out.rec, h.on + lat + 0.04, 8192), Store.a4()), h.chord); });
    const changes = hits.filter((h) => h.change), played = hits.filter((h) => h.on != null);
    const onTime = played.filter((h) => Math.abs(h.off) < 0.08).length / hits.length;
    const changeOk = changes.length ? changes.filter((h) => h.ok && Math.abs(h.off) < 0.12).length / changes.length : 1;
    gScore = Math.round(100 * (0.55 * changeOk + 0.45 * onTime));
    const lateCh = changes.filter((h) => h.on != null && h.off > 0.12), wrongCh = changes.filter((h) => h.on != null && !h.ok), missedCh = changes.filter((h) => h.on == null);
    gInfo = { changes: changes.length, changesClean: Math.round(changeOk * 100), onBeatPct: Math.round(onTime * 100), lateChanges: lateCh.length, wrongChord: wrongCh.map((h) => h.chord), missedChanges: missedCh.length };
    if (missedCh.length) tips.push({ kind: 'flat', h: `${missedCh.length} chord change${missedCh.length > 1 ? 's' : ''} without a strum`, b: x.voice ? 'When the voice is busy, the strumming hand tends to stop. Keep the arm moving even if you miss a chord: strum muted strings rather than stopping.' : 'Keep strumming through the change; a late chord is better than a gap.' });
    if (lateCh.length) tips.push({ kind: 'flat', h: `Late into ${[...new Set(lateCh.map((h) => h.chord))].join(', ')}`, b: 'Start moving to the next chord on the last beat of the bar, not on the first beat of the new one.' });
    if (wrongCh.length) tips.push({ kind: 'sharp', h: `${[...new Set(wrongCh.map((h) => h.chord))].join(', ')} didn’t sound clean`, b: 'Check the shape away from the song with the chord lesson, then come back.' });
  }
  if (x.voice) {
    let frames = out.frames;
    if (x.guitar) frames = vcVoiceOnly(frames);
    const targets = T.notes.filter((n) => n.midi != null);
    if (!targets.length) {
      const k = d.catalog ? songKey(d.src) : { root: plan.sounding, minor: false };
      const va = songVoiceAnalysis(frames, T.chords, (k.root + (plan.shift || 0) + 12) % 12, k.minor, lat, !!x.guitar), fb = songVoiceFeedback(va, { capo: plan.best && plan.best.capo });
      vScore = va ? va.score : 0; vInfo = va ? { tuningErrCents: va.meanAbs, biasCents: va.bias, stability: va.stability, inKeyPct: va.inKeyPct, onChordPct: va.onChordPct, range: pcName(va.lo) + '–' + pcName(va.hi) } : { heard: false };
      tips.push(...fb.tips.slice(0, 2));
      if (d.catalog) { const ss = songState(d.song); ss.voice = (ss.voice || []).concat([{ at: Date.now(), score: vScore, lo: va && va.lo, hi: va && va.hi, bias: va && va.bias, sec: T.chords.length }]).slice(-12); }
    } else {
    const res = scorePhrase(frames, targets, { tol: 35, latency: lat, rec: out.rec });
    vScore = res.summary.score;
    const missed = res.notes.filter((n) => n.missed).length, off = res.notes.filter((n) => !n.missed && n.score < 60);
    vInfo = { notes: targets.length, missed, offNotes: off.map((n) => ({ note: pcName(n.midi), lyric: n.lyric, cents: Math.round(n.median || 0) })), pitchScore: vScore };
    if (missed > targets.length * 0.25) tips.push({ kind: 'flat', h: `${missed} of ${targets.length} sung notes not heard`, b: x.guitar ? 'Sing out: the voice needs to be clearly louder than the guitar for me (and for an audience). Strum more softly.' : 'Sing a little louder and closer to the phone.' });
    else if (off.length) tips.push({ kind: 'sharp', h: `Off-pitch on ${off.slice(0, 3).map((n) => '“' + (n.lyric || pcName(n.midi)) + '”').join(', ')}`, b: 'Sing those words alone over the chord, slowly, then put them back in.' });
    }
  }
  // Which part is weaker? Compare together-scores with the student's own solo levels.
  let weak = null;
  if (gScore != null && vScore != null) {
    const soloG = st.best[1], soloV = st.best[2];
    const dropG = soloG != null ? soloG - gScore : 0, dropV = soloV != null ? soloV - vScore : 0;
    if (dropG >= 15 && dropV >= 15) weak = 'coordination';
    else if (gScore + 12 < vScore) weak = 'guitar';
    else if (vScore + 12 < gScore) weak = 'voice';
    if (weak === 'coordination') tips.unshift({ kind: '', h: 'Each part is fine alone; combining them is the hard bit', b: 'That’s normal. Go back one level, or keep this level but strum only on the first beat of each bar until it feels automatic.' });
    else if (weak === 'guitar') tips.unshift({ kind: '', h: 'The guitar is the weaker part right now', b: soloG != null && soloG < 80 ? 'The changes aren’t secure even without singing. Practise the guitar part alone (level 1) first.' : 'Your guitar slips when you sing. Hum the melody instead of singing words while you strum, then add words.' });
    else if (weak === 'voice') tips.unshift({ kind: '', h: 'The voice is the weaker part right now', b: soloV != null && soloV < 80 ? 'The melody isn’t secure yet even alone. Sing it over the backing (level 2) first.' : 'Your pitch slips when you play. Strum more softly and simply (one strum per chord) so attention can go to the voice.' });
  }
  const parts = [gScore, vScore].filter((v) => v != null);
  const score = Math.round(parts.reduce((a, b) => a + b, 0) / parts.length);
  // Pass: every measured part at 80+ (and, together, neither below 75).
  const pass = parts.every((v) => v >= 80);
  st.best[x.n] = Math.max(st.best[x.n] || 0, score);
  st.hist = (st.hist || []).concat([{ lvl: x.n, g: gScore, v: vScore, at: Date.now() }]).slice(-20);
  let msg = '';
  const r = Teach.record('sp:' + d.song + ':' + x.n, pass, { score });
  if (pass && x.n >= st.lvl && x.n < 6) { st.lvl = x.n + 1; msg = `Passed. Next suggested: level ${st.lvl}, ${SP_LEVELS[st.lvl - 1].name.toLowerCase()}.`; }
  if (r && (r.event === 'secure' || r.event === 'mastered')) { try { if (typeof uiCelebrate === 'function') uiCelebrate(r.event, d.songObj.title); } catch (e) {} }
  if (d.catalog) { const ss = songState(d.song); ss.steps['sp' + x.n] = Math.max(ss.steps['sp' + x.n] || 0, score); ss.last = Date.now(); }
  Store.addSession({ inst: 'both', type: 'singplay', songId: d.catalog ? d.song : undefined, title: 'Sing + Play: ' + d.songObj.title + ' (L' + x.n + ')', sp: { song: d.song, lvl: x.n, guitar: gScore, voice: vScore, weak }, seconds: Math.round(T.total + 6) });
  if (!tips.length) tips.push({ kind: 'good', h: pass ? 'Both parts held together' : 'Getting there', b: pass ? 'Run it once more tomorrow to make it stick.' : 'Same level again.' });
  const box = $('#res', el);
  box.innerHTML = `<section class="panel stack"><div class="row" style="gap:16px;align-items:center">${scoreRing(score)}<div class="stack" style="gap:6px">
      <span class="eyebrow">Result · ${esc(x.label || 'level ' + x.n)}</span>
      <div class="row" style="gap:8px">${gScore != null ? `<span class="chip ${gScore >= 80 ? 'ok' : 'sharp'}">Guitar ${gScore}</span>` : ''}${vScore != null ? `<span class="chip ${vScore >= 80 ? 'ok' : 'sharp'}">Voice ${vScore}</span>` : ''}</div>
      ${msg ? `<b>${esc(msg)}</b>` : `<span class="muted" style="font-size:13px">${pass ? 'Passed.' : 'Pass = 80+ on each part.'}</span>`}</div></div>
    <div class="tips">${tips.slice(0, 4).map(tipHtml).join('')}</div></section><div id="spai"></div>`;
  aiPanel($('#spai', box), () => ({ song: d.songObj.title, level: x.name, key: plan.soundingName, capo: plan.best ? plan.best.capo : 0, guitar: gInfo, voice: vInfo, weakerPart: weak, appNotes: tips.map((t) => t.h) }), (c) => `You are a teacher of singing while playing guitar. A student just tried "${c.song}" at the level "${c.level}" in the key of ${c.key}${c.capo ? ' (capo ' + c.capo + ')' : ''}.
These measurements come from their real microphone: GUITAR ${JSON.stringify(c.guitar)}; VOICE ${JSON.stringify(c.voice)}; the app judged the weaker part as: ${c.weakerPart || 'neither / not applicable'}. App notes: ${JSON.stringify(c.appNotes)}.
The app can't see the hands and the voice/guitar separation is approximate. Give one sentence on how it went, the single most useful fix (guitar, voice or coordination, whichever the data points to), with a concrete practice step, and what to do on the next attempt. Under 120 words, plain text.`);
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  App.lastCoachCtx = { song: d.song, take: { score, gScore, vScore }, feedback: { headline: pass ? 'That take passed' : 'Here’s that take', tips: tips.slice(0, 4) } };
  return { score, gScore, vScore, pass, tips: tips.slice(0, 4), gInfo, vInfo, weak, song: d.songObj.title };
}

  if (a.stability != null && a.stability > 28) tips.push({ kind: '', h: 'Held notes wavered', b: 'The pitch wobbled more than a controlled vibrato would. Practise the long notes on their own, starting straight and steady before adding any vibrato.', ex: 'sustain' });
  if (a.inKeyPct != null && a.inKeyPct < 80) tips.push({ kind: 'sharp', h: `Some notes fell outside the key (${a.outKey.map((o) => o.note).join(', ')})`, b: 'Those are probably wrong notes rather than tuning. Listen to the original for that phrase, then sing it slowly over the chord.', ex: 'echo' });
  if (a.hi > r.high + 1) tips.push({ kind: '', h: `You reached ${pcName(a.hi)}, above your comfortable top (${pcName(r.high)})`, b: `This key may be high for you right now. Try the capo ${ctx && ctx.capo ? 'one or two frets lower' : 'option below'} or lower the key, then work up.` , key: -Math.min(3, a.hi - r.high) });
  else if (a.lo < r.low - 1) tips.push({ kind: '', h: `You went down to ${pcName(a.lo)}, below your comfortable bottom (${pcName(r.low)})`, b: 'This key may sit low for your voice. Moving the capo up a fret or two will lift the whole song.', key: Math.min(3, r.low - a.lo) });
  const headline = good.length ? good[0].charAt(0).toUpperCase() + good[0].slice(1) + (good[1] ? ', and ' + good[1] : '') + '.' : 'Here’s what I heard.';
  if (a.notes < 4) tips.unshift({ kind: '', h: `I only heard ${a.notes} note${a.notes > 1 ? 's' : ''}`, b: 'That’s enough to check tuning, but not phrasing or range. Sing the whole section next time.' });
  if (!tips.length) tips.push({ kind: 'good', h: 'Solid take', b: 'Tuning and stability are both good. Next, work on expression: shape the dynamics of each phrase.' });
  return { headline, tips: tips.slice(0, 3) };
}

// ---------- talking ----------
async function say(text, opts) {
  if (!CS || !CS.active) return;
  opts = opts || {};
  text = String(text).trim(); if (!text) return;
  appendLog({ who: 'coach', text });
  const cap = CS.el && $('#cs-cap', CS.el); if (cap) cap.textContent = text;
  setState('speaking');
  const hp = Store.data.profile.headphones;
  if (!hp) CS.seg.gate(Infinity);
  CS.spokeAt = Engine.ctx.currentTime;
  const ac = new AbortController(); CS.speechAbort = ac;
  await Say.speak(text, { signal: ac.signal });
  CS.speechAbort = null;
  if (!hp) { CS.seg.gateUntil = Engine.ctx.currentTime + 0.35; }
  CS.saidUntil = performance.now() + (hp ? 0 : 900);
}
function stopTalking() { if (CS && CS.speechAbort) CS.speechAbort.abort(); Say.stop(); }

// Wait for a reply (spoken, tapped or typed). Resolves {text, intent} or null.
function waitReply(secs, chips) {
  setChips(chips);
  setState('listening', 'Listening — answer out loud' + (Hear.on ? '' : ' or tap'));
  return new Promise((resolve) => {
    const t0 = performance.now();
    CS.replyWaiter = (u) => { clearInterval(iv); CS.replyWaiter = null; setChips([]); resolve(u); };
    const iv = setInterval(() => {
      if (!CS || !CS.active || CS.cmd === 'end') { clearInterval(iv); if (CS) CS.replyWaiter = null; resolve(null); return; }
      if (!CS.paused && performance.now() - t0 > secs * 1000) { clearInterval(iv); CS.replyWaiter = null; setChips([]); resolve(null); }
    }, 150);
  });
}

// Everything the person says or taps arrives here.
function utterance(text, via) {
  if (!CS || !CS.active) return;
  const it = coachIntent(text);
  appendLog({ who: 'you', text: (via === 'tap' ? '' : '') + text });
  const u = { text, ...it };
  if (it.intent === 'pain') { command('pain', u); return; }
  if (CS.replyWaiter) { CS.replyWaiter(u); return; }
  const map = { confused: 'confused', frustrated: 'frustrated', focus: 'focus', end: 'end', pause: 'pause', resume: 'resume', demo: 'demo', next: 'next', lower: 'lower', higher: 'higher', slower: 'slower', retry: 'retry', how: 'how', 'guitar-on': 'guitar-on', 'guitar-off': 'guitar-off', talk: 'talk', yes: 'retry' };
  command(map[it.intent] || 'talk', u);
}
function command(cmd, u) {
  if (!CS || !CS.active) return;
  if (cmd === 'resume') { if (CS.paused) { CS.paused = false; setState('thinking'); if (CS.resumeWaiter) CS.resumeWaiter(); } return; }
  if (cmd === 'guitar-on' || cmd === 'guitar-off') { setAccompany(cmd === 'guitar-on'); return; }
  CS.cmd = cmd; CS.cmdU = u || null;
  if (CS.replyWaiter && cmd !== 'pain' && cmd !== 'end') { CS.replyWaiter({ text: u ? u.text : cmd, intent: cmd }); }
  if (cmd === 'pause') { CS.paused = true; setState('paused'); }
  // interrupt whatever is happening
  if (CS.attemptSig) CS.attemptSig.aborted = true;
  if (cmd !== 'how' && cmd !== 'talk') { stopTalking(); Engine.stopAll(); }
  if (CS.replyWaiter && (cmd === 'pain' || cmd === 'end')) CS.replyWaiter(null);
}
function setAccompany(on, fromUi) {
  C_().accompany = on; Store.save();
  Engine.minClarity = on ? 0.6 : 0.8;
  const cb = CS && CS.el && $('#cs-acc', CS.el); if (cb) cb.checked = on;
  if (!fromUi) appendLog({ who: 'sys', text: on ? 'Guitar accompaniment mode on' : 'Guitar accompaniment mode off' });
}

// ---------- session lifecycle ----------
async function startSession(el, opts) {
  await Engine.ensure();
  // speech must be unlocked from the tap
  if (Say.available()) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  const msg = document.createElement('div');
  el.appendChild(msg);
  if (!(await micOrNotice(msg))) return;
  CS = { active: true, log: [], state: 'thinking', cmd: null, paused: false, kind: opts.kind, songId: opts.songId, started: Date.now(), results: [], lastSegKind: null, lastSegAt: 0, spokenOnce: {}, shift: {}, milestones: [] };
  setAccompany(!!C_().accompany, true);
  CS.seg = new VcSegmenter((seg, cls) => onSegment(seg, cls), { hang: 0.55 });
  CS.seg.sr = Engine.ctx.sampleRate;
  CS.unsubFrames = Engine.onFrame((f) => { CS.seg.push(f); liveNote(f); });
  if (Store.data.profile.coachHandsFree !== false && Hear.supported()) Hear.start();
  CS.unsubHear = Hear.onText((text, at, err) => {
    if (err) { appendLog({ who: 'sys', text: 'Speech recognition is unavailable here (' + err + '). Tap the reply buttons or type instead.' }); return; }
    if (!CS || !CS.active) return;
    // ignore my own voice coming back through the speaker, and sung lyrics
    if (performance.now() < (CS.saidUntil || 0) || (Say.speaking && !Store.data.profile.headphones)) return;
    const lastCoach = [...CS.log].reverse().find((m) => m.who === 'coach');
    if (lastCoach && echoOf(text, lastCoach.text)) return;
    const recentSing = CS.lastSegKind && /singing|humming|guitar/.test(CS.lastSegKind) && performance.now() - CS.lastSegAt < 2500 && !(CS.lastSpeechAt && performance.now() - CS.lastSpeechAt < 2500);
    if (recentSing) { appendLog({ who: 'sys', text: 'Heard singing — not treating it as a reply.' }); return; }
    if (Say.speaking && Store.data.profile.headphones) stopTalking();
    utterance(text, 'voice');
  });
  go('coach');
  try {
    if (opts.kind === 'song') await songLesson(opts.songId);
    else await lesson();
  } catch (e) {
    if (!(e instanceof Aborted)) { console.error(e); if (CS) appendLog({ who: 'sys', text: 'Something went wrong: ' + e.message }); }
  }
  endSession('done');
}
function echoOf(heard, said) {
  const w = (s) => String(s).toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter((x) => x.length > 2);
  const a = w(heard), b = new Set(w(said));
  return a.length >= 3 && a.filter((x) => b.has(x)).length / a.length > 0.7;
}
function endSession(why) {
  if (!CS || !CS.active) return;
  CS.active = false;
  if (CS.attemptSig) CS.attemptSig.aborted = true;
  try { CS.unsubFrames && CS.unsubFrames(); CS.unsubHear && CS.unsubHear(); } catch (e) {}
  Hear.stop(); Say.stop(); Engine.stopAll(); Engine.stopMic(); Engine.minClarity = 0.8;
  if (!CS.saved) saveLesson(why === 'left' ? 'Ended early' : null);
  const was = CS; CS = null;
  if (why !== 'left' && App.view === 'coach') go('coach');
  return was;
}

// ---------- the ears: segments + live display ----------
function onSegment(seg, cls) {
  if (!CS) return;
  CS.lastSegKind = cls.kind; CS.lastSegAt = performance.now();
  const label = { speech: 'Heard: speech', singing: 'Heard: singing', humming: 'Heard: humming', guitar: 'Heard: guitar', noise: 'Heard: noise' }[cls.kind];
  const ch = CS.el && $('#cs-heard', CS.el); if (ch) { ch.textContent = label; ch.className = 'chip ' + (cls.kind === 'speech' ? 'accent' : cls.kind === 'singing' || cls.kind === 'humming' ? 'ok' : ''); }
  if (cls.kind === 'speech') {
    CS.lastSpeechAt = performance.now();
    // Without speech recognition we know you spoke but not the words

// ---------- helpers for the flow ----------
async function checkpoint() {
  // returns a command for the flow to act on ('end' | 'next' | null) after handling pause/how/talk
  while (CS && CS.active) {
    const cmd = CS.cmd;
    if (!cmd) return null;
    if (cmd === 'pause') {
      CS.cmd = null;
      await say('Okay, pausing. Say “continue” or tap Resume when you’re ready.');
      CS.paused = true; setState('paused');
      await new Promise((r) => { CS.resumeWaiter = r; });
      CS.resumeWaiter = null;
      continue;
    }
    if (cmd === 'how') { CS.cmd = null; await say(describeLast()); continue; }
    if (cmd === 'talk') { const u = CS.cmdU; CS.cmd = null; await answer(u ? u.text : ''); continue; }
    if (cmd === 'pain') { CS.cmd = 'end'; await healthStop(); return 'end'; }
    if (cmd === 'focus') {
      const f = focusFromText(CS.cmdU ? CS.cmdU.text : ''); CS.cmd = null;
      if (f) { CS.pendingFocus = f; await say(`Absolutely. ${focusMemory(f)} Let’s switch to ${FOCUS_LABEL[f]} now.`); return 'next'; }
      continue;
    }
    if (cmd !== 'end') CS.cmd = null;
    return cmd;
  }
  return 'end';
}
function describeLast() {
  const r = CS.results[CS.results.length - 1];
  if (!r) return 'We haven’t sung anything yet. Let’s get you warmed up first.';
  const s = r.res.summary;
  return `On ${EX[r.id] ? EX[r.id].title.toLowerCase() : 'that'}, you were in tune ${s.accuracy} percent of the time${s.bias != null && Math.abs(s.bias) >= 10 ? `, sitting about ${Math.abs(Math.round(s.bias))} cents ${s.bias < 0 ? 'flat' : 'sharp'} on average` : ''}${s.stability != null ? `, with your held notes wavering about ${Math.round(s.stability)} cents` : ''}.`;
}
async function healthStop() {

}
async function answer(text) {

function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
function minutesIn() { return (Date.now() - CS.started) / 60000; }

// One attempt at an exercise phrase set: demo → your turn → analysis.
async function attempt(ex, cfg, phrases) {
  const results = [];
  for (let i = 0; i < phrases.length; i++) {
    const demoT = timePhrase(phrases[i], cfg.bpm);
    const lead = cfg.mode === 'call' ? 0.35 : 0;
    const tg = demoT.map((t) => ({ ...t, start: t.start + lead, dur: cfg.mode === 'call' ? t.dur + 0.3 : t.dur }));
    const span = tg[tg.length - 1].start + tg[tg.length - 1].dur;
    const sig = { aborted: false }; CS.attemptSig = sig;
    CS.curTarget = tg[0].midi; CS.tol = cfg.tol; CS.speechDuringAttempt = false; CS.guitarHeard = false;
    const fr = [];
    let T0 = Infinity, raf = 0;
    CS.graph.fitTo(tg.map((t) => t.midi));
    CS.graph.set({ targets: tg, frames: fr, t0: -0.3, t1: span + 0.5, tol: cfg.tol, playhead: null, shift: 0 });
    const t = $('#cs-target', CS.el); if (t) t.textContent = 'Target: ' + tg.map((x) => nm(x.midi)).join(' ');
    const loop = () => {
      const now = Engine.ctx.currentTime - T0;
      const cur = tg.find((x) => now >= x.start && now < x.start + x.dur);
      if (cur) CS.curTarget = cur.midi;
      if (CS.graph) CS.graph.set({ frames: fr, playhead: isFinite(T0) ? now : null });
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    try {
      const out = await performPhrase({
        targets: tg, demoTargets: demoT, glide: cfg.glide, demo: true, call: cfg.mode === 'call', bpm: cfg.bpm, countIn: 2,
        guide: Store.data.profile.headphones, metronome: false, sig,
        status: (s, k) => { if (k === 'demo') { setState('demo'); } else if (k === 'count') setState('singing', s); else setState('singing'); },
        onDemo: (ds) => { if (!Store.data.profile.headphones) CS.seg.gate(ds + demoT[demoT.length - 1].start + demoT[demoT.length - 1].dur + 0.4); },
        onStart: (x) => { T0 = x; }, onFrame: (f) => fr.push(f),
      });
      cancelAnimationFrame(raf);
      let frames = out.frames;
      if (C_().accompany) frames = vcVoiceOnly(frames);
      const cls = vcClassify(frames.filter((f) => f.t > -0.2 && f.t < span + 0.3), Engine.ctx.sampleRate);
      const res = scorePhrase(frames, tg, { tol: cfg.tol, latency: cfg.mode === 'call' ? 0 : Engine.latency(), legato: cfg.legato, rec: out.rec });
      res.frames = frames; res.targets = tg; res.cls = cls.kind; res.rec = out.rec; res.total = span;
      res.gaps = cfg.breathPhrase ? breathGaps(frames, span) : 0;
      results.push(res);
      CS.graph.set({ frames, playhead: null });
    } catch (e) {
      cancelAnimationFrame(raf);
      if (e instanceof Aborted) return { interrupted: true };
      throw e;
    } finally { CS.attemptSig = null; }
  }
  const notes = results.flatMap((r) => r.notes), breaks = results.flatMap((r) => r.breaks), intervals = results.flatMap((r) => r.intervals);
  const res = { notes, breaks, intervals, summary: summarize(notes, breaks, cfg.tol), parts: results };
  res.kinds = results.map((r) => r.cls);
  res.gaps = results.reduce((a, r) => a + r.gaps, 0);
  return res;
}

// Spoken feedback built from the measurements (used directly, or as grounding for the AI).
function localFeedback(res, prev, ex, cfg, nAttempt, maxAttempts, bestEver) {
  const s = res.summary;
  const tips = coachTips(res, cfg, { vowelPhrase: cfg.vowelPhrase, breathGaps: res.gaps });
  const main = tips.find((t) => t.kind !== 'good');
  const firstSentences = (b, n) => (String(b).match(/[^.!?]+[.!?]+/g) || [b]).slice(0, n).join(' ').trim();
  let open = 'Okay, I heard that.';
  if (prev) {
    const d = s.score - prev.summary.score;
    if (d >= 8) open = 'That was better.' + (s.accuracy > prev.summary.accuracy + 5 ? ` You were in tune ${s.accuracy} percent of the time, up from ${prev.summary.accuracy}.` : '');
    else if (d <= -8) open = 'That one slipped a little.';
    else open = 'Okay.';
  }
  if (bestEver != null && s.score > bestEver && s.score >= 60) open += ' That’s your best on this exercise so far.';
  let body, done = false;
  if (!main || s.score >= 86) {
    const det = [];
    if (s.meanAbs != null) det.push(`your notes were within about ${Math.max(3, Math.round(s.meanAbs))} cents of the target`);
    if (s.stability != null && s.stability < 14) det.push('your held notes were steady');
    body = det.length ? `Good, ${det.join(' and ')}.` : 'Good.';
    done = s.score >= 86 || nAttempt >= maxAttempts;
  } else {
    body = speakableTip(main.h) + '. ' + firstSentences(main.b, 2);
  }
  const close = done || nAttempt >= maxAttempts ? (s.score >= 70 ? 'Let’s move on.' : 'We’ll come back to this one. Let’s move on for now.') : nAttempt === 1 ? 'Let’s try it again.' : 'One more time.';
  return { text: `${open} ${body} ${close}`.replace(/\s+/g, ' ').trim(), done: done || nAttempt >= maxAttempts, tips, main };
}
function speakableTip(h) { return String(h).replace(/\s*\(.*?\)/g, ''); }

async function aiFeedback(res, prev, ex, cfg, local, cls) {
  const ctx = {
    exercise: ex.title, whatItTrains: ex.what.split('. ')[0], target: res.notes.map((n) => nm(n.midi)).join(' '),
    measurements: compactResult(res), summary: res.summary, previousAttemptSummary: prev ? prev.summary : null,
    detectedProblemsByTheApp: local.tips.map((t) => t.h), resultType: cls ? cls.kind : null, plannedIntervention: cls ? Teach.intervention(cls).action : null, student: historyDigest(), goals: C_().goals,
  };
  const prompt = `${COACH_PERSONA}\n\nMeasurements from the attempt they just sang (cents: 100 = a semitone, negative = flat; 'withinTolPct' = share of the held part within ±${cfg.tol} cents; 'onsetCents' strongly negative = scooping; clarityDb under ~11 suggests breathiness or a noisy room; brightnessDb jump of 6+ on top notes can indicate pressing):\n${JSON.stringify(ctx)}\n\nRespond with JSON only: {"say": "<what you say out loud: react to this attempt in one short sentence, then give ONE specific correction tied to the numbers, then tell them what to do on the next try. Max 55 words.>", "next": "retry" | "move_on" | "lower_key" | "rest"}. The app has classified this attempt as resultType and will carry out plannedIntervention next (retry = try again, isolate = practise just the weak spot slowly, switch = a targeted exercise for a recurring habit, simplify = make it easier, redemo = show it a different way, verify = one more to confirm, progress = move on). Your words must match that: e.g. for isolate, say you'll work on just that spot; for verify, say once more to make sure it sticks. Never praise a failed attempt as good.`;
  const txt = await withTimeout(askAI(prompt), 12000);

// ---------- teaching loop for one exercise ----------
// Assess → Demonstrate → Attempt → Analyze → (classify) → Correct → Repeat → Verify → Progress
function attemptInfo(id, res, cfg, local) {
  const sung = res.notes.filter((n) => !n.missed);
  const issues = vocalIssues(res, cfg);
  return {
    issues, pass: vocalPass(id, res), score: res.summary.score,
    missedFrac: res.summary.total ? res.summary.missed / res.summary.total : 1,
    wrongFrac: sung.filter((n) => Math.abs(n.median) >= 100).length / Math.max(1, res.notes.length),
    shapeWrong: vocalShapeWrong(res), strain: local.tips.some((t) => /strain/i.test(t.h)),
  };
}
function issueWords(iss) {
  if (!iss) return 'that';
  const n = iss.note != null ? nm(iss.note) : '';
  switch (iss.type.replace('-high', '')) {
    case 'flat': return iss.key.startsWith('bias') ? `you were settling about ${Math.abs(Math.round(iss.cents))} cents flat` : `${n} came out about ${Math.abs(Math.round(iss.cents))} cents flat`;
    case 'sharp': return iss.key.startsWith('bias') ? `you were landing about ${Math.abs(Math.round(iss.cents))} cents sharp` : `${n} came out about ${Math.abs(Math.round(iss.cents))} cents sharp`;
    case 'scoop': return 'you slid up into the note instead of starting on it';
    case 'sag': return `${n} sagged flat toward the end`;
    case 'breath-short': return 'you ran short of breath before the end';
    case 'wobble': return `${n} wavered while you held it`;
    case 'break': return 'your voice flipped on the way up';
    case 'wrong-note': return `note ${(iss.i || 0) + 1} landed on a different note`;
    case 'missed': return `I didn’t hear note ${(iss.i || 0) + 1}`;
  }
  return 'that spot';
}
function celebrate(kind, name) {
  try { if (typeof uiCelebrate === 'function') uiCelebrate(kind, name); } catch (e) {}
}

// Practise one weak spot in isolation, slower, then report whether it got fixed.
async function isolateDrill(ex, cfg, phrase, iss) {
  let chunk, words, ccfg;
  const tempo = Math.max(48, Math.round(cfg.bpm * 0.7));
  if (iss.key.startsWith('bias') || cfg.mode === 'call') {
    const n0 = phrase[Math.min(phrase.length - 1, iss.i || 0)];
    chunk = [{ midi: n0.midi, beats: 2, lyric: 'ah' }];
    ccfg = { ...cfg, mode: 'call', bpm: 60, tol: 30, phrases: [chunk] };
    words = `Let’s take just one note, ${nm(n0.midi)}. Hear it in your head first, then start right on it.`;
  } else if (iss.type === 'sag' || iss.type === 'breath-short') {
    const n0 = phrase[0];
    chunk = [{ midi: n0.midi, beats: Math.max(2, Math.round(n0.beats * 0.6)), lyric: n0.lyric || 'ah' }];
    ccfg = { ...cfg, mode: 'call', bpm: 60, tol: 30, phrases: [chunk] };
    words = 'Let’s make it shorter first, and keep the energy right to the end. Then we’ll build the length back up.';
  } else {
    const i = Math.max(0, Math.min(phrase.length - 1, iss.i != null ? iss.i : phrase.findIndex((p) => p.midi === iss.note)));
    const a = Math.max(0, i - 1), b = Math.min(phrase.length, a + 3);
    chunk = phrase.slice(a, b);
    ccfg = { ...cfg, bpm: tempo, phrases: [chunk] };
    words = `Let’s isolate those ${chunk.length} notes and go slower.`;
  }
  await say(words);
  let fixed = false;
  for (let k = 0; k < 3 && !fixed; k++) {
    const c = await checkpoint(); if (c === 'end') return 'end'; if (c === 'next') return 'next';
    const r = await attempt(ex, ccfg, [chunk]);
    if (r.interrupted) { const c2 = await checkpoint(); if (c2 === 'end' || c2 === 'next') return c2; k--; continue; }
    const still = vocalIssues(r, ccfg).find((x) => x.type === iss.type || x.key === iss.key);
    fixed = !still && r.summary.missed === 0;
    if (fixed) await say(k === 0 ? 'Yes, that’s it.' : 'There it is. That’s the one.');
    else if (k < 2) await say(`Closer. ${still ? issueWords(still) + '.' : ''} Again.`.replace(/\s+/g, ' '));
  }
  if (!fixed) await say('We’ll keep working on that spot another day. Now let’s put it back in the full pattern.');
  else await say('Now let’s put it back in the full pattern.');
  return fixed ? 'fixed' : 'not-fixed';
}

// Show the exercise a different way: note by note, with the direction spoken.
async function redemo(ex, cfg, phrase) {
  await say('Let me show you that a different way. Watch the notes on the screen while I go one at a time.');
  const notes = timePhrase(phrase.slice(0, 6), 50);
  CS.graph.fitTo(notes.map((n) => n.midi)); CS.graph.set({ targets: notes, frames: [], t0: -0.3, t1: notes[notes.length - 1].start + notes[notes.length - 1].dur + 0.4 });
  const dirs = notes.map((n, i) => (i === 0 ? 'start here' : n.midi > notes[i - 1].midi ? 'up' : n.midi < notes[i - 1].midi ? 'down' : 'same'));
  for (let i = 0; i < notes.length; i++) {
    if (!CS || !CS.active) return;
    setState('demo', dirs[i]);
    const t0 = Engine.ctx.currentTime + 0.05;
    Engine.playSeq([{ ...notes[i], start: 0, dur: 0.7 }], t0);
    CS.graph.set({ playhead: notes[i].start + 0.2 });
    await sleep(900);
  }
  CS.graph.set({ playhead: null });
  await say(`So it goes ${dirs.slice(1).join(', ')}. Your turn, slowly.`);
}

async function coachExercise(id, opts) {
  opts = opts || {};
  const ex = EX[id];
  CS.exId = id;
  const skillId = EX_TO_VSKILL[id];
  const maxAttempts = opts.max || 4;
  let level = Store.level(id), shift = CS.shift[id] || 0, cfg = ex.build(level, shift);
  setActivity(ex.group + ' · ' + ex.title);
  const prevSessions = Store.data.sessions.filter((s) => s.exId === id && s.summary);
  const bestEver = prevSessions.length ? Math.max(...prevSessions.map((s) => s.summary.score)) : null;
  if (opts.intro) await say(opts.intro);
  else await say(`${ex.title}. ${ex.what.split('. ')[0]}. ${ex.how.split('. ')[0]}.`);
  let prev = null, n = 0, demoAgain = false, verifying = false, switched = false;
  const hist = [];
  const apply = async (c) => {
    if (c === 'end') return 'end';
    if (c === 'next') { await say('Sure, let’s move on.'); return 'next'; }
    if (c === 'demo') demoAgain = true;
    if (c === 'lower' || c === 'higher') { shift += c === 'lower' ? -2 : 2; CS.shift[id] = shift; cfg = ex.build(level, shift); await say(c === 'lower' ? 'Okay, I’ve brought it down two semitones.' : 'Okay, up two semitones. Stay light.'); }
    if (c === 'slower') { level = Math.max(1, level - 1); cfg = ex.build(level, shift); await say('Okay, a little slower.'); }
    if (c === 'confused') { await say(`No problem, let me put it another way. ${ex.how.split('. ').slice(1, 3).join('. ') || ex.how}`); await redemo(ex, cfg, cfg.phrases[0]); }
    if (c === 'frustrated') { level = Math.max(1, level - 1); cfg = ex.build(level, shift); await say('That’s normal at this stage. I’ve made it a bit easier. One small thing at a time.'); }
    return null;
  };
  let c = await apply(await checkpoint()); if (c) return c;
  while (n < maxAttempts) {
    const phrases = cfg.mode === 'call' ? cfg.phrases.slice(0, opts.phrases || 3) : cfg.phrases.slice(0, opts.phrases || 1);
    if (verifying) await say('Once more, to make sure it sticks.');
    else if (n === 0 || demoAgain) await say(n === 0 ? (cfg.mode === 'call' ? 'Listen to each note, then sing it straight back.' : 'Listen first. After two clicks, sing it back.') : 'Here it is again.');
    else await say(cfg.mode === 'call' ? 'Again. Listen, then sing.' : 'Listen, then after the clicks, your turn.');
    demoAgain = false;
    c = await apply(await checkpoint()); if (c) return c;
    if (demoAgain) continue;
    const res = await attempt(ex, cfg, phrases);
    if (res.interrupted) { c = await apply(await checkpoint()); if (c) return c; continue; }
    setState('thinking');
    const voicedNotes = res.notes.filter((x) => !x.missed).length;
    if (CS.speechDuringAttempt && voicedNotes === 0) { await say('It sounded like you were talking rather than singing. If you have a question, ask it now, or I’ll play it again.'); const r = await waitReply(6, ['Play it again', 'Skip']); if (r && r.intent === 'next') return 'next'; continue; }
    if (res.kinds.includes('guitar') && voicedNotes <= res.notes.length / 3) {
      await say(C_().accompany ? 'I mostly heard the guitar, not your voice. Hold the phone closer to your mouth, or strum more softly so your voice is louder than the strings.' : 'I hear a guitar. If you’re accompanying yourself, say “I’m playing guitar” and I’ll filter it out.');
      continue;
    }
    if (voicedNotes === 0) { await say('I didn’t catch any singing that time. Sing right after the demo, a little louder, with the phone about an arm’s length away.'); n++; continue; }
    n++;
    Store.addSession({ type: 'exercise', exId: id, title: ex.title + ' (coach)', level, summary: res.summary, notes: res.notes.map(slimNote), seconds: Math.round((res.parts || []).reduce((a, r) => a + r.total, 0) * 2) });
    CS.results.push({ id, res, attempt: n });
    const local = localFeedback(res, prev, ex, cfg, n, maxAttempts, bestEver);
    const cur = attemptInfo(id, res, cfg, local);
    const cls = Teach.classify(cur, hist, { ex: id, log: Teach.d().log });
    const iv = Teach.intervention(cls);
    Teach.logAttempt({ ex: id, skill: skillId || 'v-' + id, types: cur.issues.map((x) => x.type).slice(0, 3), keys: cur.issues.map((x) => x.key).slice(0, 3), pass: cur.pass, score: cur.score, kind: cls.kind });
    if (skillId) {
      const rec = Teach.record(skillId, cur.pass, { score: cur.score });
      if (rec.event === 'secure') { celebrate('secure', VSKILL[skillId].name); CS.milestones.push(`${VSKILL[skillId].name} is now secure`); }
      if (rec.event === 'mastered') { celebrate('mastered', VSKILL[skillId].name); CS.milestones.push(`${VSKILL[skillId].name} mastered`); }
    }
    hist.push(cur);
    CS.lastClass = cls;
    // what to say: grounded in the measurement, framed by the kind of result
    const main = cur.issues[0];
    let text;
    switch (cls.kind) {
      case 'progress': text = `${local.text.split('. ')[0]}. That’s two clean in a row, so that one is solid.`; break;
      case 'improved': text = cls.reason === 'partial' ? `That was better: ${issueWordsByKey(cls.fixed, hist)} is fixed. Now ${issueWords(main)}. ${firstSentence(local.main ? local.main.b : '')} Again.` : `${hist.length > 1 ? 'That was better. ' : ''}${local.text.replace(/ (Let’s try it again|One more time|Let’s move on)\.?$/, '')} Let’s do it once more to make sure it sticks.`; break;
      case 'repeated': text = `That’s the same spot again: ${issueWords(main)}. Rather than repeating the whole thing, let’s fix just that part.`; break;
      case 'technique': text = `You’ve been ${ISSUE_LABEL[main.type]} in a few exercises now, so it’s a technique habit rather than this exercise. Let’s work on it directly.`; break;
      case 'toohard': text = cur.strain ? 'That sounded effortful at the top. Let’s not push. I’m bringing it down.' : 'That one is a bit out of reach right now, which is completely fine. Let me make it easier.'; break;
      case 'misread': text = 'Each note was steady, but the shape of the pattern was different from mine.'; break;
      default: text = local.text;
    }
    if (await aiAvailable()) {
      try { const a = await aiFeedback(res, prev, ex, cfg, { ...local, tips: local.tips }, cls); text = a.text; } catch (e) { /* measurement-based wording above is used */ }
    }
    await say(text);
    // act on the intervention
    if (iv.action === 'progress') break;

// ---------- conversational first assessment ----------
async function assessment() {
  const P = Teach.d().profile;
  setActivity('Getting to know your voice');
  await say('Before we start, I’d like to get to know your voice. A few quick questions, then a few short things to sing. Nothing will be high or hard.');
  let r = await waitReply(12, ['New to singing', 'Some lessons or choir', 'I sing regularly']);
  P.experience = r ? r.text : 'not given';
  await say('Nice. What kind of music do you most want to sing?');
  r = await waitReply(12, ['Pop', 'Rock', 'Country', 'R&B', 'Musical theatre', 'Folk / acoustic']);
  P.styles = r ? r.text : '';
  await say('And what would you most like to get better at?');
  r = await waitReply(14, ['Singing in tune', 'High notes', 'Breath and long notes', 'Singing with my guitar', 'Confidence overall']);
  P.goal = r ? r.text : '';
  P.focus = focusFromText(P.goal) || (/guitar/i.test(P.goal) ? 'song' : null);
  if (r) C_().goals = r.text;
  if (CS.cmd === 'end' || CS.healthStop) return;
  const res = {};
  // 1 pitch matching (3 notes)
  await coachAssessStep('match', 'First, pitch matching. I’ll sing a note, you sing it straight back on “ah”.', (x) => { res.match = x.notes.filter((n) => !n.missed && Math.abs(n.median) <= 25).length; res.matchN = x.notes.length; });
  if (!CS || !CS.active || CS.healthStop) return;
  // 2 a held note
  await coachAssessStep('sustain', 'Now a held note. Take a comfortable breath and hold it steady until I stop.', (x) => { const n = x.notes.find((q) => q.sustain); res.sustainOk = vocalPass('sustain', x); res.sustain = n ? n.sustain : null; }, 1);
  if (!CS || !CS.active || CS.healthStop) return;
  // 3 melody echo
  await coachAssessStep('echo', 'Now a short melody. Listen to the whole thing, then sing it back.', (x) => { res.echo = x.notes.filter((n) => !n.missed && Math.abs(n.median) < 50).length; res.echoN = x.notes.length; }, 1);
  if (!CS || !CS.active || CS.healthStop) return;
  // 4 comfortable range glide (free)
  await say('Last one. Gently slide from a comfortable low note up to a comfortable high note and back down, like a slow siren. Don’t push. Go whenever you’re ready.');
  const fr = await freeListen(7);
  const v = fr.filter((f) => f.voiced).map((f) => f.midi).sort((a, b) => a - b);
  if (v.length > 40) {
    res.lo = Math.round(v[Math.floor(v.length * 0.05)]); res.hi = Math.round(v[Math.floor(v.length * 0.95)]);
    const p = Store.data.profile;
    if (!p.rangeTested && res.hi - res.lo >= 7) { p.rangeLow = res.lo; p.rangeHigh = res.hi; }
  }
  await say('One more question: do you know the difference between your chest voice and your head voice?');
  r = await waitReply(10, ['Yes', 'Not really', 'Not sure']);
  P.registers = r ? r.text : 'not sure';
  // placement
  const stage = res.match >= 2 && res.sustainOk && res.echo >= res.echoN - 1 ? 2 : 1;
  P.assessed = Date.now(); P.startStage = stage; P.assessment = res;
  if (stage === 2) ['v-hum', 'v-match'].forEach((id) => { const s = Teach.skill(id); if (s.state === 'new') { Teach.d().skills[id] = { ...s, state: 'learning' }; } });
  Store.save();
  const parts = [];
  parts.push(`You matched ${res.match || 0} of ${res.matchN || 3} notes within 25 cents`);
  if (res.sustain) parts.push(res.sustainOk ? 'your held note was steady' : res.sustain.endDelta <= -25 ? 'your held note drifted flat at the end' : res.sustain.shortBy > 0.4 ? 'you ran out of air before the end of the held note' : 'your held note wavered a little');
  if (res.echoN) parts.push(`and you sang back ${res.echo} of ${res.echoN} melody notes`);
  let rangeTxt = res.lo != null ? ` Your comfortable slide went from about ${nm(res.lo)} to ${nm(res.hi)}. That’s a starting point, not a voice type; range changes with training.` : '';
  await say(`Here’s what I heard. ${parts.join(', ')}.${rangeTxt} I’ll start you in stage ${stage}, ${VOCAL_STAGES[stage - 1].name.toLowerCase()}, and we’ll move on as each skill becomes solid.`);
}
async function coachAssessStep(id, intro, take, phrases) {
  const ex = EX[id], cfg = ex.build(Store.level(id), 0);
  await say(intro);
  for (let k = 0; k < 2; k++) {
    const c = await checkpoint(); if (c === 'end' || c === 'next') return;
    const r = await attempt(ex, cfg, cfg.phrases.slice(0, phrases || 3));
    if (r.interrupted) continue;
    CS.results.push({ id, res: r, attempt: 1 });
    Store.addSession({ type: 'exercise', exId: id, title: ex.title + ' (assessment)', level: 1, summary: r.summary, notes: r.notes.map(slimNote), seconds: 15 });
    take(r);
    await say(['Thank you.', 'Got it.', 'Great, thanks.'][CS.results.length % 3]);

  }
}
// Listen freely for a few seconds (no target), returning frames.
async function freeListen(secs) {
  const fr = [];
  setState('singing', 'Your turn');
  const un = Engine.onFrame((f) => { fr.push(f); });
  const t0 = performance.now();
  while (performance.now() - t0 < secs * 1000) { if (!CS || !CS.active || CS.cmd === 'end') break; await sleep(100); }
  un();
  return Store.data.coach && C_().accompany ? vcVoiceOnly(fr) : fr;
}

// ---------- a full lesson ----------
async function lesson() {
  const c = C_(), p = Store.data.profile, last = c.lessons[c.lessons.length - 1], T = Teach.d();
  CS.milestones = [];
  setActivity('Check-in');
  let hello = `Hi${p.name ? ' ' + p.name : ''}, good to see you.`;
  const issue = Teach.topIssue('v-');
  if (last && issue) hello += ` Last time I noticed ${ISSUE_LABEL[issue]}, so we’ll keep an eye on that.`;
  else if (last && last.focus) hello += ` Last time we worked on ${last.focus.toLowerCase()}.`;
  await say(hello);
  if (!T.profile.assessed) {
    await assessment();
    if (!CS || !CS.active || CS.healthStop || CS.cmd === 'end') return wrapUp();
    await say('That’s the assessment done. Let’s use the rest of the time to practise.');
  }
  await say('How is your voice feeling today? And is there anything you want to work on?');
  const r = await waitReply(12, ['Feeling good', 'A bit tired', 'Work on high notes', 'Work on pitch', 'Breath control', 'Sore or hoarse']);
  if (CS && CS.healthStop) return wrapUp();
  let cmd = await checkpoint(); if (cmd === 'end') return wrapUp();
  if (r && r.intent === 'pain') { await healthStop(); return wrapUp(); }
  const gentle = r && (r.intent === 'feel-tired' || /tired/i.test(r.text));
  CS.feeling = r ? r.text : null;
  let focus = r ? focusFromText(r.text) : null;
  if (!focus && T.profile.focus && Math.random() < 0.5) focus = T.profile.focus;
  CS.focus = focus;
  let minutes = c.length;
  if (gentle) { minutes = Math.min(minutes, 8); await say('Thanks for telling me. We’ll keep it short, light and quiet today.'); }
  const plan = Teach.planVocal(minutes, focus);
  if (focus) {
    const mem = focusMemory(focus);
    await say(`Absolutely. ${mem} We’ll start with a gentle warm-up, then work on ${FOCUS_LABEL[focus]}.`);
  } else {
    const names = plan.filter((x) => x.slot !== 'warmup').map((x) => EX[x.ex] ? EX[x.ex].title.toLowerCase() : x.ex);
    await say(`Here’s the plan: ${plan.some((x) => x.slot === 'warmup') ? 'a quick warm-up, then ' : ''}${names.join(', then ')}.`);
  }
  if (C_().accompany) await say('I know you’re playing guitar, so I’ll listen for your voice and ignore the strings. Keep the guitar a little quieter than your singing.');
  const queue = plan.slice();
  while (queue.length) {
    const item = queue.shift();
    if (CS && CS.pendingFocus) { const f = CS.pendingFocus; CS.pendingFocus = null; CS.focus = f; queue.unshift(...FOCUS[f].map((ex) => ({ slot: 'focus', ex }))); continue; }
    if (!CS || !CS.active || CS.healthStop) break;
    if (minutesIn() > minutes + 3 && item.slot !== 'music') continue;
    const intro = item.slot === 'warmup' ? `Let’s warm up. ${EX[item.ex].title}. ${EX[item.ex].how.split('. ')[0]}.`
      : item.slot === 'review' ? `A quick review of ${EX[item.ex].title.toLowerCase()}, to make sure it’s still solid.`
      : item.slot === 'fix' ? `Now let’s work on ${ISSUE_LABEL[Teach.topIssue('v-')] || 'your most common slip'}. ${EX[item.ex].title}. ${EX[item.ex].how.split('. ')[0]}.`
      : item.slot === 'music' ? 'Let’s finish with some music. I’ll sing a short melody; you sing it back.'
      : null;
    cmd = await coachExercise(item.ex, { max: item.slot === 'warmup' ? 2 : item.slot === 'review' ? 2 : gentle ? 2 : 4, intro: intro || undefined, phrases: item.ex === 'echo' ? 1 : undefined });
    if (cmd === 'end') break;
    if (CS && CS.pendingFocus) { const f = CS.pendingFocus; CS.pendingFocus = null; CS.focus = f; queue.unshift(...FOCUS[f].map((ex) => ({ slot: 'focus', ex }))); }
  }
  return wrapUp();
}
function focusMemory(focus) {
  const T = Teach.d(), r = rangeOf();

    const hi = Object.entries(Store.data.noteStats).filter(([k, v]) => +k >= r.low + (r.high - r.low) * 0.66 && v.n >= 2).map(([, v]) => v.err / v.n);

  const iss = Teach.topIssue('v-');

  return '';
}

async function wrapUp() {

  setActivity('Summary');
  const R = CS.results;
  const byEx = {};
  R.forEach((r) => { (byEx[r.id] = byEx[r.id] || []).push(r.res.summary); });
  let text = CS.healthStop ? 'Rest up, and we’ll pick it up when your voice feels good.' : 'That’s a good place to stop.';
  const improved = Object.entries(byEx).map(([id, a]) => ({ id, from: a[0].accuracy, to: a[a.length - 1].accuracy })).filter((x) => x.to - x.from >= 8 && EX[x.id]);
  if (!CS.healthStop && R.length) {
    if (improved.length) text += ` On ${EX[improved[0].id].title.toLowerCase()}, you went from ${improved[0].from} to ${improved[0].to} percent in tune.`;
    if (CS.milestones && CS.milestones.length) text += ` ${CS.milestones[0]}.`;

  const iss = Teach.topIssue('v-');

  const next = nextEx && EX[nextEx] ? `Between lessons, five minutes a day: one minute of humming, two of pitch matching, then two of ${EX[nextEx].title.toLowerCase()}${iss ? ', for ' + ISSUE_LABEL[iss] : ''}.` : 'Between lessons, five minutes a day of humming and pitch matching keeps it going.';

  await say(text);

}

// ---------- song coaching ----------
async function songLesson(songId) {
  const song = allSongs().find((s) => s.id === songId);
  const tr = autoTranspose(song.sections.flatMap((s) => s.notes.map((n) => n.m)));
  setActivity('Song · ' + song.title);
  await say(`Let’s work on ${song.title}.${tr ? ` I’ve moved it ${Math.abs(tr)} semitone${Math.abs(tr) > 1 ? 's' : ''} ${tr > 0 ? 'up' : 'down'} so it sits in your comfortable range.` : ''} We’ll go line by line.`);
  for (const sec of song.sections) {
    if (!CS || !CS.active) return;
    const line = sec.notes.filter((n) => n.m != null).map((n) => ({ midi: n.m + tr, beats: n.b, lyric: n.l }));
    const cfg = { mode: 'seq', legato: true, bpm: song.bpm * 0.9, tol: 35, phrases: [line] };
    const ex = { title: song.title + ' · ' + sec.name, what: 'Singing a line of the melody.', how: 'Sing it on the words, or on “la”.', group: 'Song' };
    EX['song-line'] = ex;
    let prevFull = null;
    for (let pass = 0; pass < 3; pass++) {
      await say(pass === 0 ? `${sec.name}. Listen to the melody, then sing it after the clicks.` : 'Now the whole line again.');
      let c = await checkpoint(); if (c === 'end') return wrapUp(); if (c === 'next') break;
      CS.exId = 'song-line';
      const res = await attempt(ex, cfg, [line]);
      if (res.interrupted) { c = await checkpoint(); if (c === 'end') return wrapUp(); if (c === 'next') break; pass--; continue; }
      CS.results.push({ id: 'song-line', res, attempt: pass + 1 });
      Store.addSession({ type: 'song', title: `${song.title} · ${sec.name} (coach)`, songId: song.id, summary: res.summary, notes: res.notes.map(slimNote), seconds: 20 });
      const notes = res.notes;
      const bad = notes.map((n, i) => ({ n, i })).filter(({ n }) => n.missed || Math.abs(n.median) > 30);
      const delta = prevFull ? res.summary.accuracy - prevFull.summary.accuracy : 0;
      if (!bad.length) { await say(`${prevFull && delta > 5 ? 'Much better. ' : ''}That line was accurate: you were within about ${Math.round(res.summary.meanAbs || 0)} cents on average. Nice phrasing.`); break; }
      // isolate the worst spot: up to three notes around it, slower
      const worst = bad.sort((a, b) => (b.n.missed ? 999 : Math.abs(b.n.median)) - (a.n.missed ? 999 : Math.abs(a.n.median)))[0];
      const goodBefore = notes.slice(0, worst.i).every((n) => !n.missed && Math.abs(n.median) <= 30);
      const w = worst.n, word = w.lyric ? ` on “${w.lyric}”` : '';
      let desc = w.missed ? `I didn’t hear note ${worst.i + 1}${word}` : `note ${worst.i + 1}${word}, the ${nm(w.midi)}, was about ${Math.abs(Math.round(w.median))} cents ${w.median < 0 ? 'flat' : 'sharp'}`;
      if (goodBefore && worst.i >= 1) desc = `Your first ${worst.i === 1 ? 'note was' : worst.i + ' notes were'} accurate, but ${desc}`;
      else desc = desc.charAt(0).toUpperCase() + desc.slice(1);
      const a = Math.max(0, worst.i - 1), b = Math.min(line.length, a + 3);
      const chunk = line.slice(a, b);
      await say(`${desc}. Let’s isolate those ${chunk.length} notes and practise them slowly.`);
      const ccfg = { mode: 'seq', legato: true, bpm: song.bpm * 0.6, tol: 35, phrases: [chunk] };
      for (let k = 0; k < 3; k++) {
        c = await checkpoint(); if (c === 'end') return wrapUp(); if (c === 'next') break;
        const r2 = await attempt(ex, ccfg, [chunk]);
        if (r2.interrupted) { const c3 = await checkpoint(); if (c3 === 'end') return wrapUp(); if (c3 === 'next') break; k--; continue; }
        CS.results.push({ id: 'song-line', res: r2, attempt: k + 1 });
        const local = localFeedback(r2, null, ex, ccfg, k + 1, 3, null);
        let text = local.text;
        if (await aiAvailable()) { try { text = (await aiFeedback(r2, null, ex, ccfg, local)).text; } catch (e) {} }
        await say(text);
        if (r2.summary.score >= 80) break;
      }
      prevFull = res;
    }
    const long = line.reduce((t, n) => t + (n.beats * 60) / cfg.bpm, 0);
    if (long > 6) await say('That’s a long line. A good place to breathe is right after the longest note in the middle, so you don’t run out at the end.');
  }
  await wrapUp();
}

  const targets = () => timePhrase(secs[si].notes.map((n) => ({ midi: n.m == null ? null : n.m + tr, beats: n.b, lyric: n.l })), (song.bpm * tempo) / 100);
  const draw = () => {
    const t = targets(); const last = t[t.length - 1];
    g.fitTo(t.map((x) => x.midi)); g.set({ targets: t, frames: [], t0: -0.3, t1: last.start + last.dur + 0.4, tol, playhead: null });
    $('#trv', el).textContent = (tr > 0 ? '+' : '') + tr + ' st';
  };
  draw();
  $('[data-back]', el).addEventListener('click', () => go('songs'));
  $('#secs', el).addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; si = +b.dataset.i; $$('#secs button', el).forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#res', el).innerHTML = ''; draw(); });
  $('#tempo', el).addEventListener('input', (e) => { tempo = +e.target.value; $('#tv', el).textContent = tempo + '%'; draw(); });
  el.querySelectorAll('[data-tr]').forEach((b) => b.addEventListener('click', () => { tr += +b.dataset.tr; draw(); }));
  $('#guide', el).addEventListener('change', (e) => { guide = e.target.checked; });
  $('[data-act="listen"]', el).addEventListener('click', async () => {
    await Engine.ensure(); Engine.stopAll();
    const t = targets(), start = Engine.ctx.currentTime + 0.1, end = Engine.playSeq(t, start);
    const tick = () => { const now = Engine.ctx.currentTime; if (now < end && App.view === 'song') { g.set({ playhead: now - start }); requestAnimationFrame(tick); } else g.set({ playhead: null }); };
    requestAnimationFrame(tick);
  });
  $('[data-act="sing"]', el).addEventListener('click', async () => {
    await Engine.ensure();
    if (!(await micOrNotice($('#msg', el)))) return;
    const sig = { aborted: false }; App.abort = sig;
    const t = targets(), last = t[t.length - 1], total = last.start + last.dur, bpm = (song.bpm * tempo) / 100;
    const fr = [];
    let T0 = Infinity, raf;
    const loop = () => { g.set({ frames: fr, playhead: Engine.ctx.currentTime - T0 }); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    $('#res', el).innerHTML = `<div class="status-line" id="st">Get ready</div>`;
    try {
      const out = await performPhrase({ targets: t, bpm, countIn: song.bar || 4, guide: guide && p.headphones, metronome: false, sig, status: (x, k) => { const s = $('#st', el); if (s) s.innerHTML = k === 'count' ? `<span class="countdown">${esc(x)}</span>` : esc(x); }, onStart: (x) => { T0 = x; }, onFrame: (f) => fr.push(f) });
      cancelAnimationFrame(raf);
      Engine.stopMic();
      const res = scorePhrase(out.frames, t, { tol, latency: Engine.latency(), legato: true, rec: out.rec });
      showResult(res, out, t, total);
    } catch (e) { cancelAnimationFrame(raf); if (!(e instanceof Aborted)) toast(e.message); }
  });

  function showResult(res, out, t, total) {
    const s = res.summary, sec = secs[si];
    const pr = (Store.data.songProgress[song.id] = Store.data.songProgress[song.id] || {});
    const prev = pr[sec.id];
    pr[sec.id] = { best: Math.max(prev ? prev.best : 0, s.score), last: s.score, n: (prev ? prev.n : 0) + 1, ts: Date.now() };
    Store.addSession({ type: 'song', title: `${song.title} · ${sec.name}`, songId: song.id, summary: s, notes: res.notes.map(slimNote), seconds: Math.round(total * 2) });
    const trouble = res.notes.filter((n) => n.missed || n.score < 60).slice(0, 6);
    const tips = coachTips(res, { mode: 'seq' });
    g.set({ targets: t.map((x) => ({ ...x, res: (res.notes.find((n) => n.start === x.start) || {}).score })), frames: out.frames, playhead: null, shift: Engine.latency() });
    $('#res', el).innerHTML = `<section class="panel stack">
      <div class="row" style="gap:16px">${scoreRing(s.score)}<div class="stack" style="gap:4px"><span class="eyebrow">${esc(sec.name)}${prev ? ` · previous best ${prev.best}` : ''}</span>
        <h3>${s.accuracy}% in tune${s.timing != null && s.timing > 0.2 ? ` · entering ~${Math.round(s.timing * 1000)} ms late` : ''}</h3>
        <div class="row" style="gap:8px"><button class="btn small" id="rp">${icon('play')}Replay</button><button class="btn small" id="again">${icon('redo')}Repeat section</button>${tempo > 60 && s.score < 70 ? '<button class="btn small" id="slow">Slow to ' + (tempo - 20) + '%</button>' : ''}</div></div></div>
      ${trouble.length ? `<span class="eyebrow">Trouble spots</span><div class="trouble">${trouble.map((n) => `<div><span class="chip ${n.missed ? '' : devClass(n.median, tol)}">${n.missed ? 'missed' : Math.abs(n.median) >= 100 ? 'sang ' + nm(n.midi + Math.round(n.median / 100)) : (n.median > 0 ? '+' : '−') + Math.abs(Math.round(n.median)) + '¢'}</span><b>${esc(n.lyric || '–')}</b><span class="mono muted">${nm(n.midi)}</span><span class="muted" style="font-size:13px">${n.missed ? 'not heard — come in on time and hold it' : Math.abs(n.median) >= 100 ? 'wrong note' : n.onset != null && n.onset - n.median < -35 ? 'slid up into it' : Math.abs(n.median) > tol ? (n.median < 0 ? 'flat' : 'sharp') : 'unsteady'}</span></div>`).join('')}</div>` : '<p class="muted">No trouble spots in this section.</p>'}
      <div class="tips">${tips.map(tipHtml).join('')}</div><div id="ai"></div></section>`;
    $('#rp', el).addEventListener('click', (e) => toggleReplay(out.rec, g, -0.3, total + 0.4, e.currentTarget));
    $('#again', el).addEventListener('click', () => $('[data-act="sing"]', el).click());
    const sl = $('#slow', el); if (sl) sl.addEventListener('click', () => { tempo -= 20; $('#tempo', el).value = tempo; $('#tv', el).textContent = tempo + '%'; draw(); $('[data-act="sing"]', el).click(); });
    aiPanel($('#ai', el), () => ({ title: `Song practice: ${song.title}, ${sec.name} at ${tempo}% tempo`, description: 'The student sang the melody section with a count-in. Lyrics per note are given.', notes: compactResult(res), summary: s, tol }));
  }
};

// ===================== Analyse / create from a recording =====================
VIEWS.analyze = (el, params) => {
  const create = params.mode === 'create';
  el.innerHTML = `
    <button class="btn ghost small" data-back style="align-self:flex-start;padding-left:4px">${icon('back')}Songs</button>
    <div class="stack" style="gap:2px"><span class="eyebrow">${create ? 'Create a practice song' : 'Analyse a recording'}</span><h2>${create ? 'Turn a recording into a melody' : 'Feedback on a recording'}</h2></div>
    <section class="panel stack"><p class="muted">${create ? 'Use a clean recording of a single voice or melody line (no backing track). Only use recordings you have the rights to use.' : 'Works best with a single voice and little background music. Voice memos from your phone are fine.'}</p>
      <label class="btn primary" style="align-self:flex-start">${icon('upload')}Choose audio file<input type="file" id="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm" hidden></label>
      <span class="muted" id="fs" style="font-size:13px"></span></section>
    <div id="out"></div>`;
  $('[data-back]', el).addEventListener('click', () => go('songs'));
  $('#file', el).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('#fs', el).textContent = `Analysing ${f.name}…`;
    let a;
    try { a = await analyzeFile(f); } catch (err) { $('#fs', el).textContent = 'I couldn’t decode that file. Try an .m4a, .mp3 or .wav recording.'; return; }
    $('#fs', el).textContent = `${f.name} · ${a.duration.toFixed(1)} s`;
    const fsum = freeSummary(a.frames, null, 25);
    if (!fsum.segs.length) { $('#out', el).innerHTML = `<div class="notice">I didn’t find any held, sung notes in this recording.</div>`; return; }
    if (create) showCreate(a, fsum); else showAnalysis(a, fsum, f.name);
  });

  function showAnalysis(a, fsum, name) {
    const TOL = 25;
    const notes = fsum.segs.map((g) => {
      const es = g.pts.map((p) => (p.midi - g.nearest) * 100), dur = g.end - g.start;
      const n = { midi: g.nearest, start: g.start, dur, median: median(es), inTol: es.filter((e) => Math.abs(e) <= TOL).length / es.length, std: std(es), meanAbs: mean(es.map(Math.abs)), hnr: mean(g.pts.map((p) => hnrOf(p.c))), missed: false, octave: 0, lyric: '', voicedRatio: 1 };
      if (dur >= 1.1) n.sustain = sustainFeatures(g.pts.map((p, i) => ({ t: p.t, e: es[i], rms: p.rms, c: p.c })), null);
      const mid = g.pts[g.pts.length >> 1];
      n.tone = pcToneFeatures(a.rec.samples, Math.floor(mid.t * a.rec.sr) - 2048, a.rec.sr, pcMidiToFreq(mid.midi, Store.a4()));
      n.score = Math.round(100 * (0.6 * n.inTol + 0.4 * clamp(1 - n.meanAbs / 75, 0, 1)));
      return n;
    });
    const res = { notes, intervals: [], breaks: [], summary: summarize(notes, [], TOL) };
    res.summary.scoop = null;
    const tips = coachTips(res, null);
    Store.addSession({ type: 'upload', title: 'Recording: ' + name.slice(0, 40), summary: res.summary, notes: notes.map(slimNote), seconds: Math.round(a.duration) });
    const win = Math.min(a.duration, 15);
    $('#out', el).innerHTML = `<section class="panel stack">
      <div class="row" style="gap:16px">${scoreRing(res.summary.score)}<div class="stack" style="gap:4px"><span class="eyebrow">Recording summary</span><h3>${notes.length} held notes · ${fsum.accuracy}% within ±${TOL}¢</h3>
      <p class="muted" style="font-size:13.5px">Notes are compared with the nearest equal-tempered pitch (A4 = ${Store.a4()} Hz). Slides and speech are ignored.</p></div></div>
      <div class="tips">${tips.map(tipHtml).join('')}</div></section>
    <div class="row between"><button class="btn small" id="rp">${icon('play')}Replay</button>${a.duration > win ? `<input type="range" id="pan" min="0" max="${(a.duration - win).toFixed(1)}" step="0.1" value="0" style="flex:1;max-width:60%" aria-label="Scroll through the recording">` : ''}</div>
    <div class="graph-wrap tall"><canvas id="g"></canvas></div>
    <div class="table-wrap"><table class="notes-table"><tr><th>Time</th><th>Note</th><th>Tuning</th><th>Steadiness</th></tr>${notes.map((n) => `<tr><td class="mono">${n.start.toFixed(1)}s</td><td class="mono">${nm(n.midi)}</td><td><span class="chip ${devClass(n.median, TOL)}">${n.median > 0 ? '+' : n.median < 0 ? '−' : ''}${Math.abs(Math.round(n.median))}¢</span></td><td class="mono">±${Math.round(n.std)}¢</td></tr>`).join('')}</table></div>
    <div id="ai"></div>`;
    const g = new PitchGraph($('#g', el));
    g.fitTo(notes.map((n) => n.midi));
    let w0 = 0;
    g.set({ frames: a.frames, t0: w0, t1: w0 + win, tol: TOL, targets: [] });
    const pan = $('#pan', el); if (pan) pan.addEventListener('input', () => { w0 = +pan.value; g.set({ t0: w0, t1: w0 + win }); });
    $('#rp', el).addEventListener('click', (e) => toggleReplay(a.rec, g, w0, Math.min(a.duration, w0 + win), e.currentTarget));
    aiPanel($('#ai', el), () => ({ title: 'Uploaded recording of the student singing', description: 'Held notes were detected automatically and compared with the nearest semitone (no target melody known).', notes: compactResult(res).slice(0, 60), summary: res.summary, tol: TOL }));
  }

  function showCreate(a, fsum) {
    // merge repeated notes, quantise durations to quarter beats at 60 bpm (1 beat = 1 s)
    const q = (x) => Math.max(0.25, Math.round(x * 4) / 4);
    const notes = [];
    let lastEnd = fsum.segs[0].start;
    for (const sgm of fsum.segs) {
      const gap = sgm.start - lastEnd;
      const prev = notes[notes.length - 1];
      if (prev && prev.m === sgm.nearest && gap < 0.12) { prev.b = q(prev.b + gap + sgm.end - sgm.start); lastEnd = sgm.end; continue; }
      if (notes.length && gap >= 0.25) notes.push({ m: null, b: q(gap), l: '' });
      notes.push({ m: sgm.nearest, b: q(sgm.end - sgm.start + 0.05), l: '' });
      lastEnd = sgm.end;
    }
    const sections = [];
    let cur = [];
    for (const n of notes) {
      if (n.m == null && n.b >= 1.25 && cur.length) { sections.push(cur); cur = []; continue; }
      cur.push(n);
      if (cur.length >= 16 && n.m != null) { sections.push(cur); cur = []; }
    }
    if (cur.filter((n) => n.m != null).length) sections.push(cur);
    const strip = (ns) => { while (ns.length && ns[0].m == null) ns.shift(); while (ns.length && ns[ns.length - 1].m == null) ns.pop(); return ns; };
    const secs = sections.map(strip).filter((x) => x.length).map((ns, i) => ({ id: 's' + i, name: 'Section ' + (i + 1), notes: ns }));
    const count = secs.reduce((s, x) => s + x.notes.filter((n) => n.m != null).length, 0);
    $('#out', el).innerHTML = `<section class="panel stack"><span class="eyebrow">Melody found</span>
      <h3>${count} notes in ${secs.length} section${secs.length > 1 ? 's' : ''}</h3>
      <p class="muted mono" style="font-size:12.5px;overflow-wrap:anywhere">${secs.map((s) => s.notes.filter((n) => n.m != null).map((n) => nm(n.m)).join(' ')).join('  |  ')}</p>
      <label class="field">Name<input type="text" id="t" value="My melody"></label>
      <label class="field">Lyrics or syllables (optional, one word or syllable per note, separated by spaces)<textarea id="ly" placeholder="e.g. la la la"></textarea></label>
      <button class="btn primary" id="save" style="align-self:flex-start">Save as practice song</button></section>`;
    $('#save', el).addEventListener('click', () => {
      const words = $('#ly', el).value.trim().split(/\s+/).filter(Boolean);
      let wi = 0;
      secs.forEach((s) => s.notes.forEach((n) => { if (n.m != null && wi < words.length) n.l = words[wi++]; }));
      const song = { id: 'u' + Date.now().toString(36), title: $('#t', el).value.trim().slice(0, 60) || 'My melody', credit: 'From your recording', bpm: 60, bar: 4, sections: secs };
      Store.data.customSongs.push(song); Store.save();
      toast('Saved to Your songs');
      go('song', { id: song.id });
    });
  }
};

// ===================== Progress =====================
VIEWS.progress = (el) => {
  const S = Store.data.sessions;
  const scored = S.filter((s) => s.summary);
  const p = Store.data.profile;
  const now = Date.now(), wk = 7 * 864e5;
  const w1 = scored.filter((s) => s.ts > now - wk), w0 = scored.filter((s) => s.ts <= now - wk && s.ts > now - 2 * wk);
  const acc = (a) => (a.length ? Math.round(mean(a.map((s) => s.summary.accuracy))) : null);
  const a1 = acc(w1), a0 = acc(w0);
  const stabs = w1.map((s) => s.summary.stability).filter((x) => x != null);
  // daily series
  const byDay = {};
  for (const s of scored) { const d = new Date(s.ts); d.setHours(12, 0, 0, 0); (byDay[d.getTime()] = byDay[d.getTime()] || []).push(s); }
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b).slice(-60);
  const accPts = days.map((d) => ({ x: d, y: mean(byDay[d].map((s) => s.summary.accuracy)) }));
  const scPts = days.map((d) => ({ x: d, y: mean(byDay[d].map((s) => s.summary.score)) }));
  const stPts = days.map((d) => { const v = byDay[d].map((s) => s.summary.stability).filter((x) => x != null); return v.length ? { x: d, y: mean(v) } : null; }).filter(Boolean);
  const rg = Store.data.ranges;
  const r = rangeOf();
  const lo = Math.min(r.low, ...Object.keys(Store.data.noteStats).map(Number)) - 1, hi = Math.max(r.high, ...Object.keys(Store.data.noteStats).map(Number)) + 1;
  const heat = [];
  for (let m = Math.max(36, lo); m <= Math.min(88, hi); m++) heat.push(m);
  const w = weaknessModel();
  const vw = ($('#view') || el).clientWidth || 360;
  const fullW = vw - 34, halfW = (vw >= 534 ? (vw - 14) / 2 : vw) - 34;
  const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  el.innerHTML = `
    <div class="stack" style="gap:2px"><span class="eyebrow">My Progress</span><h2>Is it getting better?</h2></div>
    ${!scored.length ? '<div class="notice">No sessions yet. Start a lesson and your progress will build up here.</div>' : ''}
    <div class="grid3">
      <div class="panel stat"><span class="v">${a1 == null ? '–' : a1 + '<small>%</small>'}</span><span class="l">Pitch accuracy, last 7 days${a1 != null && a0 != null ? ` · <span style="color:var(${a1 >= a0 ? '--ok' : '--sharp'})">${a1 >= a0 ? '+' : ''}${a1 - a0}</span> vs week before` : ''}</span></div>
      <div class="panel stat"><span class="v">${stabs.length ? '±' + Math.round(mean(stabs)) + '<small>¢</small>' : '–'}</span><span class="l">Pitch steadiness (lower is better)</span></div>
      <div class="panel stat"><span class="v">${nm(p.rangeLow)}–${nm(p.rangeHigh)}</span><span class="l">${p.rangeTested ? 'Comfortable range' : 'Range (estimate, not tested)'}</span></div>
      <div class="panel stat"><span class="v">${Store.streak()}<small>days</small></span><span class="l">Practice streak · ${w1.length} sessions this week</span></div>
    </div>
    <section class="panel stack"><div class="row between"><h3>Daily accuracy and score</h3><div class="graph-legend"><span><i style="background:var(--ok)"></i>Accuracy %</span><span><i style="background:var(--accent)"></i>Score</span></div></div>
      ${lineChart([{ name: 'acc', color: 'var(--ok)', pts: accPts, area: true }, { name: 'score', color: 'var(--accent)', pts: scPts }], { min: 0, max: 100, ticks: [0, 50, 100], label: 'Daily accuracy and score', w: fullW })}</section>
    <div class="grid2">
      <section class="panel stack"><h3>Steadiness on held notes</h3><p class="muted" style="font-size:13px">Average wobble in cents. Going down means steadier.</p>
        ${lineChart([{ name: 'stab', color: 'var(--flat)', pts: stPts }], { min: 0, label: 'Steadiness', w: halfW })}</section>
      <section class="panel stack"><h3>Range over time</h3>
        ${rg.length ? lineChart([{ name: 'hi', color: 'var(--accent)', pts: rg.map((x) => ({ x: x.ts, y: x.high })) }, { name: 'lo', color: 'var(--accent)', pts: rg.map((x) => ({ x: x.ts, y: x.low })) }], { fmt: (v) => nm(Math.round(v)), label: 'Range history', w: halfW }) : '<p class="muted">Take the range test to start tracking your range.</p>'}
        ${rg.length === 1 ? '<p class="muted" style="font-size:13px">Retake the test every few weeks to see change.</p>' : ''}</section>
    </div>
    <section class="panel stack"><h3>Note map</h3><p class="muted" style="font-size:13px">Average tuning on each note you’ve sung in exercises. <span style="color:var(--flat)">Blue</span> = flat, <span style="color:var(--sharp)">orange</span> = sharp, <span style="color:var(--ok)">green</span> = centred.</p>
      <div class="heat">${heat.map((m) => { const s = Store.data.noteStats[m]; if (!s || !s.n) return `<div><b>${nm(m)}</b>–</div>`; const e = s.err / s.n; const col = Math.abs(e) <= 12 ? 'var(--ok-soft)' : e < 0 ? 'var(--flat-soft)' : 'var(--sharp-soft)'; return `<div style="background:${col}"><b>${nm(m)}</b>${e > 0 ? '+' : ''}${Math.round(e)}¢</div>`; }).join('')}</div></section>
    <div class="grid2">
      <section class="panel stack"><h3>Focus areas</h3>${w.length ? w.slice(0, 5).map((a) => `<div class="stack" style="gap:4px"><div class="row between"><span>${esc(a.label)}</span><span class="mono muted">${Math.round(a.score)}</span></div><div style="height:6px;border-radius:3px;background:var(--panel-2)"><div style="height:100%;width:${clamp(a.score, 3, 100)}%;border-radius:3px;background:${a.score >= 75 ? 'var(--ok)' : a.score >= 50 ? 'var(--accent)' : 'var(--sharp)'}"></div></div><span class="muted" style="font-size:12.5px">${esc(a.text)}</span></div>`).join('') : '<p class="muted">Needs a few sessions.</p>'}</section>
      <section class="panel stack"><h3>Exercise levels</h3><div class="stack" style="gap:6px">${EXERCISES.map((e) => `<div class="row between" style="font-size:14px"><span>${esc(e.title)}</span><span class="dots">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= Store.level(e.id) ? 'on' : ''}"></i>`).join('')}</span></div>`).join('')}</div></section>
    </div>
    ${guitarProgressHtml()}
    <section class="panel stack"><h3>Recent sessions</h3><div class="hist">${S.slice(-20).reverse().map((s) => `<div><span>${esc(s.title)}</span><span class="muted mono" style="font-size:12px">${fmtDate(s.ts)}</span><span class="mono">${s.summary ? s.summary.score : s.g ? s.g.score : '–'}</span></div>`).join('') || '<p class="muted">None yet.</p>'}</div></section>`;
};
