<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vocal Studio">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body><title>Vocal Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Design: Apple Music–inspired. Black and warm white surfaces, a rich red accent, colour taken from each song's artwork. */
:root {
  --bg: #000000; --panel: #1C1C1E; --panel-2: #2C2C2E; --line: #38383A; --line-soft: #2A2A2C;
  --text: #FFFFFF; --muted: rgba(235,235,245,.62); --faint: rgba(235,235,245,.38);
  --accent: #FA3C55; --accent-deep: #D92A44; --accent-ink: #FFFFFF; --accent-soft: rgba(250,60,85,.16);
  --ok: #30D158; --sharp: #FF6961; --flat: #64A8FF; --warn: #FFD60A;
  --ok-soft: rgba(48,209,88,.16); --sharp-soft: rgba(255,105,97,.16); --flat-soft: rgba(100,168,255,.16);
  --blue: #0A84FF; --purple: #BF5AF2; --coral: #FF6961; --green: #30D158; --sun: #FFD60A; --gold: #FFD60A;
  --g-blue: #0A84FF; --g-green: #30D158; --g-coral: #FF6961; --g-purple: #BF5AF2;
  --key-white: #EDEDF0; --key-black: #0E0E10; --key-line: #55555C;
  --shadow: 0 24px 60px rgba(0,0,0,.6);
  --display: -apple-system, "SF Pro Display", BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif;
  --body: -apple-system, "SF Pro Text", BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 12px; --r-sm: 10px;
  --t1: #3A1C4A; --t2: #A03050; --t3: #F0A050; --tl: #F3C9D2;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FFFFFF; --panel: #F2F2F7; --panel-2: #E5E5EA; --line: #D1D1D6; --line-soft: #E5E5EA;
    --text: #000000; --muted: rgba(60,60,67,.66); --faint: rgba(60,60,67,.4);
    --accent: #FA2D48; --accent-deep: #D81E39; --accent-soft: rgba(250,45,72,.1);
    --ok: #28A745; --sharp: #E5383B; --flat: #0A6CFF; --warn: #C98A00;
    --ok-soft: rgba(40,167,69,.12); --sharp-soft: rgba(229,56,59,.1); --flat-soft: rgba(10,108,255,.1);
    --key-white: #FFFFFF; --key-black: #1C1C1E; --key-line: #C7C7CC;
    --shadow: 0 24px 60px rgba(0,0,0,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --panel: #F2F2F7; --panel-2: #E5E5EA; --line: #D1D1D6; --line-soft: #E5E5EA;
  --text: #000000; --muted: rgba(60,60,67,.66); --faint: rgba(60,60,67,.4);
  --accent: #FA2D48; --accent-deep: #D81E39; --accent-soft: rgba(250,45,72,.1);
  --ok: #28A745; --sharp: #E5383B; --flat: #0A6CFF; --warn: #C98A00;
  --ok-soft: rgba(40,167,69,.12); --sharp-soft: rgba(229,56,59,.1); --flat-soft: rgba(10,108,255,.1);
  --key-white: #FFFFFF; --key-black: #1C1C1E; --key-line: #C7C7CC;
  --shadow: 0 24px 60px rgba(0,0,0,.18);
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 650; }
h2 { font-size: 1.25rem; font-weight: 620; }
h3 { font-size: 1rem; font-weight: 620; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: 1fr auto; }
.main { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.view { max-width: 980px; margin: 0 auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.view[hidden] { display: none !important; }

.tabs { grid-row: 2; display: grid; grid-template-columns: repeat(8, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { background: none; border: 0; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 10px; min-width: 0; white-space: nowrap; font-weight: 600; letter-spacing: .01em; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
.brand { display: none; }
@media (min-width: 900px) {
  .app { grid-template-columns: 210px 1fr; grid-template-rows: 1fr; }
  .tabs { grid-row: 1; grid-column: 1; grid-template-columns: 1fr; align-content: start; gap: 2px; border-top: 0; border-right: 1px solid var(--line); padding: 22px 12px; }
  .tab { flex-direction: row; gap: 12px; font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); justify-content: flex-start; }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab[aria-current="page"] { background: var(--accent-soft); }
  .brand { display: block; font-family: var(--display); font-weight: 700; font-size: 15px; padding: 0 12px 20px; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .main { grid-column: 2; }
}

/* surfaces */
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.min0 { min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 10px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; transition: transform .12s ease, background .2s; min-height: 44px; }
.btn:hover { border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--sharp); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.big { min-height: 58px; font-size: 17px; padding: 14px 28px; font-family: var(--display); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-soft); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.sharp { background: var(--sharp-soft); color: var(--sharp); border-color: transparent; }
.chip.flat { background: var(--flat-soft); color: var(--flat); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }

label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
input[type=text], input[type=password], input[type=number], select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: 15px; width: 100%; min-width: 0; }
textarea { min-height: 90px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.switch:last-child { border-bottom: 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

.notice { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.notice.error { border-color: color-mix(in srgb, var(--sharp) 55%, transparent); }
.notice b { font-weight: 650; }

/* ---------- Home ---------- */
.hero { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .hero { grid-template-columns: 1.3fr 1fr; } }
.lesson-card { background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.lesson-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; border: 1px solid var(--accent-soft); box-shadow: 0 0 0 22px var(--accent-soft), 0 0 0 44px rgba(0,0,0,0); opacity: .7; pointer-events: none; }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.plan li { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; }
.plan li::before { counter-increment: s; content: counter(s); font-family: var(--mono); font-size: 12px; color: var(--accent); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.stat .l { font-size: 12px; color: var(--muted); }
.spark { width: 100%; height: 46px; display: block; }

/* ---------- Live ---------- */
.readout { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.note-big { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: .9; min-width: 2.6ch; font-variant-numeric: tabular-nums; transition: color .15s; }
.note-big.ok { color: var(--ok); } .note-big.sharp { color: var(--sharp); } .note-big.flat { color: var(--flat); } .note-big.idle { color: var(--faint); }
.cents-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cents-val { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.meter { position: relative; height: 34px; border-radius: 999px; background: linear-gradient(90deg, var(--flat-soft), transparent 40%, transparent 60%, var(--sharp-soft)); border: 1px solid var(--line-soft); margin-top: 8px; }
.meter .zone { position: absolute; left: 40%; width: 20%; top: 0; bottom: 0; background: var(--ok-soft); }
.meter .tick { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
.meter .needle { position: absolute; top: 3px; bottom: 3px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--faint); left: 50%; transition: left .08s linear, background .15s; }
.meter .needle.ok { background: var(--ok); } .meter .needle.sharp { background: var(--sharp); } .meter .needle.flat { background: var(--flat); }
.meter-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding: 3px 4px 0; }
.graph-wrap { position: relative; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line-soft); overflow: hidden; }
.graph-wrap canvas { display: block; width: 100%; height: 260px; touch-action: pan-y; }
.graph-wrap.tall canvas { height: 320px; }
.graph-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.graph-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.kb-wrap { overflow-x: auto; border-radius: var(--r-sm); }
.kb { position: relative; height: 92px; user-select: none; -webkit-user-select: none; min-width: 100%; }
.kb .w, .kb .b { position: absolute; top: 0; border-radius: 0 0 6px 6px; border: 1px solid var(--key-line); border-top: 0; transition: background .1s; }
.kb .w { background: var(--key-white); height: 100%; z-index: 1; }
.kb .b { background: var(--key-black); height: 60%; z-index: 2; border-color: var(--key-black); }
.kb .lbl { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 10px; color: #6d675e; pointer-events: none; }
.kb .on-ok { background: var(--ok) !important; } .kb .on-sharp { background: var(--sharp) !important; } .kb .on-flat { background: var(--flat) !important; }
.kb .target { box-shadow: inset 0 -5px 0 var(--accent); }
.kb .in-range::after { content: ""; position: absolute; left: 30%; right: 30%; top: 4px; height: 3px; border-radius: 2px; background: var(--accent); opacity: .55; }
.kb .b.in-range::after { opacity: .9; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--panel-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11.5px; color: var(--muted); }
.sing-btn { position: relative; }
.sing-btn.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--sharp); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.level { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; width: 80px; }
.level i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .08s linear; }

/* ---------- Practice ---------- */
.ex-group { display: flex; flex-direction: column; gap: 10px; }
.ex-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ex { text-align: left; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; transition: border-color .2s, transform .12s; }
.ex:hover { border-color: var(--line); }
.ex:active { transform: scale(.985); }
.ex .t { font-weight: 650; font-size: 15px; }
.ex .d { font-size: 13px; color: var(--muted); flex: 1; }
.ex .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

.runner-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-size: 11.5px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--faint); }
.steps span.on { background: var(--accent-soft); color: var(--accent); }
.steps span.done { color: var(--muted); }
.status-line { font-family: var(--display); font-size: 20px; font-weight: 600; min-height: 30px; }
.countdown { font-family: var(--mono); color: var(--accent); }
.tips { display: flex; flex-direction: column; gap: 10px; }
.tip { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 3px; }
.tip.good { border-color: var(--ok); }
.tip.flat { border-color: var(--flat); }
.tip.sharp { border-color: var(--sharp); }
.tip .h { font-weight: 650; }
.tip .b { color: var(--muted); font-size: 14px; }
.notes-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.notes-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.notes-table td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.score-ring { width: 86px; height: 86px; flex: none; }
.ai-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ai-text { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; }

/* ---------- Songs ---------- */
.song-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.song { text-align: left; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.song .t { font-weight: 650; }
.song .d { font-size: 12.5px; color: var(--muted); }
.trouble { display: flex; flex-direction: column; gap: 6px; }
.trouble div { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }

/* ---------- Progress ---------- */
.chart { width: 100%; height: 190px; display: block; }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
.heat div { border-radius: 6px; padding: 6px 2px; text-align: center; font-size: 11px; font-family: var(--mono); background: var(--panel-2); color: var(--muted); }
.heat div b { display: block; font-size: 12px; color: var(--text); font-weight: 600; }
.hist { display: flex; flex-direction: column; }
.hist div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; align-items: baseline; }
.hist div:last-child { border-bottom: 0; }

.range-strip { position: relative; height: 34px; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
.range-strip .ext { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
.range-strip .cmf { position: absolute; top: 7px; bottom: 7px; background: var(--accent); border-radius: 5px; opacity: .85; }
.range-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--faint); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); max-height: 85vh; overflow-y: auto; }
@media (min-width: 600px) { .overlay { align-items: center; } }

@media (max-width: 420px) {
  .note-big { font-size: 52px; }
  .kpis { gap: 6px; }
  .kpi .v { font-size: 16px; }
  .graph-wrap canvas { height: 220px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- Guitar ---------- */
.gseg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.gseg button { white-space: nowrap; flex: none; }
.chord-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
.chord-card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chord-card:hover { border-color: var(--line); }
.chord-card .cn { font-family: var(--display); font-weight: 650; font-size: 18px; }
.sgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-width: 360px; }
.sgrid span { display: flex; flex-direction: column; align-items: center; background: var(--accent-soft); border-radius: 6px; padding: 4px 0; }

.sgrid i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.tstr.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.bars div { background: var(--panel-2); border-radius: 8px; padding: 8px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.bars div span { width: 100%; font-size: 12px; }
.bars i { width: 12px; height: 12px; border-radius: 3px; background: var(--line); }
.bars i.ok { background: var(--ok); } .bars i.bad { background: var(--sharp); }
.bars b { font-family: var(--mono); font-size: 15px; } .bars b.ok { color: var(--ok); } .bars b.mid { color: var(--accent); } .bars b.bad { color: var(--sharp); }
.prog { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- AI Vocal Coach ---------- */
.coach-hero { display: flex; gap: 22px; align-items: center; background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; padding: 22px; flex-wrap: wrap; }
.coach-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(170deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 20px; text-align: center; }
.orb { position: relative; width: 112px; height: 112px; flex: none; }
.orb i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--orb, var(--faint)); opacity: .9; }
.orb i:nth-child(2) { inset: 14px; opacity: .55; } .orb i:nth-child(3) { inset: 30px; background: var(--orb, var(--faint)); opacity: .9; border: 0; }
.orb[data-state="speaking"], .orb[data-state="demo"] { --orb: var(--accent); }
.orb[data-state="listening"], .orb[data-state="singing"] { --orb: var(--ok); }
.orb[data-state="thinking"] { --orb: var(--muted); } .orb[data-state="paused"], .orb[data-state="idle"] { --orb: var(--faint); }
.orb[data-state="speaking"] i:nth-child(1), .orb[data-state="demo"] i:nth-child(1) { animation: orbOut 1.2s ease-out infinite; }
.orb[data-state="speaking"] i:nth-child(2), .orb[data-state="demo"] i:nth-child(2) { animation: orbOut 1.2s .4s ease-out infinite; }
.orb[data-state="listening"] i:nth-child(1), .orb[data-state="singing"] i:nth-child(1) { animation: orbIn 1.6s ease-in-out infinite; }
.orb[data-state="thinking"] i:nth-child(3) { animation: pulse 1s infinite; }
@keyframes orbOut { from { transform: scale(.75); opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
@keyframes orbIn { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.86); opacity: .45; } }
.state-label { font-family: var(--display); font-weight: 650; font-size: 22px; }
.caption { font-size: 17px; line-height: 1.5; max-width: 34em; min-height: 3em; color: var(--text); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.ctrl .btn { min-height: 40px; }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.log .msg { font-size: 14px; padding: 7px 11px; border-radius: 12px; max-width: 88%; }
.log .coach { background: var(--panel-2); align-self: flex-start; }
.log .you { background: var(--accent-soft); color: var(--text); align-self: flex-end; }
.log .sys { color: var(--faint); font-size: 12.5px; align-self: center; text-align: center; }
@media (max-width: 420px) { .orb { width: 92px; height: 92px; } .caption { font-size: 16px; } }
@media (max-width: 600px) { .coach-hero { flex-direction: column; align-items: stretch; text-align: left; } .coach-hero .orb { align-self: center; width: 84px; height: 84px; } }

/* ---- guitar: transitions, ladder, picking, theory ---- */
.trans { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.trans-fig { flex: 0 0 auto; }
.tsvg .tdot { transition: transform 0.9s cubic-bezier(.5,0,.3,1), opacity 0.5s; }
@media (prefers-reduced-motion: reduce) { .tsvg .tdot { transition: none; } }
.tsteps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.tsteps li::marker { font-weight: 800; }
.tsteps .k-anchor::marker { color: var(--ok); } .tsteps .k-guide::marker { color: var(--warn); }
.tsteps .k-move::marker, .tsteps .k-place::marker { color: var(--accent); } .tsteps .k-tip { list-style: '★ '; color: var(--muted); }
.ladder { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.ladder span { min-width: 42px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2, rgba(127,127,127,.12)); font: 700 13px 'JetBrains Mono', monospace; color: var(--muted); }

.ladder b { margin-left: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.keychart > div { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
.keychart span { display: grid; gap: 2px; text-align: center; padding: 8px 4px; border-radius: 12px; background: var(--panel-2, rgba(127,127,127,.12)); }
.keychart span b { font-size: 12px; color: var(--muted); } .keychart span i { font-style: normal; font-weight: 800; font-size: 17px; }
.keychart span.q { outline: 2px solid var(--accent); } .keychart span.q i { color: var(--accent); }
@media (max-width: 600px) { .trans { flex-direction: column; align-items: stretch; } .trans-fig { align-self: center; } }

/* ---- sing + play ---- */
.sp-card { display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer; color: inherit; font: inherit; }
.sp-pips { display: flex; gap: 4px; align-items: center; margin-top: 4px; }

.sp-pips i.done { background: var(--ok); } .sp-pips i.on { background: var(--accent); }
.sp-pips em { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 6px; }
.sp-key { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: #fff; }
.sp-key span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; } .sp-key b { font-size: 24px; line-height: 1; }

.sp-chart { display: flex; flex-wrap: wrap; gap: 6px; }

.sp-bar.on { border-color: var(--accent); }

.sp-bar span { font-size: 13px; color: var(--muted); } .sp-bar u { text-decoration: none; } .sp-bar u.on { color: var(--text); font-weight: 800; }



/* =================== Editorial layer (Apple Music–inspired) =================== */
body { font-family: var(--body); font-size: 17px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.022em; font-weight: 700; }

.display { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }

.eyebrow { font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }

.fine { font-size: 13px; color: var(--muted); }
.prose { font-size: 16px; line-height: 1.5; max-width: 62ch; }
.link { background: none; border: 0; color: var(--accent); font-weight: 500; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; padding: 4px 0; }

/* app frame & navigation */
.app { grid-template-rows: 1fr auto auto; }
.tabs { grid-row: 3; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(1.8) blur(24px); -webkit-backdrop-filter: saturate(1.8) blur(24px); border-top: .5px solid var(--line); padding-top: 6px; }
.tab { font-size: 10px; font-weight: 500; color: var(--faint); gap: 3px; padding: 2px 0 6px; letter-spacing: .01em; }

.brand-mark { display: inline-flex; gap: 2px; align-items: center; height: 18px; }
.brand-mark i { width: 3.5px; border-radius: 2px; background: var(--accent); }
.brand-mark i:nth-child(1) { height: 9px; } .brand-mark i:nth-child(2) { height: 17px; } .brand-mark i:nth-child(3) { height: 12px; }

@media (min-width: 900px) {
  .app { grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; }
  .tabs { grid-row: 1 / span 2; grid-column: 1; grid-template-columns: 1fr; align-content: start; gap: 1px; border-top: 0; border-right: .5px solid var(--line); padding: 22px 12px; background: color-mix(in srgb, var(--panel) 70%, var(--bg)); }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 17px; padding: 0 10px 14px; }
  .side-search { display: flex; align-items: center; gap: 6px; margin: 0 4px 14px; padding: 6px 9px; border-radius: 8px; background: var(--panel-2); }
  .side-search svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
  .side-search input { border: 0; background: transparent; padding: 0; font-size: 14px; }
  .side-label { display: block; font-size: 11.5px; font-weight: 600; color: var(--faint); padding: 12px 10px 4px; }
  .tab { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14.5px; font-weight: 500; padding: 6px 10px; border-radius: 7px; color: var(--text); }
  .tab svg { width: 20px; height: 20px; stroke: var(--accent); }
  .tab:hover { background: var(--panel-2); }
  .tab[aria-current="page"] { background: var(--panel-2); color: var(--text); }
  .main { grid-column: 2; grid-row: 2; }

}

/* controls */
.panel { background: var(--panel); border: 0; border-radius: var(--r); padding: 16px; }

.btn:hover { opacity: .85; } .btn:active { transform: scale(.97); }

:root[data-theme="light"] .seg button[aria-pressed="true"] { background: #fff; }

input[type=text], input[type=search], input[type=password], input[type=number], select, textarea { background: var(--panel); border: 0; border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--text); }
.ex, .song, .chord-card { background: var(--panel); border: 0; border-radius: var(--r); box-shadow: none; }

.tip { border-left-width: 3px; border-radius: 0; }

.notice { border: 0; background: var(--panel); border-radius: 12px; }

/* large title header */
.lt { display: flex; justify-content: space-between; align-items: flex-end; padding: 12px 0 2px; border-bottom: .5px solid var(--line); padding-bottom: 10px; }

@media (min-width: 900px) { .lt h1 { font-size: 30px; } .lt { border-bottom: 0; } }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--accent), #BF5AF2); color: #fff; font-weight: 700; font-size: 15px; }

/* section heads with chevrons */

.sec-h { display: inline-flex; align-items: center; gap: 4px; color: var(--text); text-decoration: none; cursor: pointer; align-self: flex-start; }
.sec-h svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2.6; margin-top: 2px; }
.sect-sub { color: var(--muted); font-size: 15px; margin-top: -6px; }

/* featured editorial story */
.feature { display: flex; flex-direction: column; gap: 2px; margin-top: 18px !important; }
.f-eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.f-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }

.f-art { position: relative; display: block; width: 100%; border: 0; padding: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--t1); box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.f-art .wide { width: 100%; height: 100%; display: block; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
.f-art:hover .wide { transform: scale(1.03); }

/* rails: few, large, snap */

.rail::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .rail { margin: 0 -44px; padding: 2px 44px 8px; scroll-padding: 44px; } }
.rail.big { grid-auto-columns: 46%; }
@media (min-width: 600px) { .rail.big { grid-auto-columns: 30%; } }
@media (min-width: 1100px) { .rail.big { grid-auto-columns: 22%; } }
.rail.cards { grid-auto-columns: 78%; }
@media (min-width: 600px) { .rail.cards { grid-auto-columns: 44%; } }
@media (min-width: 1100px) { .rail.cards { grid-auto-columns: 30%; } }
.tile { border: 0; background: none; padding: 0; color: inherit; text-align: left; display: flex; flex-direction: column; gap: 1px; scroll-snap-align: start; min-width: 0; }
.tile .cover { width: 100%; aspect-ratio: 1; height: auto; border-radius: 8px; display: block; margin-bottom: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tile b { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tile .prog { height: 3px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; } .tile .prog i { display: block; height: 100%; background: var(--accent); }
/* "Made for you" style card: art + colour band */
.bigcard { border: 0; padding: 0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; text-align: left; color: #fff; background: var(--t1); scroll-snap-align: start; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.bigcard .bc-art { width: 100%; aspect-ratio: 1; height: auto; display: block; }
.bc-band { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px 16px; background: linear-gradient(var(--t1), color-mix(in srgb, var(--t1) 80%, #000)); }
.bc-band b { font-size: 17px; font-weight: 600; } .bc-band small { font-size: 13.5px; opacity: .8; } .bc-band em { font-style: normal; font-size: 12px; opacity: .6; margin-top: 4px; }

/* meet the instructor */
.meet { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; width: 100%; border: 0; text-align: left; color: #fff; padding: 22px; border-radius: 18px; overflow: hidden; isolation: isolate; background: #0B0B0D; margin-top: 34px !important; }
.meet::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(80% 120% at 0% 0%, color-mix(in srgb, var(--t2) 75%, transparent), transparent 60%), radial-gradient(70% 90% at 100% 100%, color-mix(in srgb, var(--t3) 50%, transparent), transparent 60%); }
.meet-orb .iorb { width: 64px; height: 64px; } .meet-orb .iorb i { border-color: #fff; } .meet-orb .iorb b { background: #fff; box-shadow: 0 0 20px #fff; }
.meet-t { display: flex; flex-direction: column; gap: 3px; } .meet-t small { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; opacity: .75; }
.meet-t b { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; } .meet-t span { font-size: 15px; opacity: .85; max-width: 44ch; }
.meet-btn { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #000; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; }
.meet-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }
@media (min-width: 700px) { .meet { grid-template-columns: auto 1fr auto; padding: 28px 30px; } .meet-btn { grid-column: auto; } }
.meet.slim { padding: 16px 18px; } .meet.slim .meet-t b { font-size: 18px; } .meet.slim > svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; }

/* genre tiles */
.genres { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 900px) { .genres { grid-template-columns: repeat(3, 1fr); } }
.genre { position: relative; border: 0; padding: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 10; color: #fff; text-align: left; background: var(--t1); }

/* replay-style journey */

.replay.big { background: radial-gradient(90% 120% at 0% 0%, var(--t2), transparent 60%), radial-gradient(90% 120% at 100% 100%, var(--t3), transparent 55%), #0E0A10; }
.r-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; opacity: .8; }
.r-hero { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 6px; } .r-hero b { font-family: var(--display); font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; } .r-hero span { font-size: 17px; opacity: .85; }
.r-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; margin-top: 14px; }

}

/* Now Playing */

.np-bg { position: absolute; inset: -20%; z-index: -1; filter: blur(70px) saturate(1.4); background: var(--t1); }

.np-bg i:nth-child(1) { background: var(--t2); left: -5%; top: -5%; } .np-bg i:nth-child(2) { background: var(--t3); right: -5%; top: 20%; animation-delay: -6s; } .np-bg i:nth-child(3) { background: var(--t1); left: 20%; bottom: -10%; animation-delay: -12s; } .np-bg i:nth-child(4) { background: var(--tl); right: 20%; bottom: 10%; width: 35%; height: 35%; opacity: .35; animation-delay: -3s; }
.np::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,.28); }

.np-top { display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 16px 0; }

.np-lines span { transition: color .2s; } .np-lines p.on span { color: rgba(255,255,255,.55); } .np-lines p.on span.now { color: #fff; text-shadow: 0 0 30px rgba(255,255,255,.35); }

<script id="pitch-core">// ===== Pitch core: shared by the AudioWorklet, the main thread and the tests =====
// McLeod Pitch Method (NSDF) with parabolic interpolation, run on a 2x-decimated signal.

function pcMPM(x, n, sr, minF, maxF, nsdf) {
  let mean = 0;
  for (let i = 0; i < n; i++) mean += x[i];
  mean /= n;
  for (let i = 0; i < n; i++) x[i] -= mean;
  const minLag = Math.max(2, Math.floor(sr / maxF));
  const maxLag = Math.min(Math.ceil(sr / minF) + 2, (n >> 1) + (n >> 2));
  let m = 0;
  for (let i = 0; i < n; i++) m += x[i] * x[i];
  m *= 2;
  if (m <= 1e-12) return [0, 0];
  nsdf[0] = 1;
  for (let tau = 1; tau <= maxLag; tau++) {
    m -= x[n - tau] * x[n - tau] + x[tau - 1] * x[tau - 1];
    let acf = 0;
    const lim = n - tau;
    for (let i = 0; i < lim; i++) acf += x[i] * x[i + tau];
    nsdf[tau] = m > 1e-12 ? (2 * acf) / m : 0;
  }
  // skip the zero-lag lobe
  let tau = 1;
  while (tau < maxLag && nsdf[tau] > 0) tau++;
  let inLobe = false, bestT = -1, bestV = -1;
  const peaksT = [], peaksV = [];
  for (; tau < maxLag; tau++) {
    const v = nsdf[tau];
    if (v > 0) {
      if (!inLobe) { inLobe = true; bestT = tau; bestV = v; }
      else if (v > bestV) { bestV = v; bestT = tau; }
    } else if (inLobe) {
      inLobe = false;
      if (bestT >= minLag) { peaksT.push(bestT); peaksV.push(bestV); }
    }
  }
  if (inLobe && bestT >= minLag && bestT < maxLag - 1) { peaksT.push(bestT); peaksV.push(bestV); }
  if (!peaksT.length) return [0, 0];
  let hi = 0;
  for (let i = 0; i < peaksV.length; i++) if (peaksV[i] > hi) hi = peaksV[i];
  const thr = 0.9 * hi;
  let k = 0;
  while (peaksV[k] < thr) k++;
  const t = peaksT[k];
  const a = nsdf[t - 1], b = nsdf[t], c = t + 1 <= maxLag ? nsdf[t + 1] : b;
  const den = a - 2 * b + c;
  let shift = 0;
  if (Math.abs(den) > 1e-12) shift = (0.5 * (a - c)) / den;
  if (shift > 1 || shift < -1) shift = 0;
  const peak = b - 0.25 * (a - c) * shift;
  return [sr / (t + shift), Math.min(1, peak)];
}

class PCTracker {
  constructor(inSr, opts) {
    opts = opts || {};
    this.inSr = inSr;
    this.D = inSr >= 32000 ? 2 : 1;
    this.sr = inSr / this.D;
    this.win = 1024;
    this.hop = opts.hop || 256;
    this.minF = opts.minF || 60;
    this.maxF = opts.maxF || 1300;
    this.ring = new Float32Array(this.win);
    this.work = new Float32Array(this.win);
    this.nsdf = new Float32Array(this.win);
    this.w = 0; this.filled = 0; this.sinceHop = 0;
    this.h0 = 0; this.h1 = 0; this.h2 = 0; this.h3 = 0; this.phase = 0;
    this.inCount = 0;
    this.prevS = 0; this.hfAcc = 0; this.hfN = 0;
  }
  push(input, emit) {
    const D = this.D;
    for (let i = 0; i < input.length; i++) {
      const s = input[i];
      // first-difference energy = attack/pick transients, used for onset detection
      const dd = s - this.prevS; this.prevS = s; this.hfAcc += dd * dd; this.hfN++;
      // 5-tap binomial low-pass before decimation
      const y = D === 2 ? (this.h3 + 4 * this.h2 + 6 * this.h1 + 4 * this.h0 + s) / 16 : s;
      this.h3 = this.h2; this.h2 = this.h1; this.h1 = this.h0; this.h0 = s;
      this.inCount++;
      if (D === 2) { this.phase ^= 1; if (this.phase) continue; }
      this.ring[this.w] = y;
      this.w = (this.w + 1) % this.win;
      if (this.filled < this.win) this.filled++;
      this.sinceHop++;
      if (this.filled === this.win && this.sinceHop >= this.hop) {
        this.sinceHop = 0;
        this.analyze(emit);
      }
    }
  }
  analyze(emit) {
    const n = this.win, w = this.work;
    let sum = 0;
    for (let i = 0; i < n; i++) { const v = this.ring[(this.w + i) % n]; w[i] = v; sum += v * v; }
    const rms = Math.sqrt(sum / n);
    let f = 0, c = 0;
    if (rms > 0.0008) {
      const r = pcMPM(w, n, this.sr, this.minF, this.maxF, this.nsdf);
      f = r[0]; c = r[1];
      if (f < this.minF || f > this.maxF) { f = 0; c = 0; }
    }
    const hf = this.hfN ? this.hfAcc / this.hfN : 0;
    this.hfAcc = 0; this.hfN = 0;
    // t = time at the centre of the analysis window; te = centre of the latest hop (for onsets)
    const tEnd = this.inCount / this.inSr;
    emit(tEnd - (n * this.D) / this.inSr / 2, f, c, rms, hf, tEnd - (this.hop * this.D) / this.inSr / 2);
  }
}

// --- note maths ---
const PC_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
function pcFreqToMidi(f, a4) { return 69 + 12 * Math.log2(f / (a4 || 440)); }
function pcMidiToFreq(m, a4) { return (a4 || 440) * Math.pow(2, (m - 69) / 12); }
function pcName(m) { const r = Math.round(m); return PC_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); }
function pcPitchClass(m) { const r = Math.round(m); return PC_NAMES[((r % 12) + 12) % 12]; }

// --- small radix-2 FFT for offline tone features ---
function pcFFT(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < len / 2; j++) {
        const ar = re[i + j], ai = im[i + j];
        const br = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci;
        const bi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
        re[i + j] = ar + br; im[i + j] = ai + bi;
        re[i + j + len / 2] = ar - br; im[i + j + len / 2] = ai - bi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}

// Tone features of one audio slice whose pitch is f0:
// h1h2 = level difference between the 1st and 2nd harmonic (dB; high = breathier, low = pressed),
// alpha = energy 1–5 kHz relative to 0–1 kHz (dB; higher = brighter/pressed).
function pcToneFeatures(samples, start, sr, f0) {
  const N = 4096;
  if (start < 0 || start + N > samples.length || !(f0 > 0)) return null;
  const re = new Float32Array(N), im = new Float32Array(N);
  for (let i = 0; i < N; i++) re[i] = samples[start + i] * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1)));
  pcFFT(re, im);
  const mag = (k) => re[k] * re[k] + im[k] * im[k];
  const binHz = sr / N;
  const harm = (h) => {
    const k = Math.round((h * f0) / binHz);
    let best = 0;
    for (let d = -2; d <= 2; d++) if (k + d > 0 && k + d < N / 2) best = Math.max(best, mag(k + d));
    return best;
  };
  const h1 = harm(1), h2 = harm(2);
  let lo = 0, hi = 0;
  for (let k = 1; k < N / 2; k++) {
    const f = k * binHz, p = mag(k);
    if (f >= 50 && f < 1000) lo += p; else if (f >= 1000 && f < 5000) hi += p;
  }
  if (h1 <= 0 || h2 <= 0 || lo <= 0 || hi <= 0) return null;
  return { h1h2: 10 * Math.log10(h1 / h2), alpha: 10 * Math.log10(hi / lo) };
}

<script>'use strict';
// ===================== Storage (on this device only) =====================
const STORE_KEY = 'vocal-coach.v1';
const VOICE_PRESETS = {
  lower: { low: 43, high: 62, label: 'Lower voice' },     // G2–D4
  higher: { low: 55, high: 74, label: 'Higher voice' },   // G3–D5
  unsure: { low: 50, high: 67, label: 'Not sure yet' },   // D3–G4 (overlap of most voices)
};

const Store = {
  data: null,
  defaults() {
    return {
      v: 1,
      profile: { name: '', voice: 'unsure', rangeLow: 50, rangeHigh: 67, extLow: null, extHigh: null, rangeTested: false,
        a4: 440, headphones: false, tone: 'voice', metronome: true, apiKey: '', model: 'claude-sonnet-5-5', onboarded: false },
      sessions: [], levels: {}, ranges: [], noteStats: {}, songProgress: {}, customSongs: [], guitar: {}, coach: {},
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { d = null; }
    const def = this.defaults();
    this.data = d && d.v === 1 ? { ...def, ...d, profile: { ...def.profile, ...(d.profile || {}) } } : def;
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); return true; } catch (e) { return false; } },
  a4() { return (this.data && this.data.profile.a4) || 440; },

  addSession(s) {
    s.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    s.ts = Date.now();
    this.data.sessions.push(s);
    if (this.data.sessions.length > 600) this.data.sessions.splice(0, this.data.sessions.length - 600);
    // per-note history (signed cents, hit within tolerance)
    for (const n of s.notes || []) {
      if (n.missed || n.median == null) continue;
      const k = String(n.midi);
      const ns = this.data.noteStats[k] || { n: 0, err: 0, abs: 0, hit: 0 };
      ns.n++; ns.err += n.median; ns.abs += Math.abs(n.median); ns.hit += n.inTol >= 0.6 ? 1 : 0;
      this.data.noteStats[k] = ns;
    }
    this.save();
    return s;
  },
  level(id) { return this.data.levels[id] || 1; },
  setLevel(id, l) { this.data.levels[id] = clamp(l, 1, 5); this.save(); },

  dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); },
  streak() {
    const days = new Set(this.data.sessions.map((s) => this.dayKey(s.ts)));
    let n = 0;
    const d = new Date();
    if (!days.has(this.dayKey(d.getTime()))) d.setDate(d.getDate() - 1); // today not done yet keeps yesterday's streak
    while (days.has(this.dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },
  practicedToday() { const k = this.dayKey(Date.now()); return this.data.sessions.some((s) => this.dayKey(s.ts) === k); },
};

// ===================== Performance analysis =====================
// Everything here works on measured frames ({t, midi, voiced, c, rms}) and, when available,
// the recorded samples. Nothing is guessed: if a measure can't be taken it is left null.

const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
const std = (a) => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1)); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function slope(xs, ys) {
  const n = xs.length; if (n < 3) return 0;
  const mx = mean(xs), my = mean(ys);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  return den ? num / den : 0;
}
const toDb = (r) => 20 * Math.log10(Math.max(r, 1e-5));
const hnrOf = (c) => 10 * Math.log10(Math.min(c, 0.999) / (1 - Math.min(c, 0.999)));

function movingAvg(arr, k) {
  const out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) {
    let s = 0, n = 0;
    for (let j = Math.max(0, i - k); j <= Math.min(arr.length - 1, i + k); j++) { s += arr[j]; n++; }
    out[i] = s / n;
  }
  return out;
}

// Long-note measures: wobble, drift, vibrato, loudness and breath.
function sustainFeatures(pts, winEnd) {
  // pts: voiced frames [{t, e (cents), rms, c}]
  if (pts.length < 20) return null;
  const ts = pts.map((p) => p.t), es = pts.map((p) => p.e);
  const span = ts[ts.length - 1] - ts[0];
  const fps = pts.length / Math.max(span, 0.01);
  const k = Math.max(1, Math.round(fps * 0.1));
  const smooth = movingAvg(es, k);                 // 200 ms window: removes vibrato, keeps wobble/drift
  const wobble = std(smooth);
  const driftRate = slope(ts, smooth);             // cents per second
  const q = Math.max(3, Math.floor(pts.length / 4));
  const endDelta = median(es.slice(-q)) - median(es.slice(0, q));
  // vibrato: oscillation of the residual around the 350 ms trend
  const trend = movingAvg(es, Math.max(1, Math.round(fps * 0.175)));
  const resid = es.map((e, i) => e - trend[i]);
  let cross = 0;
  for (let i = 1; i < resid.length; i++) if ((resid[i - 1] < 0) !== (resid[i] < 0)) cross++;
  const rate = cross / 2 / Math.max(span, 0.01);
  const extent = std(resid) * 2.8;                 // approx peak-to-peak in cents
  const vibrato = rate >= 4 && rate <= 8 && extent >= 20 && extent <= 160 ? { rate, extent } : null;
  const db = pts.map((p) => toDb(p.rms));
  const loudSlope = slope(ts, db);
  const loudStd = std(movingAvg(db, k));
  const hnr = mean(pts.map((p) => hnrOf(p.c)));
  let gaps = 0;
  for (let i = 1; i < pts.length; i++) if (ts[i] - ts[i - 1] > 0.07) gaps++;
  const shortBy = winEnd != null ? Math.max(0, winEnd - ts[ts.length - 1] - 0.2) : 0;
  return { span, wobble, driftRate, endDelta, vibrato, loudSlope, loudStd, hnr, gaps, shortBy };
}

// Score a sung phrase against target notes. Times are seconds relative to the phrase start.
function scorePhrase(frames, targets, opts) {
  const tol = opts.tol || 30;
  const lat = opts.latency || 0;
  const rec = opts.rec || null;
  const notes = [];
  for (let i = 0; i < targets.length; i++) {
    const tg = targets[i];
    if (tg.midi == null) continue;
    const w0 = tg.start + lat, w1 = tg.start + tg.dur + lat;
    const onsetLen = Math.min(0.15, tg.dur * 0.3);
    const all = frames.filter((f) => f.t >= w0 && f.t < w1);
    const voiced = all.filter((f) => f.voiced);
    const res = { i, midi: tg.midi, lyric: tg.lyric || '', start: tg.start, dur: tg.dur, missed: false };
    if (voiced.length < Math.max(3, all.length * 0.12)) { res.missed = true; res.score = 0; notes.push(res); continue; }
    let es = voiced.map((f) => (f.midi - tg.midi) * 100);
    let med = median(es), octave = 0;
    if (Math.abs(med) > 600) {
      const o = Math.round(med / 1200);
      if (Math.abs(med - o * 1200) < 150) { octave = o; es = es.map((e) => e - o * 1200); med = median(es); }
    }
    const sus = [], ons = [];
    voiced.forEach((f, j) => { (f.t - w0 < onsetLen ? ons : sus).push({ t: f.t - lat, e: es[j], rms: f.rms, c: f.c }); });
    const susE = (sus.length >= 3 ? sus : voiced.map((f, j) => ({ e: es[j] }))).map((p) => p.e);
    const sm = median(susE);
    const inTol = susE.filter((e) => Math.abs(e) <= tol).length / susE.length;
    const meanAbs = mean(susE.map(Math.abs));
    const susAll = all.filter((f) => f.t - w0 >= onsetLen);
    res.median = sm;
    res.inTol = inTol;
    res.meanAbs = meanAbs;
    res.std = std(susE);
    res.voicedRatio = susAll.length ? susAll.filter((f) => f.voiced).length / susAll.length : voiced.length / all.length;
    res.octave = octave;
    res.onset = ons.length >= 2 ? median(ons.map((p) => p.e)) : null;
    const firstGood = voiced.find((f, j) => Math.abs(es[j]) < 100);
    res.onsetDelay = firstGood ? firstGood.t - w0 : null;
    // big jumps inside a held note = cracks / flips
    let jumps = 0;
    for (let j = 1; j < sus.length; j++) if (Math.abs(sus[j].e - sus[j - 1].e) > 250 && sus[j].t - sus[j - 1].t < 0.06) jumps++;
    res.jumps = jumps;
    res.hnr = mean(voiced.map((f) => hnrOf(f.c)));
    if (tg.dur >= 1.1) res.sustain = sustainFeatures(sus, tg.start + tg.dur);
    if (rec && sus.length > 4) {
      const mid = sus[sus.length >> 1];
      const fr = voiced.find((f) => Math.abs(f.t - lat - mid.t) < 0.02) || voiced[voiced.length >> 1];
      const idx = Math.floor((mid.t + lat - rec.offset) * rec.sr) - 2048;
      res.tone = pcToneFeatures(rec.samples, idx, rec.sr, pcMidiToFreq(fr.midi, Store.a4()));
    }
    res.score = Math.round(100 * (0.55 * inTol + 0.3 * clamp(1 - meanAbs / (tol * 3), 0, 1) + 0.15 * res.voicedRatio));
    notes.push(res);
  }
  // intervals and transitions between consecutive sung notes
  const intervals = [];
  let breaks = [];
  for (let j = 1; j < notes.length; j++) {
    const a = notes[j - 1], b = notes[j];
    if (a.missed || b.missed) continue;
    const semis = b.midi - a.midi;
    if (semis !== 0) intervals.push({ semis, err: b.median - a.median, from: a.midi, to: b.midi });
    if (opts.legato && Math.abs(semis) >= 3 && Math.abs(a.median) < 100 && Math.abs(b.median) < 100) {
      const t0 = a.start + a.dur * 0.6 + lat, t1 = b.start + b.dur * 0.4 + lat;
      const lo = Math.min(a.midi, b.midi) - 2.5, hi = Math.max(a.midi, b.midi) + 2.5;
      const tr = frames.filter((f) => f.t >= t0 && f.t <= t1);
      const odd = tr.filter((f) => f.voiced && (f.midi < lo || f.midi > hi)).length;
      let gap = 0, run = 0;
      for (const f of tr) { if (!f.voiced) { run++; gap = Math.max(gap, run); } else run = 0; }
      const gapSec = gap * 0.0107;
      if (odd >= 3 || (gapSec > 0.12 && a.dur > 0.3)) breaks.push({ from: a.midi, to: b.midi, kind: odd >= 3 ? 'flip' : 'gap' });
    }
  }
  notes.forEach((n) => { if (n.jumps >= 2) breaks.push({ from: n.midi, to: n.midi, kind: 'crack' }); });
  return { notes, intervals, breaks, summary: summarize(notes, breaks, tol) };
}

function summarize(notes, breaks, tol) {
  const sung = notes.filter((n) => !n.missed);
  const score = notes.length ? Math.round(mean(notes.map((n) => n.score))) : 0;
  const wsum = sung.reduce((s, n) => s + n.dur, 0) || 1;
  const accuracy = sung.length ? Math.round((100 * sung.reduce((s, n) => s + n.inTol * n.dur, 0)) / wsum) : 0;
  const near = sung.filter((n) => Math.abs(n.median) < 100);
  const bias = near.length ? median(near.map((n) => n.median)) : null;
  const meanAbs = sung.length ? mean(sung.map((n) => n.meanAbs)) : null;
  const stabNotes = sung.filter((n) => n.dur >= 0.4);
  const stability = stabNotes.length ? median(stabNotes.map((n) => (n.sustain ? n.sustain.wobble : n.std))) : null;
  const onsets = sung.filter((n) => n.onset != null).map((n) => n.onset - n.median);
  const delays = sung.filter((n) => n.onsetDelay != null).map((n) => n.onsetDelay);
  return {
    score, accuracy, bias, meanAbs, stability, tol,
    missed: notes.length - sung.length, total: notes.length,
    scoop: onsets.length ? median(onsets) : null,
    timing: delays.length >= 3 ? median(delays) : null,
    breaks: breaks.length,
    hnr: sung.length ? median(sung.map((n) => n.hnr)) : null,
  };
}

// Free singing: find held notes and ignore glides/speech-like pitch movement.
function segmentNotes(frames, minDur = 0.15) {
  const segs = [];
  let cur = null;
  const close = () => {
    if (cur && cur.pts.length >= 8 && cur.pts[cur.pts.length - 1].t - cur.pts[0].t >= minDur) {
      const ms = cur.pts.map((p) => p.midi);
      const m = median(ms);
      const nearest = Math.round(m);
      segs.push({ start: cur.pts[0].t, end: cur.pts[cur.pts.length - 1].t, midi: m, nearest, err: (m - nearest) * 100, std: std(ms) * 100, pts: cur.pts });
    }
    cur = null;
  };
  for (const f of frames) {
    if (!f.voiced) { if (cur && f.t - cur.pts[cur.pts.length - 1].t > 0.08) close(); continue; }
    if (cur) {
      const recent = cur.pts.slice(-8).map((p) => p.midi);
      const c = median(recent);
      if (Math.abs(f.midi - c) <= 0.6 && f.t - cur.pts[cur.pts.length - 1].t < 0.08) { cur.pts.push(f); continue; }
      close();
    }
    cur = { pts: [f] };
  }
  close();
  return segs;
}

function freeSummary(frames, target, tol) {
  const segs = segmentNotes(frames);
  let inTol = 0, n = 0;
  const errs = [], stds = [];
  for (const s of segs) {
    const ref = target != null ? target : s.nearest;
    for (const p of s.pts.slice(Math.min(8, s.pts.length >> 2))) {
      let e = (p.midi - ref) * 100;
      if (target != null && Math.abs(e) > 600) e -= Math.round(e / 1200) * 1200;
      n++; if (Math.abs(e) <= tol) inTol++;
    }
    errs.push(target != null ? (s.midi - target) * 100 : s.err);
    if (s.end - s.start >= 0.4) stds.push(s.std);
  }
  const voiced = frames.filter((f) => f.voiced).length;
  const inSegs = segs.reduce((s, x) => s + x.pts.length, 0);
  return {
    segs, accuracy: n ? Math.round((100 * inTol) / n) : null, bias: errs.length ? median(errs) : null,
    stability: stds.length ? median(stds) : null, heldShare: voiced ? inSegs / voiced : 0,
    singingSec: segs.reduce((s, x) => s + (x.end - x.start), 0),
  };
}

// Pitch-class / range helpers used by the coach and lessons
function rangeOf() {
  const p = Store.data.profile;
  return { low: p.rangeLow, high: p.rangeHigh, mid: Math.round((p.rangeLow + p.rangeHigh) / 2) };
}

// ===================== Audio engine =====================
// Microphone capture, on-device pitch tracking (AudioWorklet, ScriptProcessor fallback),
// recording, and the reference synth. No network calls happen here.

const WORKLET_PROC = `
class VCProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.tracker = new PCTracker(sampleRate);
    this.base = -1;
    this.rec = false; this.chunk = new Float32Array(4096); this.ci = 0; this.chunkT0 = 0; this.n = 0;
    this.out = [];
    this.port.onmessage = (e) => { if (e.data && e.data.type === 'rec') { this.rec = e.data.on; this.ci = 0; } };
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    if (this.base < 0) this.base = currentTime;
    const base = this.base, out = this.out;
    this.tracker.push(ch, (t, f, c, r, h, te) => { out.push(base + t, f, c, r, h, base + te); });
    if (out.length >= 24) { this.port.postMessage({ type: 'frames', d: new Float64Array(out) }); out.length = 0; }
    if (this.rec) {
      for (let i = 0; i < ch.length; i++) {
        if (this.ci === 0) this.chunkT0 = base + (this.n + i) / sampleRate;
        this.chunk[this.ci++] = ch[i];
        if (this.ci === 4096) { this.port.postMessage({ type: 'audio', t0: this.chunkT0, d: this.chunk }); this.chunk = new Float32Array(4096); this.ci = 0; }
      }
    }
    this.n += ch.length;
    return true;
  }
}
registerProcessor('vc-processor', VCProcessor);
`;

const Engine = {
  ctx: null, master: null, stream: null, src: null, node: null, sink: null,
  listeners: new Set(), micOn: false, mode: '', recording: false, recChunks: [],
  floor: 0.002, hist: [], lastSmoothed: null, scheduled: [], wakeLock: null, level: 0,

  async ensure() {
    if (!this.ctx) {
      try { if (navigator.audioSession) navigator.audioSession.type = this.micOn ? 'play-and-record' : 'playback'; } catch (e) {}
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('This browser has no Web Audio support.');
      this.ctx = new AC({ latencyHint: 'interactive' });
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
    }
    if (this.ctx.state !== 'running') { try { await this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },

  async startMic() {
    await this.ensure();
    if (this.micOn) return;
    if (!window.isSecureContext) throw Object.assign(new Error('insecure'), { name: 'InsecureContext' });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nomedia'), { name: 'NoMediaDevices' });
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
    });
    const ctx = this.ctx;
    this.src = ctx.createMediaStreamSource(this.stream);
    this.sink = ctx.createGain(); this.sink.gain.value = 0; this.sink.connect(ctx.destination);
    let ok = false;
    if (ctx.audioWorklet && window.AudioWorkletNode) {
      try {
        const code = document.getElementById('pitch-core').textContent + '\n' + WORKLET_PROC;
        const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        this.node = new AudioWorkletNode(ctx, 'vc-processor', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1 });
        this.node.port.onmessage = (e) => this._onMsg(e.data);
        this.mode = 'AudioWorklet';
        ok = true;
      } catch (e) { console.warn('AudioWorklet unavailable, using fallback', e); }
    }
    if (!ok) {
      const sp = ctx.createScriptProcessor(1024, 1, 1);
      const tracker = new PCTracker(ctx.sampleRate);
      let base = -1, n = 0;
      sp.onaudioprocess = (ev) => {
        const ch = ev.inputBuffer.getChannelData(0);
        if (base < 0) base = ev.playbackTime != null ? ev.playbackTime - ch.length / ctx.sampleRate : ctx.currentTime;
        const out = [];
        tracker.push(ch, (t, f, c, r, h, te) => out.push(base + t, f, c, r, h, base + te));
        if (out.length) this._onMsg({ type: 'frames', d: out });
        if (this.recording) this._onMsg({ type: 'audio', t0: base + n / ctx.sampleRate, d: new Float32Array(ch) });
        n += ch.length;
      };
      this.node = sp;
      this.mode = 'ScriptProcessor';
    }
    this.src.connect(this.node);
    this.node.connect(this.sink);
    this.micOn = true;
    this.floor = 0.002; this.hist = []; this.lastSmoothed = null;
    this.acquireWake();
  },

  stopMic() {
    if (!this.micOn) return;
    try { this.src.disconnect(); this.node.disconnect(); this.sink.disconnect(); if (this._an) this._an.disconnect(); } catch (e) {}
    this._an = null;
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    this.stream = null; this.node = null; this.micOn = false; this.recording = false;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    this.releaseWake();
  },

  analyser() {
    if (!this.micOn) return null;
    if (!this._an || this._anSrc !== this.src) {
      this._an = this.ctx.createAnalyser(); this._an.fftSize = 16384; this._an.smoothingTimeConstant = 0;
      this.src.connect(this._an); this._an.connect(this.sink); this._anSrc = this.src;
    }
    return this._an;
  },
  onFrame(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },

  _onMsg(m) {
    if (m.type === 'audio') { if (this.recording) this.recChunks.push({ t0: m.t0, d: m.d }); return; }
    const d = m.d;
    for (let i = 0; i < d.length; i += 6) this._frame(d[i], d[i + 1], d[i + 2], d[i + 3], d[i + 4], d[i + 5]);
  },

  // Voicing gate + light smoothing. A frame counts as sung pitch only when it is periodic (clarity),
  // above the adaptive noise floor and inside the human singing range.
  _frame(t, f, c, rms, hf, te) {
    const voicedRaw = f > 0 && c >= (this.minClarity || 0.8) && rms > Math.max(0.0035, this.floor * 3);
    if (!voicedRaw) {
      // track the background level from unvoiced frames
      this.floor = rms < this.floor ? this.floor * 0.9 + rms * 0.1 : this.floor * 0.995 + rms * 0.005;
    }
    this.level = this.level * 0.7 + Math.min(1, rms * 8) * 0.3;
    let midi = null;
    if (voicedRaw) {
      const raw = pcFreqToMidi(f, Store.a4());
      this.hist.push(raw);
      if (this.hist.length > 3) this.hist.shift();
      // median of the last 3 voiced frames removes single-frame octave slips
      if (this.hist.length === 3) {
        const s = this.hist.slice().sort((a, b) => a - b);
        midi = s[1];
      } else midi = raw;
    } else this.hist = [];
    const fr = { t, f, c, rms, midi, voiced: midi != null, hf: hf || 0, te: te == null ? t : te };
    this.listeners.forEach((fn) => fn(fr));
  },

  startRecording() { this.recChunks = []; this.recording = true; if (this.node && this.node.port) this.node.port.postMessage({ type: 'rec', on: true }); },
  stopRecording() {
    this.recording = false;
    if (this.node && this.node.port) this.node.port.postMessage({ type: 'rec', on: false });
    const ch = this.recChunks; this.recChunks = [];
    if (!ch.length) return null;
    const len = ch.reduce((s, c) => s + c.d.length, 0);
    const out = new Float32Array(len);
    let o = 0;
    for (const c of ch) { out.set(c.d, o); o += c.d.length; }
    return { samples: out, sr: this.ctx.sampleRate, t0: ch[0].t0 };
  },

  // Estimated round trip between a scheduled sound and the matching sung sound arriving back.
  latency() { const cal = Store.data && Store.data.profile.latency; if (cal != null) return cal; const c = this.ctx; if (!c) return 0.05; return (c.baseLatency || 0.01) + (c.outputLatency || 0.02) + 0.015; },

  // ---------- reference synth ----------
  _wave: null,
  wave() {
    if (this._wave) return this._wave;
    const soft = Store.data.profile.tone !== 'pure';
    const amps = soft ? [0, 1, 0.55, 0.32, 0.2, 0.12, 0.07, 0.05, 0.03] : [0, 1];
    const real = new Float32Array(amps.length), imag = new Float32Array(amps);
    this._wave = this.ctx.createPeriodicWave(real, imag);
    return this._wave;
  },
  resetWave() { this._wave = null; },

  note(midi, when, dur, vel = 0.32) {
    const ctx = this.ctx;
    const t = Math.max(when, ctx.currentTime + 0.005);
    const osc = ctx.createOscillator();
    osc.setPeriodicWave(this.wave());
    osc.frequency.value = pcMidiToFreq(midi, Store.a4());
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + 0.04);
    g.gain.setTargetAtTime(vel * 0.8, t + 0.08, 0.2);
    const end = t + Math.max(0.12, dur);
    g.gain.setValueAtTime(vel * 0.8, end - 0.06);
    g.gain.linearRampToValueAtTime(0, end);
    if (dur > 0.6) {
      // gentle vibrato on longer demo notes, like a sung model
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.2; lg.gain.value = osc.frequency.value * 0.004;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(t + 0.35); lfo.stop(end);
      this.scheduled.push(lfo);
    }
    osc.connect(lp); lp.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(end + 0.02);
    this.scheduled.push(osc);
    osc.onended = () => { const i = this.scheduled.indexOf(osc); if (i >= 0) this.scheduled.splice(i, 1); };
    return end;
  },

  click(when, accent) {
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * 0.03);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = accent ? 3800 : 2800; bp.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.value = accent ? 0.9 : 0.55;
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(Math.max(when, ctx.currentTime));
    this.scheduled.push(s);
  },

  // notes: [{midi, start (s, relative), dur (s), lyric}]
  playSeq(notes, at, opts) {
    opts = opts || {};
    if ((Store.data.profile.tone || 'voice') === 'voice' && !opts.plain) {
      const nodes = vxRender(this.ctx, this.master, notes.filter((n) => n.midi != null), at, { a4: Store.a4(), glide: opts.glide, vowel: opts.vowel, voice: opts.voice || coachSingVoice() });
      this.scheduled.push(...nodes.nodes);
      return nodes.end;
    }
    let end = at;
    for (const n of notes) if (n.midi != null) end = Math.max(end, this.note(n.midi, at + n.start, n.dur * 0.94));
    return end;
  },

  playSamples(data, when, gain = 0.8) {
    const ctx = this.ctx;
    const b = ctx.createBuffer(1, data.length, ctx.sampleRate);
    b.getChannelData(0).set(data);
    const s = ctx.createBufferSource(); s.buffer = b;
    const g = ctx.createGain(); g.gain.value = gain;
    s.connect(g); g.connect(this.master);
    s.start(Math.max(when, ctx.currentTime));
    this.scheduled.push(s);
    s.onended = () => { const i = this.scheduled.indexOf(s); if (i >= 0) this.scheduled.splice(i, 1); };

// Turns any decoded audio file into the same frame stream the microphone produces.
async function analyzeFile(file) {
  await Engine.ensure();
  const ab = await file.arrayBuffer();
  const buf = await new Promise((res, rej) => {
    const p = Engine.ctx.decodeAudioData(ab, res, rej);
    if (p && p.then) p.then(res, rej);
  });
  const sr = buf.sampleRate;
  const mono = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  // normalise quiet phone recordings so the voicing gate behaves like live input
  let peak = 0;
  for (let i = 0; i < mono.length; i++) peak = Math.max(peak, Math.abs(mono[i]));
  if (peak > 0 && peak < 0.5) { const g = 0.5 / peak; for (let i = 0; i < mono.length; i++) mono[i] *= g; }
  const tracker = new PCTracker(sr);
  const frames = [];
  let floor = 0.002, hist = [];
  tracker.push(mono, (t, f, c, rms, hf, te) => {
    const v = f > 0 && c >= 0.8 && rms > Math.max(0.0035, floor * 3);
    if (!v) floor = rms < floor ? floor * 0.9 + rms * 0.1 : floor * 0.995 + rms * 0.005;
    let midi = null;
    if (v) {
      hist.push(pcFreqToMidi(f, Store.a4())); if (hist.length > 3) hist.shift();
      midi = hist.length === 3 ? hist.slice().sort((a, b) => a - b)[1] : hist[hist.length - 1];
    } else hist = [];
    frames.push({ t, f, c, rms, midi, voiced: midi != null, hf, te });
  });
  return { frames, rec: { samples: mono, sr, t0: 0 }, duration: mono.length / sr };
}

  ah: [[800, 80], [1150, 90], [2900, 120]], aa: [[800, 80], [1150, 90], [2900, 120]], la: [[800, 80], [1150, 90], [2900, 120]],
  ee: [[300, 60], [2300, 100], [3000, 120]], eh: [[530, 70], [1840, 100], [2480, 120]], nay: [[530, 70], [1840, 100], [2480, 120]],
  oh: [[450, 70], [800, 80], [2830, 120]], oo: [[325, 60], [870, 80], [2240, 110]],

function vxVowelOf(lyric, fallback) {
  const l = String(lyric || '').toLowerCase();
  if (l === 'mm' || l === 'hum' || l === 'ng') return 'mm';
  if (l.startsWith('br') || l === 'trill') return 'brrr';

  const r = rangeOf();
  const lo = Math.min(...offsets), hi = Math.max(...offsets), span = hi - lo;

      return { mode: 'seq', legato: true, bpm: 72, tol: TOL[Math.max(0, l - 2)] + 10, phrases: [phraseFrom([5, 4, 3, 2, 1], top - 7, 1, 'oo'), phraseFrom([1, 2, 3, 2, 1], bot, 1, 'ah')] }; } },
];
EXERCISES.push(

// Turn beats into seconds for one phrase.
function timePhrase(phrase, bpm) {
  const spb = 60 / bpm;
  let t = 0;
  return phrase.map((n) => { const o = { midi: n.midi, start: t, dur: n.beats * spb, lyric: n.lyric }; t += n.beats * spb; return o; });
}
