// Mastery criteria for vocal exercises, judged on one attempt's measurements.
function vocalPass(exId, res) {
  const s = res.summary, sung = res.notes.filter((n) => !n.missed);
  const missed = s.total ? s.missed / s.total : 1;
  const within = (c) => sung.filter((n) => Math.abs(n.median) <= c).length / Math.max(1, res.notes.length);
  switch (exId) {
    case 'match': return missed === 0 && within(25) >= 0.8;
    case 'sustain': case 'breath': {
      const su = sung.map((n) => n.sustain).filter(Boolean);
      return missed === 0 && within(30) >= 0.8 && su.every((x) => x.shortBy < 0.4 && Math.abs(x.endDelta) <= 20 && x.wobble <= 15) && !res.gaps;
    }
    case 'vibrato': return sung.some((n) => n.sustain && n.sustain.vibrato && n.sustain.vibrato.extent >= 30 && n.sustain.vibrato.extent <= 140);
    case 'echo': return missed === 0 && within(50) === 1;
    case 'warm-hum': case 'lip-trill': case 'straw': return missed <= 0.1 && s.accuracy >= 65;
    case 'mix': case 'transition': case 'head': return res.breaks.length === 0 && s.accuracy >= 70 && missed <= 0.1;
    default: return missed <= 0.1 && s.accuracy >= 80 && res.breaks.length === 0 && sung.every((n) => Math.abs(n.median) <= 40);
  }
}

// What went wrong, most important first. Each issue has a stable key (to spot repeats) and a type (to spot technique patterns).
function vocalIssues(res, cfg) {
  const out = [];
  const r = typeof rangeOf === 'function' ? rangeOf() : { low: 48, high: 67 };
  const topCut = r.low + (r.high - r.low) * 0.66;
  const sungN = res.notes.filter((n) => !n.missed);
  if (sungN.length >= 3) {
    const flat = sungN.filter((n) => n.median < -20).length / sungN.length, sharp = sungN.filter((n) => n.median > 20).length / sungN.length;
    const bias = res.summary.bias;
    if (flat >= 0.7 && bias <= -20) out.push({ key: 'bias:flat', type: 'flat', cents: bias, sev: 3.5 });
    if (sharp >= 0.7 && bias >= 20) out.push({ key: 'bias:sharp', type: 'sharp', cents: bias, sev: 3.5 });
  }
  res.notes.forEach((n, i) => {
    if (n.missed) { out.push({ key: 'missed:' + i, type: 'missed', note: n.midi, i, sev: 3 }); return; }
    const e = n.median;
    if (Math.abs(e) >= 100) out.push({ key: 'wrong:' + i, type: 'wrong-note', note: n.midi, i, cents: e, sev: 4 });
    else if (Math.abs(e) > Math.max(25, (cfg && cfg.tol) || 30)) out.push({ key: (e < 0 ? 'flat:' : 'sharp:') + n.midi, type: (e < 0 ? 'flat' : 'sharp') + (n.midi >= topCut ? '-high' : ''), note: n.midi, i, cents: e, sev: 2 + Math.min(1, Math.abs(e) / 80) });
    if (n.onset != null && n.onset - e < -40) out.push({ key: 'scoop', type: 'scoop', note: n.midi, i, sev: 1.5 });
    if (n.sustain) {
      if (n.sustain.endDelta <= -25) out.push({ key: 'sag:' + n.midi, type: 'sag', note: n.midi, i, cents: n.sustain.endDelta, sev: 2.2 });
      if (n.sustain.shortBy >= 0.4) out.push({ key: 'short:' + n.midi, type: 'breath-short', note: n.midi, i, sev: 2.1 });
      if (n.sustain.wobble > 18) out.push({ key: 'wobble:' + n.midi, type: 'wobble', note: n.midi, i, sev: 1.8 });
    }
  });
  res.breaks.forEach((b) => out.push({ key: 'break:' + b.from + '-' + b.to, type: 'break', note: b.to, sev: 2.6 }));
  if (res.gaps) out.push({ key: 'breath-gap', type: 'breath-short', sev: 2.3 });
  return out.sort((a, b) => b.sev - a.sev);
}

// Is the overall shape wrong while each note is steady? (e.g. going up where the pattern goes down)
function vocalShapeWrong(res) {
  const sung = res.notes.filter((n) => !n.missed);
  if (sung.length < 3) return false;
  let mism = 0, steps = 0;
  for (let i = 1; i < sung.length; i++) {
    const want = Math.sign(sung[i].midi - sung[i - 1].midi), got = Math.sign(sung[i].midi + sung[i].median / 100 - (sung[i - 1].midi + sung[i - 1].median / 100));
    if (want === 0) continue;
    steps++;
    if (got !== want) mism++;
  }
  const steady = sung.every((n) => (n.std || 0) < 30);
  const wrong = sung.filter((n) => Math.abs(n.median) >= 100).length;
  return steady && steps >= 2 && mism / steps >= 0.5 && wrong >= sung.length / 2;
}

const Teach = {
  d() {
    const D = Store.data;
    if (!D.teach) D.teach = {};
    const t = D.teach;
    t.skills = t.skills || {}; t.log = t.log || []; t.profile = t.profile || {};
    return t;
  },
  today(ts) { const d = new Date(ts || Date.now()); return d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate(); },
  skill(id) {
    const t = this.d();
    return t.skills[id] || { state: 'new', streak: 0, fails: 0, attempts: 0, passes: 0, securedDay: null, idx: -1, due: null, last: null, best: null };
  },
  // Record one judged attempt. Returns {before, after, event} where event marks a milestone.
  record(id, pass, opts) {
    opts = opts || {};
    const t = this.d(), now = opts.now || Date.now(), today = this.today(now);
    const s = { ...this.skill(id) };
    const before = s.state;
    s.attempts++; s.last = now;
    if (opts.score != null) s.best = Math.max(s.best || 0, opts.score);
    let event = null;
    const isReview = s.state === 'mastered' && s.due != null && now >= s.due - DAY / 2;
    if (pass) {
      s.passes++; s.streak++; s.fails = 0;
      if ((s.state === 'new' || s.state === 'learning') && s.streak >= (opts.need || 2)) { s.state = 'secure'; s.securedDay = today; event = 'secure'; }
      else if (s.state === 'secure' && today !== s.securedDay) { s.state = 'mastered'; s.idx = 0; s.due = now + REVIEW_DAYS[0] * DAY; event = 'mastered'; }
      else if (s.state === 'mastered' && isReview) { s.idx = Math.min(REVIEW_DAYS.length - 1, s.idx + 1); s.due = now + REVIEW_DAYS[s.idx] * DAY; event = 'reviewed'; }
      else if (s.state === 'new') s.state = 'learning';
    } else {
      s.streak = 0; s.fails++;
      if (s.state === 'new') s.state = 'learning';
      if (s.state === 'mastered' && isReview) { s.state = 'learning'; s.idx = -1; s.due = null; event = 'review-failed'; }
      else if (s.state === 'secure' && s.fails >= 2) { s.state = 'learning'; event = 'slipped'; }
    }
    t.skills[id] = s;
    return { before, after: s.state, event, skill: s };
  },
  logAttempt(entry) {
    const t = this.d();
    t.log.push({ ts: Date.now(), ...entry });
    if (t.log.length > 400) t.log.splice(0, t.log.length - 400);
  },
  // history: previous attempts at the same exercise in this sitting, oldest first: [{issues:[{key,type}], pass, score}]
  classify(cur, history, opts) {
    opts = opts || {};
    const prev = history.slice(-2);
    const last = history[history.length - 1];
    if (cur.strain) return { kind: 'toohard', reason: 'strain' };
    if (cur.missedFrac > 0.5) return { kind: 'toohard', reason: 'missed' };
    if (cur.shapeWrong) return { kind: 'misread', reason: 'shape' };
    if (cur.wrongFrac > 0.5) return { kind: 'toohard', reason: 'far-off' };
    if (cur.pass) {
      if (last && !last.pass) return { kind: 'improved', reason: 'now-passing', fixed: (last.issues[0] || {}).key };
      if (last && last.pass) return { kind: 'progress', reason: 'two-in-a-row' };
      return { kind: 'improved', reason: 'first-pass' };
    }
    const main = cur.issues[0];
    if (!main) return { kind: 'oneoff', reason: 'below-criterion' };
    const sameBefore = prev.filter((h) => h.issues.some((x) => x.key === main.key)).length;
    if (sameBefore >= 1) return { kind: 'repeated', issue: main };
    // same kind of problem in other exercises recently → a technique pattern, not this exercise
    const recent = (opts.log || []).filter((l) => l.ts > (opts.now || Date.now()) - 14 * DAY && l.ex !== opts.ex);
    const exWith = new Set(recent.filter((l) => (l.types || []).includes(main.type)).map((l) => l.ex));
    if (exWith.size >= 2 && TECHNIQUE_FIX[main.type]) return { kind: 'technique', issue: main, exercises: [...exWith] };
    if (last && last.issues[0] && last.issues[0].key !== main.key && cur.score >= (last.score || 0) + 8) return { kind: 'improved', reason: 'partial', fixed: last.issues[0].key, issue: main };
    return { kind: 'oneoff', issue: main };
  },
  intervention(cls) {
    switch (cls.kind) {
      case 'oneoff': return { action: 'retry' };
      case 'repeated': return { action: 'isolate' };
      case 'technique': return { action: 'switch', to: TECHNIQUE_FIX[cls.issue.type] };
      case 'toohard': return { action: 'simplify' };
      case 'misread': return { action: 'redemo' };
      case 'improved': return cls.reason === 'partial' ? { action: 'retry' } : { action: 'verify' };
      case 'progress': return { action: 'progress' };
    }
    return { action: 'retry' };
  },
  due(prefix, now) {
    now = now || Date.now();
    return Object.entries(this.d().skills).filter(([id, s]) => id.startsWith(prefix) && s.state === 'mastered' && s.due && s.due <= now).map(([id]) => id);
  },
  // Most frequent recent issue type (for the "fix" slot of a lesson)
  topIssue(prefix, now) {
    now = now || Date.now();
    const counts = {};
    this.d().log.filter((l) => l.ts > now - 14 * DAY && (l.skill || '').startsWith(prefix)).forEach((l) => (l.types || []).slice(0, 2).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const top = Object.entries(counts).filter(([t]) => TECHNIQUE_FIX[t]).sort((a, b) => b[1] - a[1])[0];
    return top && top[1] >= 2 ? top[0] : null;
  },
  nextNew(skills, now) {
    return skills.find((k) => this.skill(k.id).state === 'new' && k.pre.every((p) => ['secure', 'mastered'].includes(this.skill(p).state)))
      || skills.find((k) => ['new', 'learning'].includes(this.skill(k.id).state) && k.pre.every((p) => this.skill(p).state !== 'new'));
  },
  // Plan a vocal lesson: [{slot, ex, why}]
  planVocal(minutes, focus, now) {
    const all = Object.values(VSKILL), items = [], used = new Set();
    const push = (slot, ex, why) => { if (!ex || used.has(ex)) return; used.add(ex); items.push({ slot, ex, why }); };
    if (minutes >= 8) push('warmup', this.skill('v-trill').state === 'new' ? 'warm-hum' : (new Date(now || Date.now()).getDate() % 2 ? 'lip-trill' : 'warm-hum'), 'warm-up');
    if (focus && FOCUS[focus]) FOCUS[focus].forEach((ex) => push('focus', ex, 'you asked to work on ' + FOCUS_LABEL[focus]));
    const issue = this.topIssue('v-', now);
    if (issue) push('fix', TECHNIQUE_FIX[issue], 'recurring: ' + ISSUE_LABEL[issue]);
    if (minutes >= 15) this.due('v-', now).slice(0, 1).forEach((id) => push('review', VSKILL[id].ex, 'review of ' + VSKILL[id].name));
    const nn = this.nextNew(all, now);
    if (nn) push('new', nn.ex, 'next skill: ' + nn.name);
    if (minutes >= 5) push('music', 'echo', 'use it in music');
    const cap = minutes <= 5 ? 2 : minutes <= 10 ? 3 : minutes <= 20 ? 5 : 7;
    return items.slice(0, cap);
  },
};

// Which exercise addresses which kind of recurring problem
const TECHNIQUE_FIX = { 'flat-high': 'mix', 'sharp-high': 'head', flat: 'match', sharp: 'match', scoop: 'match', sag: 'sustain', 'breath-short': 'breath', wobble: 'sustain', break: 'transition', 'wrong-note': 'echo' };
const ISSUE_LABEL = { 'flat-high': 'flat on higher notes', 'sharp-high': 'sharp on higher notes', flat: 'singing flat', sharp: 'singing sharp', scoop: 'sliding into notes', sag: 'pitch sagging at the end of long notes', 'breath-short': 'running out of breath', wobble: 'unsteady held notes', break: 'voice breaks', 'wrong-note': 'wrong notes in melodies', missed: 'notes not heard' };
const FOCUS = { high: ['lip-trill', 'head', 'mix'], low: ['chest', 'sustain'], breath: ['sustain', 'breath'], pitch: ['match', 'scale', 'intervals'], runs: ['scale', 'agility'], vibrato: ['sustain', 'vibrato'], breaks: ['lip-trill', 'transition', 'mix'], song: ['echo'] };
const FOCUS_LABEL = { high: 'your high notes', low: 'your low notes', breath: 'breath control', pitch: 'pitch accuracy', runs: 'runs and agility', vibrato: 'vibrato', breaks: 'smoother register changes', song: 'melodies' };
function focusFromText(t) {
  t = String(t || '').toLowerCase();
  if (/high note|upper|higher|top of my range|head voice|falsetto/.test(t)) return 'high';
  if (/low note|lower range|chest/.test(t)) return 'low';
  if (/breath|run out of air|long notes|sustain/.test(t)) return 'breath';
  if (/pitch|in tune|out of tune|flat|sharp/.test(t)) return 'pitch';
  if (/runs?\b|riffs?\b|agility|melisma/.test(t)) return 'runs';
  if (/vibrato/.test(t)) return 'vibrato';
  if (/break|crack|flip|passaggio|bridge|mix/.test(t)) return 'breaks';
  if (/song|melody/.test(t)) return 'song';
  return null;
}

// ===================== Coach: feedback, weaknesses, lesson planning, AI =====================
const nm = (m) => pcName(m);
const c$ = (x) => Math.round(Math.abs(x)) + '¢';
const fmtMs = (s) => Math.round(s * 1000) + ' ms';

function coachTips(res, ex, extra = {}) {
  const tips = [];
  const s = res.summary;
  const sungAll = res.notes.filter((n) => !n.missed);
  const wrong = sungAll.filter((n) => Math.abs(n.median) >= 100);
  const sung = sungAll.filter((n) => Math.abs(n.median) < 100);
  const r = rangeOf();
  const add = (p, kind, h, b) => tips.push({ p, kind, h, b });

  if (s.total && s.missed / s.total >= 0.4) {
    add(100, '', `I couldn’t hear you on ${s.missed} of ${s.total} notes`, 'Hold the phone 20–30 cm from your mouth, sing at a medium volume, and start right on the beat after the count-in. If you are in a noisy room, move somewhere quieter.');
  }
  if (wrong.length) {
    const w = wrong[0], semi = Math.round(w.median / 100), got = w.midi + semi;
    add(90, semi < 0 ? 'flat' : 'sharp', wrong.length === 1 ? `On ${nm(w.midi)} you sang ${nm(got)} instead` : `${wrong.length} notes landed on the wrong pitch (e.g. ${nm(got)} instead of ${nm(w.midi)})`,
      `That’s ${Math.abs(semi)} semitone${Math.abs(semi) > 1 ? 's' : ''} ${semi < 0 ? 'low' : 'high'}. Replay the demo, hum the target quietly to find it, then sing. If the note feels out of reach, take the range test so exercises sit where your voice is comfortable.`);
  }
  if (!sung.length) return tips;

  const oct = sung.filter((n) => n.octave);
  if (oct.length) add(20, '', `You sang ${oct.length === 1 ? 'one note' : oct.length + ' notes'} an octave ${oct[0].octave < 0 ? 'lower' : 'higher'} than the guide`, 'That’s fine. Scoring compares the pitch itself. If the guide notes sit awkwardly for you, take the range test so exercises match your voice.');

  // overall bias
  const topCut = r.low + (r.high - r.low) * 0.66;
  const high = sung.filter((n) => n.midi >= topCut), rest = sung.filter((n) => n.midi < topCut);
  const hiBias = high.length ? median(high.map((n) => n.median)) : null;
  const loBias = rest.length ? median(rest.map((n) => n.median)) : null;
  let biasHandled = false;
  if (hiBias != null && high.length >= 1 && hiBias <= -20 && (loBias == null || hiBias - loBias <= -15)) {
    biasHandled = true;
    add(80, 'flat', `Your higher notes (${[...new Set(high.map((n) => nm(n.midi)))].join(', ')}) run about ${c$(hiBias)} flat`, 'Take a fuller, low breath before the phrase and keep the air moving into the top note. Keep the jaw loose and think of the sound moving up and forward. Get lighter as you go up rather than pushing from the throat.');
  } else if (hiBias != null && hiBias >= 20 && (loBias == null || hiBias - loBias >= 15)) {
    biasHandled = true;
    add(78, 'sharp', `You’re overshooting the higher notes by about ${c$(hiBias)}`, 'Reaching for high notes usually adds pressure and pulls the pitch sharp. Aim to arrive at the note, not above it: sing those notes slightly softer and keep the chin level.');
  }
  if (!biasHandled && sung.length >= 3 && s.bias != null && Math.abs(s.bias) >= 12 && s.accuracy < 88) {
    if (s.bias < 0) add(75, 'flat', `You’re settling about ${c$(s.bias)} flat on most notes`, 'Flat singing usually means the sound is under-energised, not that you need to push. Imagine each note a touch higher than you think, lift the soft palate (the start of a yawn) and keep the air flowing to the end of every note.');
    else add(75, 'sharp', `You’re landing about ${c$(s.bias)} sharp on most notes`, 'Sharpness often comes from too much air pressure or tension. Sing a little softer, relax the tongue and jaw, and let the note settle rather than reaching for it.');
  }
  // the single worst note
  const worst = sung.slice().sort((a, b) => Math.abs(b.median) - Math.abs(a.median))[0];
  if (worst && Math.abs(worst.median) >= 30 && !(biasHandled && worst.midi >= topCut)) {
    const dir = worst.median < 0 ? 'flat' : 'sharp';
    const lyr = worst.lyric && !['ah', 'la', 'oo', 'brrr', 'mm', 'nay'].includes(worst.lyric) ? ` (“${worst.lyric}”)` : '';
    const fix = dir === 'flat'
      ? 'Sing it again and imagine lifting the sound slightly as you start. Keep your jaw relaxed and avoid pushing from your throat.'
      : 'Sing it again a little softer and let it settle down onto the pitch. Relax the jaw and don’t reach up with the chin.';
    add(70, dir, `You sang ${nm(worst.midi)}${lyr} about ${c$(worst.median)} ${dir}`, fix);
  }
  // onset
  if (s.scoop != null && s.scoop <= -35) add(65, 'flat', `You’re sliding up into notes (starting ~${c$(s.scoop)} low)`, 'Hear the pitch in your head first, then start directly on it. A soft “h” or “n” before the vowel helps you begin on the note instead of scooping up to it.');
  else if (s.scoop != null && s.scoop >= 35) add(60, 'sharp', `Notes start ~${c$(s.scoop)} high, then fall into place`, 'You’re overshooting the start. Begin the note gently and lightly, then let it bloom; don’t attack it from above.');

  // steadiness and sustain
  const long = sung.filter((n) => n.sustain);
  for (const n of long) {
    const su = n.sustain;
    if (su.vibrato) add(15, 'good', `Natural vibrato on ${nm(n.midi)} (${su.vibrato.rate.toFixed(1)} Hz, ±${Math.round(su.vibrato.extent / 2)}¢)`, 'A regular vibrato at this speed is a sign of a relaxed, well-supported tone. Keep it — don’t try to force it on shorter notes.');
    if (su.endDelta <= -25) add(68, 'flat', `${nm(n.midi)} sagged ${c$(su.endDelta)} flat by the end`, 'That’s support fading as the air runs low. As the note goes on, keep the ribs wide and slightly increase the breath energy rather than letting it drop. Shorter, well-supported notes beat long sagging ones.');
    else if (su.endDelta >= 25) add(60, 'sharp', `${nm(n.midi)} crept ${c$(su.endDelta)} sharp as you held it`, 'Pressure is building through the note. Keep the volume steady instead of squeezing more air out at the end.');
    if (su.shortBy >= 0.4) add(66, '', `You stopped ${su.shortBy.toFixed(1)} s before the end of ${nm(n.midi)}`, 'You likely ran out of air. Breathe in low (belly and sides) during the count-in, start at a medium volume, and release the air slowly like fogging a mirror.');
    if (su.loudSlope <= -2.5 && su.span > 2) add(55, '', `Your volume faded ${Math.round(-su.loudSlope * su.span)} dB across ${nm(n.midi)}`, 'Pace the breath so the end of the note is as strong as the start. Imagine the sound travelling to the far side of the room the whole time.');
    if (su.gaps >= 2) add(58, '', `The sound broke up ${su.gaps} times on ${nm(n.midi)}`, 'Keep a continuous, steady flow of air. If your voice is dropping out on a long note, try it slightly louder and on an “oo” vowel.');
  }
  if (s.stability != null && s.stability > 18) {
    const shaky = sung.filter((n) => n.dur >= 0.4).sort((a, b) => (b.sustain ? b.sustain.wobble : b.std) - (a.sustain ? a.sustain.wobble : a.std))[0];
    add(62, '', `Pitch wavers while holding notes (about ±${Math.round(s.stability)}¢${shaky ? ', most on ' + nm(shaky.midi) : ''})`, 'Steady the breath: a slow, even exhale with the ribs staying open. Singing slightly softer often steadies the pitch straight away. Keep the jaw still.');
  }

  // register breaks
  if (res.breaks.length) {
    const b = res.breaks[0];
    const where = b.from === b.to ? `on ${nm(b.from)}` : `between ${nm(Math.min(b.from, b.to))} and ${nm(Math.max(b.from, b.to))}`;
    add(72, '', `Your voice ${b.kind === 'gap' ? 'dropped out' : b.kind === 'crack' ? 'cracked' : 'flipped'} ${where}${res.breaks.length > 1 ? ` (${res.breaks.length} times)` : ''}`, 'That’s likely your register transition. Sing that phrase on “oo” or a lip trill and a bit softer, and let the voice lighten just before the break instead of carrying the heavy sound up.');
  }

  // intervals
  const up = res.intervals.filter((i) => i.semis >= 5), down = res.intervals.filter((i) => i.semis <= -5);
  if (up.length >= 1 && median(up.map((i) => i.err)) <= -25) add(57, 'flat', `Upward leaps land short by about ${c$(median(up.map((i) => i.err)))}`, 'Think of the top note before you leave the bottom one, and aim for the top of it. Keep the breath moving through the leap instead of stopping and re-starting.');
  if (down.length >= 1 && median(down.map((i) => i.err)) <= -25) add(54, 'flat', `Downward leaps fall too far (by ~${c$(median(down.map((i) => i.err)))})`, 'Keep the lower note bright and lifted. Think of it as “up high, just lower” rather than dropping down to it.');
  if (up.length >= 1 && median(up.map((i) => i.err)) >= 25) add(54, 'sharp', `Upward leaps overshoot by about ${c$(median(up.map((i) => i.err)))}`, 'You’re reaching past the note. Land on it gently and lighter.');

  // tone
  if (s.hnr != null && s.hnr < 11) add(50, '', 'Your tone has a lot of air in it', `Measured clarity is low (about ${Math.round(s.hnr)} dB of tone above noise; background noise lowers this too). Try a hum on “ng”, feel the buzz, then open to “ah” keeping that buzz. Sing a little fuller rather than whispery.`);
  // strain: on the top notes, clarity drops well below your lower notes AND pitch control slips
  const lowerN = sung.filter((n) => n.midi < r.high - 2 && n.hnr != null);
  if (lowerN.length >= 2) {
    const baseH = median(lowerN.map((n) => n.hnr));
    const baseA = median(lowerN.filter((n) => n.tone).map((n) => n.tone.alpha));
    const strained = sung.filter((n) => n.midi >= r.high - 2 && n.hnr != null && baseH - n.hnr > 6 && (Math.abs(n.median) > 20 || n.std > 25 || (n.tone && baseA != null && n.tone.alpha > baseA + 10)));
    if (strained.length) add(85, 'sharp', `Signs of strain on ${strained.map((n) => nm(n.midi)).join(', ')}`, 'The tone got rougher and the pitch less steady than on your lower notes. Sing those notes softer with the jaw relaxed. If your throat feels tight or scratchy, stop and rest — never push through discomfort.');
  }

  // timing
  if (ex && ex.mode === 'seq' && s.timing != null && s.timing > 0.2) add(45, '', `You’re coming in about ${fmtMs(s.timing)} late`, 'Breathe in on the last count-in click so you’re ready to sing exactly on the next beat.');

  // vowel consistency
  if (extra.vowelPhrase) {
    const byV = {};
    sung.forEach((n) => { if (n.lyric) (byV[n.lyric] = byV[n.lyric] || []).push(n.median); });
    const v = Object.entries(byV).map(([k, a]) => [k, median(a)]).sort((a, b) => a[1] - b[1]);
    if (v.length >= 3 && v[v.length - 1][1] - v[0][1] >= 25) add(64, '', `Pitch shifts with the vowel: “${v[0][0]}” is ${c$(v[0][1])} ${v[0][1] < 0 ? 'flat' : 'sharp'}, “${v[v.length - 1][0]}” ${c$(v[v.length - 1][1])} ${v[v.length - 1][1] < 0 ? 'flat' : 'sharp'}`, 'Change only the lips and jaw, not the breath. Keep the tongue tip against the bottom teeth for every vowel, and keep “oo” and “oh” as bright as “ee”.');
  }
  if (extra.breathGaps) add(63, '', `You stopped ${extra.breathGaps} time${extra.breathGaps > 1 ? 's' : ''} mid-phrase`, 'Aim to get through on one breath. Breathe low during the count-in, start at a medium (not big) volume, and spend the air evenly. Shorten the target by dropping the difficulty if needed.');

  if (s.accuracy >= 85 && !tips.some((t) => t.p >= 50)) add(10, 'good', 'Accurate and steady', s.accuracy >= 92 ? 'Clean work. The app will raise the difficulty next time.' : 'Good control. Repeat once more to lock it in.');
  tips.sort((a, b) => b.p - a.p);
  const good = tips.filter((t) => t.kind === 'good');
  const top = tips.filter((t) => t.kind !== 'good').slice(0, 4);
  return [...top, ...good.slice(0, 1)];
}

// ---------- weaknesses from history ----------
function weaknessModel() {
  const S = Store.data.sessions.filter((s) => s.summary).slice(-40);
  const areas = [];
  if (!S.length) return areas;
  const acc = mean(S.map((s) => s.summary.accuracy).filter((x) => x != null));
  if (acc != null) areas.push({ key: 'pitch', score: acc, ex: 'match', label: 'Pitch accuracy', text: `Notes land within tolerance ${Math.round(acc)}% of the time.` });
  const hi = [];
  const r = rangeOf();
  for (const [k, v] of Object.entries(Store.data.noteStats)) if (+k >= r.low + (r.high - r.low) * 0.66 && v.n >= 2) hi.push(v.err / v.n);
  if (hi.length) { const b = mean(hi); areas.push({ key: 'high', score: 100 - Math.min(100, Math.abs(b) * 2.2), ex: Math.abs(b) > 0 && b < 0 ? 'head' : 'mix', label: 'Higher notes', text: `Your upper notes average ${Math.round(b)}¢ ${b < 0 ? 'flat' : 'sharp'}.` }); }
  const stab = S.map((s) => s.summary.stability).filter((x) => x != null);
  if (stab.length) { const m = mean(stab); areas.push({ key: 'stability', score: 100 - Math.min(100, m * 3), ex: 'sustain', label: 'Steady pitch', text: `Held notes waver about ±${Math.round(m)}¢.` }); }
  const br = S.filter((s) => s.exId && (EX[s.exId] || {}).group === 'Registers' || s.exId === 'arpeggio');
  if (br.length) { const m = mean(br.map((s) => s.summary.breaks || 0)); areas.push({ key: 'breaks', score: 100 - Math.min(100, m * 35), ex: 'transition', label: 'Register transitions', text: m >= 0.5 ? `About ${m.toFixed(1)} breaks per register exercise.` : 'Transitions are mostly smooth.' }); }
  const sus = S.filter((s) => s.exId === 'sustain' || s.exId === 'breath');
  if (sus.length) { const m = mean(sus.map((s) => s.summary.score)); areas.push({ key: 'breath', score: m, ex: 'breath', label: 'Breath & sustain', text: `Long-tone exercises average ${Math.round(m)}.` }); }
  const ag = S.filter((s) => s.exId === 'agility' || s.exId === 'arpeggio');
  if (ag.length) { const m = mean(ag.map((s) => s.summary.score)); areas.push({ key: 'agility', score: m, ex: 'agility', label: 'Agility', text: `Runs and arpeggios average ${Math.round(m)}.` }); }
  const iv = S.filter((s) => s.exId === 'intervals');
  if (iv.length) { const m = mean(iv.map((s) => s.summary.score)); areas.push({ key: 'intervals', score: m, ex: 'intervals', label: 'Interval leaps', text: `Leap exercises average ${Math.round(m)}.` }); }
  const sc = S.map((s) => s.summary.scoop).filter((x) => x != null);
  if (sc.length >= 3) { const m = mean(sc); if (m < -20) areas.push({ key: 'onset', score: 100 - Math.min(100, -m * 1.5), ex: 'match', label: 'Clean note starts', text: `You tend to slide up into notes (~${Math.round(-m)}¢).` }); }
  return areas.sort((a, b) => a.score - b.score);
}

function lessonPlan() {
  const w = weaknessModel();
  const day = new Date().getDate();
  const plan = [day % 2 ? 'lip-trill' : 'warm-hum'];
  const acc = w.find((a) => a.key === 'pitch');
  plan.push(acc && acc.score >= 75 ? 'intervals' : 'match');
  const focus = w.find((a) => !plan.includes(a.ex));
  plan.push(focus ? focus.ex : 'scale');
  if (!plan.includes('sustain') && !plan.includes('breath')) plan.push(day % 3 ? 'sustain' : 'breath');
  const finish = ['arpeggio', 'mix', 'vowels', 'agility', 'chest', 'head'].filter((x) => !plan.includes(x));
  plan.push(finish[day % finish.length]);
  return { plan, focus: focus || null, weakest: w[0] || null };
}

function historyDigest() {

    .sort((a, b) => Math.abs(b.avgCents) - Math.abs(a.avgCents)).slice(0, 5);

function compactResult(res) {
  return res.notes.map((n) => n.missed ? { note: nm(n.midi), lyric: n.lyric || undefined, missed: true } : ({
    note: nm(n.midi), lyric: n.lyric || undefined, durS: +n.dur.toFixed(2), medianCents: Math.round(n.median), withinTolPct: Math.round(n.inTol * 100),
    wobbleCents: Math.round(n.sustain ? n.sustain.wobble : n.std), onsetCents: n.onset != null ? Math.round(n.onset) : undefined,
    octaveOff: n.octave || undefined, clarityDb: Math.round(n.hnr),
    brightnessDb: n.tone ? +n.tone.alpha.toFixed(1) : undefined, h1h2Db: n.tone ? +n.tone.h1h2.toFixed(1) : undefined,
    sustain: n.sustain ? { driftEndCents: Math.round(n.sustain.endDelta), loudnessSlopeDbPerS: +n.sustain.loudSlope.toFixed(1), stoppedEarlyS: +n.sustain.shortBy.toFixed(2), gaps: n.sustain.gaps, vibrato: n.sustain.vibrato ? { rateHz: +n.sustain.vibrato.rate.toFixed(1), extentCents: Math.round(n.sustain.vibrato.extent) } : null } : undefined,
  }));
}

function aiPrompt(context) {
  return `You are an experienced, encouraging vocal coach giving feedback right after a student's attempt.

The numbers below were measured from the student's real microphone audio by an on-device pitch tracker (McLeod pitch method) and simple acoustic measures. Cents: 100 = one semitone; negative = flat, positive = sharp. "withinTolPct" = share of the held part of the note within ±${context.tol}¢. "wobbleCents" = pitch variation while holding (vibrato removed). "onsetCents" = pitch in the first 150 ms (strongly negative = scooping up). "clarityDb" is a periodicity-based harmonics-to-noise estimate (below ~11 suggests breathy tone or a noisy room). "brightnessDb" is 1–5 kHz energy relative to 0–1 kHz; a jump of 6+ dB on the top notes compared with lower notes can indicate pressed/strained tone. These tone measures come from a phone microphone, so treat them as tendencies, not diagnoses. Nothing here measures nasality directly.

EXERCISE: ${context.title}
${context.description}
TARGETS AND RESULT PER NOTE:
${JSON.stringify(context.notes)}
SUMMARY: ${JSON.stringify(context.summary)}
${context.breaks ? 'REGISTER BREAKS DETECTED: ' + JSON.stringify(context.breaks) : ''}
STUDENT HISTORY: ${JSON.stringify(historyDigest())}

Write the feedback a great teacher would say out loud:
1. One sentence on how it went overall, naming something specific they did well if the data supports it.
2. The two or three most important fixes. Tie each to a specific note or measurement, explain the likely cause in plain words, and give a concrete physical instruction (breath, jaw, tongue, soft palate, volume, vowel, imagery).
3. Exactly what to do on the next attempt.
Only mention problems the data shows. Never encourage pushing, forcing or singing through discomfort; if strain signs appear, advise lighter singing or rest. If you connect this to their history, do it in one short clause. Under 170 words, plain text, no headings or markdown.`;
}

async function askAI(prompt, onText) {
  const sample = Store.data.profile.geminiKey ? null : await getSample();
  if (sample) {
    const r = await sample(prompt, { modelTier: 'default', onText: onText ? (u) => onText(u.text) : undefined, cache: false });
    return r.text;
  }
  const p = Store.data.profile;
  if (p.geminiKey) return geminiAsk(prompt, onText);
  if (p.coachUrl) {
    const resp = await fetch(p.coachUrl, { method: 'POST', headers: { 'content-type': 'application/json', 'x-coach-token': p.coachToken || '' }, body: JSON.stringify({ prompt, max_tokens: 900 }) });
    const j = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(j.error || `The coach server returned an error (${resp.status}).`);
    if (onText) onText(j.text || '');
    return j.text || '';
  }
  if (!p.apiKey) { const e = new Error('Connect the AI coach in Profile (coach server, or an API key) to turn on AI feedback.'); e.code = 'no_ai'; throw e; }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': p.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: p.model || 'claude-sonnet-5-5', max_tokens: 900, messages: [{ role: 'user', content: prompt }] }),
  });
  const j = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error((j.error && j.error.message) || `The AI service returned an error (${resp.status}).`);
  const text = (j.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  if (onText) onText(text);
  return text;
}

// The model list changes over time, so pick the newest general-purpose Flash model the key can use.
async function geminiModel(key, fresh) {
  const p = Store.data.profile;
  if (p.geminiModel && !fresh) return p.geminiModel;
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || `Google returned an error (${r.status}).`);
  const ver = (n) => { const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); return m ? +m[1] : 0; };
  const ok = (j.models || []).filter((m) => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name) && !/image|tts|audio|live|embed|vision|robotics|computer|exp-\d|learnlm|gemma/i.test(m.name));
  const rank = (m) => (/flash/i.test(m.name) ? 100 : 0) - (/lite/i.test(m.name) ? 5 : 0) - (/preview/i.test(m.name) ? 3 : 0) + ver(m.name) * 2 - (/pro/i.test(m.name) ? 50 : 0);
  ok.sort((a, b) => rank(b) - rank(a));
  if (!ok.length) throw new Error('No Gemini text model is available to this key.');
  p.geminiModel = ok[0].name; Store.save();
  return p.geminiModel;
}
async function geminiAsk(prompt, onText, retried) {
  const p = Store.data.profile, key = p.geminiKey;
  const model = await geminiModel(key, retried);
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model}:generateContent`, {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 2048, temperature: 0.8 } }),
  });
  const j = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    if (!retried && (resp.status === 404 || resp.status === 400 && /model/i.test((j.error && j.error.message) || ''))) return geminiAsk(prompt, onText, true);
    if (resp.status === 429) throw new Error('The free AI limit is used up for the moment. Try again in a minute (daily limits reset overnight).');
    throw new Error((j.error && j.error.message) || `Google returned an error (${resp.status}).`);
  }
  const text = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).filter((x) => x.text && !x.thought).map((x) => x.text).join('\n').trim();
  if (!text) throw new Error('The AI returned an empty answer.');
  if (onText) onText(text);
  return text;
}

// ---------- Pitch graph (canvas) ----------
class PitchGraph {
  constructor(canvas) {
    this.cv = canvas; this.g = canvas.getContext('2d');
    this.o = { targets: [], frames: [], t0: 0, t1: 6, lo: 48, hi: 62, tol: 30, playhead: null, line: null };
    this.ro = new ResizeObserver(() => this.draw());
    this.ro.observe(canvas);
  }
  set(o) { Object.assign(this.o, o); this.draw(); }
  fitTo(midis, pad = 3) {
    const a = midis.filter((m) => m != null);
    if (!a.length) return;
    let lo = Math.floor(Math.min(...a)) - pad, hi = Math.ceil(Math.max(...a)) + pad;
    if (hi - lo < 10) { const c = (hi + lo) / 2; lo = Math.floor(c - 5); hi = Math.ceil(c + 5); }
    this.o.lo = lo; this.o.hi = hi;
  }
  draw() {
    const cv = this.cv, g = this.g, dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const o = this.o, gl = 38, pr = 10, pt = 10, pb = 18;
    const col = { line: cssv('--line-soft'), line2: cssv('--line'), text: cssv('--faint'), acc: cssv('--accent'), ok: cssv('--ok'), sh: cssv('--sharp'), fl: cssv('--flat'), muted: cssv('--muted'), panel2: cssv('--panel-2') };
    const y = (m) => pt + (1 - (m - o.lo) / (o.hi - o.lo)) * (H - pt - pb);
    const x = (t) => gl + ((t - o.t0) / (o.t1 - o.t0)) * (W - gl - pr);
    const rowH = (H - pt - pb) / (o.hi - o.lo);
    const targetSet = new Set(o.targets.map((t) => t.midi));
    if (o.line != null) targetSet.add(o.line);
    g.font = '10px "JetBrains Mono", monospace';
    g.textBaseline = 'middle';
    for (let m = Math.ceil(o.lo); m <= Math.floor(o.hi); m++) {
      const pc = ((m % 12) + 12) % 12, isC = pc === 0, black = [1, 3, 6, 8, 10].includes(pc);
      if (black) { g.fillStyle = col.panel2; g.globalAlpha = 0.45; g.fillRect(gl, y(m) - rowH / 2, W - gl - pr, rowH); g.globalAlpha = 1; }
      g.strokeStyle = isC ? col.line2 : col.line; g.lineWidth = 1;
      g.beginPath(); g.moveTo(gl, Math.round(y(m)) + 0.5); g.lineTo(W - pr, Math.round(y(m)) + 0.5); g.stroke();
      const show = targetSet.has(m) || isC || (rowH >= 15 && !black);
      if (show) { g.fillStyle = targetSet.has(m) ? col.acc : col.text; g.fillText(pcName(m), 4, y(m)); }
    }
    // tolerance band + target bars
    const band = Math.max(2, (o.tol / 100) * rowH);
    for (const tg of o.targets) {
      if (tg.midi == null) continue;
      const x0 = x(tg.start), x1 = x(tg.start + tg.dur) - 2, yy = y(tg.midi);
      if (x1 < gl || x0 > W) continue;
      g.fillStyle = col.acc; g.globalAlpha = 0.13; g.fillRect(x0, yy - band, x1 - x0, band * 2);
      g.globalAlpha = tg.state === 'done' ? 0.35 : 0.85; g.fillRect(x0, yy - 1.5, x1 - x0, 3); g.globalAlpha = 1;
      if (tg.res != null) { g.fillStyle = tg.res >= 80 ? col.ok : tg.res >= 55 ? col.acc : col.sh; g.beginPath(); g.arc(x1 - 3, yy - band - 6, 3, 0, 7); g.fill(); }
      if (tg.lyric && x1 - x0 > 14) { g.fillStyle = col.muted; g.font = '11px Figtree, sans-serif'; g.fillText(tg.lyric, x0 + 2, yy + band + 9); g.font = '10px "JetBrains Mono", monospace'; }
    }
    if (o.line != null) { g.strokeStyle = col.acc; g.setLineDash([5, 5]); g.lineWidth = 1.5; g.beginPath(); g.moveTo(gl, y(o.line)); g.lineTo(W - pr, y(o.line)); g.stroke(); g.setLineDash([]); g.fillStyle = col.acc; g.globalAlpha = 0.12; g.fillRect(gl, y(o.line) - band, W - gl - pr, band * 2); g.globalAlpha = 1; }
    // sung pitch
    const fr = o.frames;
    g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
    let prev = null;
    let ti = 0;
    for (let i = 0; i < fr.length; i++) {
      const f = fr[i];
      if (f.t < o.t0 - 0.1 || f.t > o.t1 + 0.1) { prev = null; continue; }
      if (!f.voiced) { prev = null; continue; }
      let ref = null;
      if (o.targets.length) {
        while (ti < o.targets.length - 1 && o.targets[ti].start + o.targets[ti].dur <= f.t - (o.shift || 0)) ti++;
        const tg = o.targets[ti];
        if (tg && f.t - (o.shift || 0) >= tg.start - 0.05 && tg.midi != null) {
          ref = tg.midi;
          const d = (f.midi - ref) * 100;
          if (Math.abs(d) > 600) ref += Math.round(d / 1200) * 12;
        }
      } else if (o.line != null) { ref = o.line; const d = (f.midi - ref) * 100; if (Math.abs(d) > 600) ref += Math.round(d / 1200) * 12; }
      else ref = Math.round(f.midi);
      const dev = ref == null ? null : (f.midi - ref) * 100;
      const c = dev == null ? col.muted : Math.abs(dev) <= o.tol ? col.ok : dev > 0 ? col.sh : col.fl;
      const px = x(f.t), py = y(clamp(f.midi, o.lo - 1, o.hi + 1));
      if (prev && f.t - prev.t < 0.07) { g.strokeStyle = c; g.beginPath(); g.moveTo(prev.px, prev.py); g.lineTo(px, py); g.stroke(); }
      else { g.fillStyle = c; g.beginPath(); g.arc(px, py, 1.5, 0, 7); g.fill(); }
      prev = { t: f.t, px, py };
    }
    if (o.playhead != null && o.playhead >= o.t0 && o.playhead <= o.t1) {
      g.strokeStyle = col.acc; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x(o.playhead), pt); g.lineTo(x(o.playhead), H - pb + 4); g.stroke();
    }
    // time axis
    g.fillStyle = col.text; g.textBaseline = 'alphabetic';
    const span = o.t1 - o.t0, step = span > 20 ? 5 : span > 8 ? 2 : 1;
    for (let s = Math.ceil(o.t0 / step) * step; s <= o.t1; s += step) { if (!o.live) g.fillText(s.toFixed(0) + 's', x(s) - 6, H - 4); }
  }
}

// ---------- Piano keyboard ----------
class Keyboard {
  constructor(wrap, opts = {}) {
    this.wrap = wrap; this.onTap = opts.onTap; this.active = null; this.target = null;
    this.setSpan(opts.low || 48, opts.high || 72);
  }
  setSpan(low, high) {
    low = low - (((low % 12) + 12) % 12);             // start on a C
    high = high + (11 - (((high % 12) + 12) % 12));    // end on a B
    this.low = low; this.high = high;
    const whites = [];
    for (let m = low; m <= high; m++) if (![1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12)) whites.push(m);
    const ww = 100 / whites.length;
    let html = '';
    whites.forEach((m, i) => { html += `<div class="w" data-m="${m}" style="left:${i * ww}%;width:${ww}%">${m % 12 === 0 ? `<span class="lbl">${pcName(m)}</span>` : ''}</div>`; });
    for (let m = low; m <= high; m++) {
      if (![1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12)) continue;
      const i = whites.indexOf(m - 1);
      html += `<div class="b" data-m="${m}" style="left:${(i + 1) * ww - ww * 0.3}%;width:${ww * 0.6}%"></div>`;
    }
    this.wrap.innerHTML = `<div class="kb" style="min-width:max(100%, ${whites.length * 24}px)">${html}</div>`;
    this.kb = this.wrap.firstElementChild;
    this.kb.addEventListener('pointerdown', (e) => { const k = e.target.closest('[data-m]'); if (k && this.onTap) { e.preventDefault(); this.onTap(+k.dataset.m); } });
    this.active = null;
    if (this.target != null) this.setTarget(this.target);
    if (this.range) this.markRange(this.range[0], this.range[1]);
  }
  key(m) { return this.kb.querySelector(`[data-m="${m}"]`); }
  setActive(m, cls) {
    if (this.active) this.active.className = this.active.className.replace(/ on-\w+/g, '');
    this.active = null;
    if (m == null) return;
    const k = this.key(m);
    if (!k) return;
    k.className += ' on-' + cls;
    this.active = k;
    const wr = this.wrap;
    if (wr.scrollWidth > wr.clientWidth) {
      const l = k.offsetLeft, r = l + k.offsetWidth;
      if (l < wr.scrollLeft + 20 || r > wr.scrollLeft + wr.clientWidth - 20) wr.scrollLeft = l - wr.clientWidth / 2;
    }
  }
  setTarget(m) {
    $$('.target', this.kb).forEach((k) => k.classList.remove('target'));
    this.target = m;
    if (m != null) { const k = this.key(m); if (k) k.classList.add('target'); }
  }
  markRange(lo, hi) {
    this.range = [lo, hi];
    $$('[data-m]', this.kb).forEach((k) => k.classList.toggle('in-range', +k.dataset.m >= lo && +k.dataset.m <= hi));
  }
}

// ---------- small SVG line chart ----------
function lineChart(series, opts = {}) {
  // series: [{name, color, pts:[{x (ms), y}]}]
  const W = Math.max(240, Math.round(opts.w || 600)), H = 190, l = 34, r = 10, t = 12, b = 24;
  const all = series.flatMap((s) => s.pts);
  if (new Set(all.map((p) => p.x)).size < 2) return `<p class="muted" style="padding:30px 0;text-align:center">Practise on a couple of days to see your trend here.</p>`;
  const x0 = Math.min(...all.map((p) => p.x)), x1 = Math.max(...all.map((p) => p.x)) || x0 + 1;
  const y0 = opts.min != null ? opts.min : Math.min(...all.map((p) => p.y)), y1 = opts.max != null ? opts.max : Math.max(...all.map((p) => p.y));
  const X = (v) => l + ((v - x0) / Math.max(1, x1 - x0)) * (W - l - r);
  const Y = (v) => t + (1 - (v - y0) / Math.max(1e-6, y1 - y0)) * (H - t - b);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">`;
  const ticks = opts.ticks || [y0, (y0 + y1) / 2, y1];
  for (const v of ticks) svg += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-soft)"/><text x="${l - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${opts.fmt ? opts.fmt(v) : Math.round(v)}</text>`;
  const fmtD = (ms) => { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); };
  svg += `<text x="${l}" y="${H - 6}" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${fmtD(x0)}</text><text x="${W - r}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="JetBrains Mono, monospace">${fmtD(x1)}</text>`;
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    if (s.area) svg += `<path d="${d} L${X(s.pts[s.pts.length - 1].x)} ${H - b} L${X(s.pts[0].x)} ${H - b}Z" fill="${s.color}" opacity=".12"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  return svg + '</svg>';
}

function sparkline(vals) {
  if (vals.length < 2) return '';
  const W = 200, H = 46, mn = Math.min(...vals, 0), mx = Math.max(...vals, 100);
  const X = (i) => 2 + (i / (vals.length - 1)) * (W - 4), Y = (v) => 4 + (1 - (v - mn) / (mx - mn)) * (H - 8);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W - 2} ${H} L2 ${H}Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function micErrorText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'Microphone access was blocked. On iPhone: Settings → Safari → Microphone → Allow (or tap “aA” in the address bar → Website Settings → Microphone). If you opened this inside the Claude app preview, the preview can’t use the mic: open the app’s own web address in Safari instead.';
  if (n === 'InsecureContext') return 'The microphone only works when the app is opened over https. Host the file (see Profile → Install on iPhone) and open that https address.';
  if (n === 'NoMediaDevices' || n === 'NotFoundError') return 'No microphone was found. Check that a mic is connected and that this browser can use it.';
  if (n === 'NotReadableError') return 'The microphone is busy in another app (a call, voice memo or recording). Close that and try again.';
  return 'The microphone could not start: ' + ((e && e.message) || 'unknown error') + '.';
}

// ===================== Shared runtime: routing, phrase performance =====================
const App = { cleanups: [], lesson: null, abort: null, view: 'home' };
const TABS = ['home', 'songs', 'instructor', 'practice', 'you'];
const PARENT = { track: 'songs', genre: 'songs', player: 'songs', svoice: 'songs', song: 'songs', analyze: 'songs', spsong: 'songs', singplay: 'practice', coach: 'instructor', live: 'practice', exlib: 'practice', exercise: 'practice', range: 'practice', guitar: 'practice', glesson: 'practice', sing: 'practice', progress: 'you', profile: 'you', me: 'you', welcome: 'home' };
const VIEWS = {};

function onCleanup(fn) { App.cleanups.push(fn); }
function cleanup() {
  if (App.abort) App.abort.aborted = true;
  App.abort = null;
  App.cleanups.splice(0).forEach((f) => { try { f(); } catch (e) { console.error(e); } });
  if (Engine.ctx) Engine.stopAll();
}
function go(view, params) {
  cleanup();
  if (App.view && App.view !== view) App.prevView = { v: App.view, p: App.params };
  App.view = view;
  App.params = params || {};
  const tab = PARENT[view] || view;
  $$('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.go === tab ? 'page' : 'false'));
  if (TABS.includes(view) && location.hash !== '#' + view) { try { history.replaceState(null, '', '#' + view); } catch (e) { location.hash = view; } }
  // fresh container each time so listeners from the previous screen can't fire here
  const old = $('#view');
  const el = old.cloneNode(false);
  el.className = 'view';
  old.replaceWith(el);
  $('#main').scrollTop = 0;
  const HUBBED = { coach: 'Instructor', live: 'Practice', exlib: 'Practice', guitar: 'Practice', singplay: 'Practice', progress: 'You', profile: 'You' };
  try {
    VIEWS[view](el, App.params);
    if (HUBBED[view] && !$('.hub-back', el)) { el.insertAdjacentHTML('afterbegin', `<button class="btn ghost small hub-back" style="align-self:flex-start;padding-left:4px">${icon('back')}${HUBBED[view]}</button>`); el.firstElementChild.addEventListener('click', () => go(PARENT[view])); }
  } catch (e) { console.error(e); el.innerHTML = `<div class="notice error">Something went wrong showing this screen: ${esc(e.message)}</div>`; }
  try { if (typeof updateMini === 'function') updateMini(); } catch (e) {}
  try { if (typeof mobileAfterNav === 'function') mobileAfterNav(view); } catch (e) {}
}

class Aborted extends Error {}
async function waitCtx(t, sig) {
  while (Engine.ctx.currentTime < t) {
    if (sig && sig.aborted) throw new Aborted();
    await sleep(25);
  }
  if (sig && sig.aborted) throw new Aborted();
}

// Mic start with a readable error.
async function micOrNotice(container) {
  try { await Engine.startMic(); return true; }
  catch (e) {
    console.warn(e);
    if (container) container.innerHTML = `<div class="notice error"><div><b>Microphone unavailable.</b> ${esc(micErrorText(e))}<br><span class="muted">You can still analyse a recording: Songs → Analyse a recording.</span></div></div>`;
    else toast(micErrorText(e), 6000);
    return false;
  }
}

// Plays (optionally) a demo, counts in, listens while the person sings and returns frames
// relative to the phrase start (t = 0 on the first target note).
async function performPhrase(o) {
  const ctx = Engine.ctx, sig = o.sig;
  const total = o.targets.reduce((m, t) => Math.max(m, t.start + t.dur), 0);
  const spb = 60 / (o.bpm || 60);
  if (o.demo) {
    o.status && o.status('Listen', 'demo');
    const ds = ctx.currentTime + 0.15;
    o.onDemo && o.onDemo(ds);
    const end = Engine.playSeq(o.demoTargets || o.targets, ds, { glide: o.glide });
    await waitCtx(end + 0.3, sig);
  }
  let T0;
  const frames = [];
  if (o.call) {
    T0 = ctx.currentTime + 0.12;
  } else {
    const n = o.countIn == null ? 2 : o.countIn;
    const cs = ctx.currentTime + 0.15;
    for (let i = 0; i < n; i++) Engine.click(cs + i * spb, i === 0);
    T0 = cs + n * spb;
  }
  const unsub = Engine.onFrame((f) => {
    if (f.t < T0 - 0.4) return;
    const r = { t: f.t - T0, te: f.te - T0, hf: f.hf, midi: f.midi, voiced: f.voiced, c: f.c, rms: f.rms };
    frames.push(r);
    o.onFrame && o.onFrame(r);
  });
  Engine.startRecording();
  o.onStart && o.onStart(T0);
  if (o.guide) Engine.playSeq(o.targets, T0);
  if (o.metronome && !o.call) {
    const beats = Math.ceil(total / spb);
    for (let k = 0; k < beats; k++) Engine.click(T0 + k * spb, false);
  }
  try {
    if (!o.call) {
      // count-in status
      while (ctx.currentTime < T0) { if (sig && sig.aborted) throw new Aborted(); const left = Math.ceil((T0 - ctx.currentTime) / spb); o.status && o.status('Get ready… ' + left, 'count'); await sleep(40); }
    }
    o.status && o.status(o.call ? 'Your turn — sing' : 'Sing', 'sing');
    await waitCtx(T0 + total + Engine.latency() + (o.call ? 0.3 : 0.4), sig);
  } finally {
    unsub();
    var rec = Engine.stopRecording();
  }
  return { frames, total, rec: rec ? { samples: rec.samples, sr: rec.sr, offset: rec.t0 - T0 } : null };
}

// Breath gaps: silent stretches ≥ 0.25 s between the first and last sung frame of a phrase.
function breathGaps(frames, total) {
  const v = frames.filter((f) => f.voiced && f.t >= -0.1 && f.t <= total + 0.4);
  if (v.length < 2) return 0;
  let gaps = 0;
  for (let i = 1; i < v.length; i++) if (v[i].t - v[i - 1].t >= 0.25) gaps++;
  return gaps;
}

// Replays a slice of a recording while moving a playhead on a graph.
function replay(rec, graph, from, to, btn) {
  if (!rec) return;
  Engine.stopAll();
  const off = Math.max(0, from - rec.offset);
  const p = Engine.playBuffer(rec, off);
  const stopAt = Engine.ctx.currentTime + (to - from) + 0.1;
  if (btn) btn.innerHTML = icon('stop') + 'Stop';
  let raf;
  const tick = () => {
    const now = Engine.ctx.currentTime;
    const t = from + (now - p.start - off);
    graph.set({ playhead: t });
    if (now < stopAt && App.replaying === p) raf = requestAnimationFrame(tick);
    else { try { p.src.stop(); } catch (e) {} graph.set({ playhead: null }); if (btn) btn.innerHTML = icon('play') + 'Replay'; if (App.replaying === p) App.replaying = null; }
  };
  App.replaying = p;
  raf = requestAnimationFrame(tick);
  onCleanup(() => cancelAnimationFrame(raf));
}
function toggleReplay(rec, graph, from, to, btn) {
  if (App.replaying) { const p = App.replaying; App.replaying = null; try { p.src.stop(); } catch (e) {} graph.set({ playhead: null }); btn.innerHTML = icon('play') + 'Replay'; return; }
  replay(rec, graph, from, to, btn);
}

function autoTranspose(midis) {
  const r = rangeOf();
  const a = midis.filter((m) => m != null);
  if (!a.length) return 0;
  const lo = Math.min(...a), hi = Math.max(...a), mid = (lo + hi) / 2;
  let best = 0, bestP = Infinity;
  for (let s = -24; s <= 24; s++) {
    const p = Math.max(0, r.low - (lo + s)) * 3 + Math.max(0, hi + s - r.high) * 4 + Math.abs(mid + s - (r.low + r.high) / 2) * 0.3;
    if (p < bestP) { bestP = p; best = s; }
  }
  return best;
}

// Pure functions (no DOM) so the same code runs in the app and in the Node tests.

const GTR_STD = [40, 45, 50, 55, 59, 64]; // E2 A2 D3 G3 B3 E4, low → high

// ---------- Karplus–Strong plucked string (demo audio + test signals) ----------
function gtrPluck(sr, freq, dur, opts) {
  opts = opts || {};
  const n = Math.floor(sr * dur), out = new Float32Array(n);
  const N = sr / freq;
  const Lint = Math.max(2, Math.floor(N - 0.6));
  const d = N - 0.5 - Lint;                // fractional delay handled by a first-order allpass
  const C = (1 - d) / (1 + d);
  const buf = new Float32Array(Lint);
  const vel = opts.vel == null ? 0.5 : opts.vel;
  const rand = opts.rand || Math.random;
  // excitation: low-passed noise with a pick-position comb
  let lp = 0;
  const pick = Math.max(1, Math.round(Lint * (opts.pickPos || 0.18)));
  const ex = new Float32Array(Lint);
  for (let i = 0; i < Lint; i++) { lp = lp * 0.5 + (rand() * 2 - 1) * 0.5; ex[i] = lp; }
  for (let i = 0; i < Lint; i++) buf[i] = vel * (ex[i] - (i >= pick ? ex[i - pick] : 0));
  const rho = opts.decay || (0.9965 + Math.min(0.0025, 40 / sr));
  const damp = opts.mute ? 0.9 : rho;
  let idx = 0, prev = 0, apX = 0, apY = 0, dc = 0, dcY = 0;
  for (let i = 0; i < n; i++) {
    const x = buf[idx];
    const avg = damp * 0.5 * (x + prev);
    prev = x;
    const y = C * avg + apX - C * apY; apX = avg; apY = y;
    buf[idx] = y;
    idx = idx + 1 === Lint ? 0 : idx + 1;
    // DC blocker
    dcY = x - dc + 0.995 * dcY; dc = x;
    out[i] = dcY;
  }
  return out;
}

// midis: array low→high strings (null = not played). dir: 'down' | 'up'.
function gtrStrum(sr, midis, opts) {
  opts = opts || {};
  const dur = opts.dur || 2.2, spread = opts.spread == null ? 0.012 : opts.spread;
  const out = new Float32Array(Math.floor(sr * (dur + 0.1)));
  const order = midis.map((m, i) => i).filter((i) => midis[i] != null);
  if (opts.dir === 'up') order.reverse();
  order.forEach((s, k) => {
    const p = gtrPluck(sr, 440 * Math.pow(2, (midis[s] - 69) / 12), dur, { vel: (opts.vel || 0.45) * (opts.dir === 'up' ? 0.8 : 1), rand: opts.rand, mute: opts.mute });
    const off = Math.floor(k * spread * sr);
    for (let i = 0; i < p.length && i + off < out.length; i++) out[i + off] += p[i];
  });
  return out;
}

// ---------- spectrum ----------
function gtrSpectrum(samples, start, sr, N) {
  N = N || 16384;
  const re = new Float32Array(N), im = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const j = start + i;
    const v = j >= 0 && j < samples.length ? samples[j] : 0;
    re[i] = v * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1)));
  }
  pcFFT(re, im);
  const mag = new Float32Array(N / 2);
  for (let k = 0; k < N / 2; k++) mag[k] = Math.sqrt(re[k] * re[k] + im[k] * im[k]);
  return { mag, sr, N };
}
// AnalyserNode dB data → same shape
function gtrSpectrumFromDb(db, sr, N) {
  const mag = new Float32Array(db.length);
  for (let k = 0; k < db.length; k++) mag[k] = db[k] > -200 ? Math.pow(10, db[k] / 20) : 0;
  return { mag, sr, N };
}

function gtrPeaks(sp, a4) {
  const { mag, sr, N } = sp, bin = sr / N;
  const k0 = Math.max(2, Math.floor(60 / bin)), k1 = Math.min(mag.length - 2, Math.ceil(2200 / bin));
  let mx = 0;
  for (let k = k0; k <= k1; k++) if (mag[k] > mx) mx = mag[k];
  const peaks = [];
  if (mx <= 0) return { peaks, max: 0 };
  for (let k = k0; k <= k1; k++) {
    const v = mag[k];
    if (v < mx * 0.015 || v <= mag[k - 1] || v < mag[k + 1]) continue;
    const a = Math.log(mag[k - 1] + 1e-12), b = Math.log(v + 1e-12), c = Math.log(mag[k + 1] + 1e-12);
    const den = a - 2 * b + c;
    const sh = Math.abs(den) > 1e-9 ? clampD(0.5 * (a - c) / den, -0.5, 0.5) : 0;
    const f = (k + sh) * bin;
    peaks.push({ f, a: v / mx, midi: 69 + 12 * Math.log2(f / (a4 || 440)) });
  }
  return { peaks, max: mx };
}

// Pitch-class profile. Peaks that are overtones of a lower, comparably strong peak (3rd, 5th, 6th, 7th
// harmonics) are down-weighted so a ringing C doesn't read as Cmaj7 or an A as A7.
function gtrChroma(peaks) {
  const c = new Float64Array(12);
  const H = [3, 5, 6, 7, 9, 10];
  for (const p of peaks) {
    const r = Math.round(p.midi), dev = Math.abs(p.midi - r);
    if (dev > 0.45) continue;
    let harm = 1;
    for (const q of peaks) {
      if (q.f >= p.f / 2.5) break;
      if (q.a < p.a * 0.25) continue;
      for (const h of H) { const ratio = p.f / (q.f * h); if (Math.abs(1200 * Math.log2(ratio)) < 30) { harm = Math.min(harm, h === 3 || h === 6 ? 0.45 : 0.3); } }
    }
    const w = Math.log1p(p.a * 40) * (p.f > 1100 ? 0.6 : 1) * (1 - dev) * harm;
    c[((r % 12) + 12) % 12] += w;
  }
  return c;
}

const GTR_TYPES = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], sus2: [0, 2, 7], sus4: [0, 5, 7], '5': [0, 7] };
const GTR_PC = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const HARM = [[0, 1], [12, 0.75], [19, 0.25], [24, 0.4], [28, 0.12], [31, 0.12]];
const TYPE_PRIOR = { '': 0, m: 0, '7': -0.02, maj7: -0.02, m7: -0.02, sus2: -0.004, sus4: -0.006, '5': -0.008 };
let _templates = null;
function gtrTemplates() {
  if (_templates) return _templates;
  _templates = [];
  for (let r = 0; r < 12; r++) for (const [ty, iv] of Object.entries(GTR_TYPES)) {
    const t = new Float64Array(12);
    iv.forEach((x, i) => HARM.forEach(([h, w]) => { t[(r + x + h) % 12] += w * (i === 0 ? 1.25 : 1); }));
    let n = 0; for (const v of t) n += v * v; n = Math.sqrt(n);
    for (let i = 0; i < 12; i++) t[i] /= n;
    _templates.push({ root: r, type: ty, name: GTR_PC[r] + ty, pcs: iv.map((x) => (r + x) % 12), t });
  }
  return _templates;
}
function gtrParseName(name) {

  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  const acc = m[2] === '♯' || m[2] === '#' ? 1 : m[2] === '♭' || m[2] === 'b' ? -1 : 0;
  return { root: (base + acc + 12) % 12, type: m[3] };

// Returns { best, ranked:[{name,score}], bass, energy } or null when nothing chord-like is sounding.
function gtrDetectChord(sp, a4) {
  const { peaks } = gtrPeaks(sp, a4);
  if (peaks.length < 2) return null;
  const c = gtrChroma(peaks);
  let n = 0; for (const v of c) n += v * v; n = Math.sqrt(n);
  if (n <= 0) return null;
  // bass = lowest reasonably strong peak
  let bass = null;
  for (const p of peaks) if (p.a > 0.12 && Math.abs(p.midi - Math.round(p.midi)) < 0.45) { bass = ((Math.round(p.midi) % 12) + 12) % 12; break; }
  const ranked = gtrTemplates().map((T) => {
    let s = 0; for (let i = 0; i < 12; i++) s += (c[i] / n) * T.t[i];
    if (bass != null && T.root === bass) s += 0.03;
    s += TYPE_PRIOR[T.type];
    return { name: T.name, root: T.root, type: T.type, pcs: T.pcs, score: s };
  }).sort((a, b) => b.score - a.score);

  const p = gtrParseName(name);
  const hit = det.ranked.find((r) => r.root === p.root && r.type === p.type);
  return hit ? hit.score : 0;
}
// Does the detected chord match the target? Same pitch-class set counts (Dsus2 = Asus4 sounds identical).
function gtrMatches(det, name) {
  if (!det) return false;
  const p = gtrParseName(name);
  const tgt = gtrTemplates().find((t) => t.root === p.root && t.type === p.type);
  const best = det.best;
  const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
  if (same(best.pcs, tgt.pcs)) return true;
  return gtrScoreFor(det, name) >= best.score - 0.015;
}

// ---------- per-string check for a known voicing ----------
// frets: 6 numbers low→high, -1 = muted. Returns [{s, state:'ok'|'quiet'|'ringing'|'unknown', db}]
function gtrStringCheck(sp, frets, tuning, a4) {
  tuning = tuning || GTR_STD;
  const { mag, sr, N } = sp, bin = sr / N;
  const level = (midi) => {
    const f = (a4 || 440) * Math.pow(2, (midi - 69) / 12);
    const k0 = Math.max(1, Math.floor((f * Math.pow(2, -0.35 / 12)) / bin)), k1 = Math.min(mag.length - 1, Math.ceil((f * Math.pow(2, 0.35 / 12)) / bin));
    let m = 0; for (let k = k0; k <= k1; k++) if (mag[k] > m) m = mag[k];
    return m;
  };
  let ref = 0;
  const kA = Math.floor(70 / bin), kB = Math.ceil(1500 / bin);
  for (let k = kA; k <= kB; k++) if (mag[k] > ref) ref = mag[k];
  if (ref <= 0) return frets.map((_, s) => ({ s, state: 'unknown', db: null }));
  const sounding = frets.map((f, s) => (f >= 0 ? tuning[s] + f : null));
  const H = [0, 12, 19.02, 24, 27.86, 31.02, 33.69, 36];
  const out = [];
  for (let s = 0; s < 6; s++) {
    const own = sounding[s];
    const m = own != null ? own : tuning[s];
    const others = sounding.filter((x, i) => x != null && i !== s);
    const cands = [];
    for (let h = 0; h < (own != null ? 4 : 3); h++) {
      const p = m + H[h];
      if (p > 98) continue;
      // a harmonic only proves this string if no other sounding note puts energy there
      if (others.some((o) => H.some((oh) => Math.abs(o + oh - p) < 0.45))) continue;
      if (own != null && others.includes(own)) continue;
      cands.push(p);
    }
    if (!cands.length) { out.push({ s, state: 'unknown', db: null }); continue; }
    const db = 20 * Math.log10(Math.max(...cands.map(level)) / ref + 1e-9);
    if (own != null) out.push({ s, state: db > -38 ? 'ok' : 'quiet', db });
    else out.push({ s, state: db > -28 ? 'ringing' : 'ok', db });
  }

}

// ---------- onset (pick / strum) detection on the tracker's transient energy ----------
class GtrOnsets {
  constructor() { this.prev = []; this.floor = -120; this.last = -9; this.peakAfter = null; }
  // returns onset time or null
  push(te, hf) {
    const L = 10 * Math.log10(hf + 1e-14);
    if (L < this.floor) this.floor = L; else this.floor += (L - this.floor) * 0.003;
    const mn = this.prev.length ? Math.min(...this.prev) : L;
    this.prev.push(L); if (this.prev.length > 4) this.prev.shift();
    if (L - mn >= 7 && L > this.floor + 15 && te - this.last > 0.075) { this.last = te; return te; }
    return null;

    const t0 = onsets[i], t1 = i + 1 < onsets.length ? onsets[i + 1] : t0 + 1.2;
    const v = frames.filter((f) => f.voiced && f.t >= t0 + 0.03 && f.t < Math.min(t1, t0 + 0.35));
    if (v.length < 3) { ev.push({ t: t0, midi: null }); continue; }
    const ms = v.map((f) => f.midi).sort((a, b) => a - b);
    ev.push({ t: t0, midi: ms[ms.length >> 1] });

}

// Reject onsets that don't add sustained energy (e.g. the metronome click leaking from the speaker
// into the mic). A strum keeps ringing; a click is gone within ~40 ms.
function gtrValidOnsets(frames, onsets) {
  const rmsAt = (a, b) => { const v = frames.filter((f) => f.t >= a && f.t <= b); return v.length ? Math.sqrt(v.reduce((s, f) => s + f.rms * f.rms, 0) / v.length) : 0; };

    const before = rmsAt(o - 0.09, o - 0.03), after = rmsAt(o + 0.07, o + 0.16);
    return after > 0.004 && after > before * 1.22;

function gtrPluckedString(samples, sr, iOnset, candidates, a4) {
  const N = 8192, gap = Math.floor(0.015 * sr);
  const before = gtrSpectrum(samples, iOnset - N - gap, sr, N), after = gtrSpectrum(samples, iOnset + gap, sr, N);
  const bin = sr / N;
  const lvl = (sp, f) => { const k0 = Math.max(1, Math.floor((f * Math.pow(2, -0.3 / 12)) / bin)), k1 = Math.min(sp.mag.length - 1, Math.ceil((f * Math.pow(2, 0.3 / 12)) / bin)); let m = 1e-9; for (let k = k0; k <= k1; k++) m = Math.max(m, sp.mag[k]); return m; };
  const fz = (m) => (a4 || 440) * Math.pow(2, (m - 69) / 12);
  const H = [0, 12, 19.02, 24];
  let best = null, bestInc = -99, second = -99;
  candidates.forEach((m, s) => {
    if (m == null) return;
    const others = candidates.filter((x, j) => x != null && j !== s);
    let inc = -99;
    for (const h of H) {
      const p = m + h;
      if (others.some((o) => H.some((oh) => Math.abs(o + oh - p) < 0.4))) continue;
      const d = 20 * Math.log10(lvl(after, fz(p)) / lvl(before, fz(p)));
      inc = Math.max(inc, d);
    }
    if (inc === -99) { const d = 20 * Math.log10(lvl(after, fz(m)) / lvl(before, fz(m))); inc = d - 3; }
    if (inc > bestInc) { second = bestInc; bestInc = inc; best = s; } else if (inc > second) second = inc;
  });
  return { string: bestInc >= 4 ? best : null, inc: bestInc, margin: bestInc - second };
}

// Hammer-on / pull-off check on a recorded attempt. Returns per expected pair: {ok, picked, sounded}
// pairs: [{t (s, attack of first note), from (midi), to (midi), tChange (expected time of 2nd note)}]
function gtrLegatoCheck(frames, onsets, pairs) {
  return pairs.map((p) => {
    const win = frames.filter((f) => f.voiced && f.t > p.t + 0.05 && f.t < p.tChange + 0.6);
    const second = win.filter((f) => Math.abs(f.midi - p.to) < 0.5);
    if (second.length < 4) return { ok: false, sounded: false, picked: false };
    const tSwitch = second[0].t;
    const picked = onsets.some((o) => Math.abs(o - tSwitch) < 0.07 || (o > p.t + 0.12 && o < tSwitch + 0.03 && o > tSwitch - 0.12));
    return { ok: !picked, sounded: true, picked, tSwitch };
  });
}

// Combined: the pitch tracker hears the newest (loudest) note right after the attack; spectra before/after
// the attack decide octave pairs (the lower string's odd harmonics only rise if the lower string was plucked).
function gtrWhichString(samples, sr, tOnsetRec, iOnset, candidates, frames, a4) {
  const N = 8192, gap = Math.floor(0.015 * sr), bin = sr / N;
  const before = gtrSpectrum(samples, iOnset - N - gap, sr, N), after = gtrSpectrum(samples, iOnset + gap, sr, N);
  const lvl = (sp, f) => { const k0 = Math.max(1, Math.floor((f * Math.pow(2, -0.3 / 12)) / bin)), k1 = Math.min(sp.mag.length - 1, Math.ceil((f * Math.pow(2, 0.3 / 12)) / bin)); let m = 1e-9; for (let k = k0; k <= k1; k++) m = Math.max(m, sp.mag[k]); return m; };
  const fz = (m) => (a4 || 440) * Math.pow(2, (m - 69) / 12);
  const inc = (m) => 20 * Math.log10(lvl(after, fz(m)) / lvl(before, fz(m)));
  const pc = (m) => ((Math.round(m) % 12) + 12) % 12;
  const spec = gtrPluckedString(samples, sr, iOnset, candidates, a4);
  const octavePick = (group) => {
    // group: strings with the same pitch class, low → high; walk up while the lower string's odd harmonics didn't rise
    const g = group.slice().sort((x, y) => candidates[x] - candidates[y]);
    for (let k = 0; k < g.length - 1; k++) { const m = candidates[g[k]]; if (inc(m) >= 5) return g[k]; }
    return g[g.length - 1];
  };
  if (spec.string != null) {
    const group = candidates.map((c, s) => (c != null && pc(c) === pc(candidates[spec.string]) ? s : null)).filter((s) => s != null);
    return { string: group.length > 1 ? octavePick(group) : spec.string, via: 'spectrum' };
  }
  const v = frames.filter((f) => f.voiced && f.t >= tOnsetRec + 0.05 && f.t <= tOnsetRec + 0.16).map((f) => f.midi).sort((a, b) => a - b);
  if (v.length >= 3) {
    const m = v[v.length >> 1];
    const same = candidates.map((c, s) => (c != null && Math.abs(c - m - Math.round((c - m) / 12) * 12) < 0.5 ? s : null)).filter((s) => s != null);
    if (same.length) return { string: same.length > 1 ? octavePick(same) : same[0], via: 'pitch', midi: m };
  }
  return { string: null, via: 'unclear' };
}
